<p class="lm-fig">Fig. 1  ·  Front controls of the VTR-1  ·  Tap the picture to play, too</p>`},{n:4,name:"Insert & Cut",cls:"lm-pg",html:`<div class="lm-sec"><h1><em>2</em> · Insert &amp; Cut</h1><small>Tape, then cut</small></div>
<ol class="lm-steps">
<li><span class="lm-n">1</span><p><b>Insert a clip</b> — a video, a GIF, or a still from this phone. Or tap <b>Try sample</b>.</p></li>
<li><span class="lm-n">2</span><p>Open <b>01 CUT</b>. Pick a tool.</p></li>
<li><span class="lm-n">3</span><p>Drag the <b>yellow ends</b> on the filmstrip, or step one frame at a time.</p></li>
</ol>
<div class="lm-tools">
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><path d="M8 6h12M8 18h12M14 6v12"/></svg></div>
<b>Trim</b><span>Keep only the good part. In here / Out here, Split, speed.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><path d="M7 7h10v4H9"/><path d="M17 17H7v-4h8"/><path d="M7 17l-3-3 3-3M17 7l3 3-3 3"/></svg></div>
<b>Bounce</b><span>Plays forward, then back — on the picture and in the GIF.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="8" height="12" rx="1"/><rect x="14" y="6" width="8" height="12" rx="1"/><path d="M10 12h4"/></svg></div>
<b>Join</b><span>Glue scenes. Cut, Fade or Dip between them.</span>
</div>
</div>
<div class="lm-kicker">On Trim</div>
<div class="lm-chips">
<span class="lm-chip">In here</span><span class="lm-chip">Out here</span><span class="lm-chip">Split</span>
<span class="lm-chip">0.5×</span><span class="lm-chip">1×</span><span class="lm-chip">1.5×</span><span class="lm-chip">2×</span>
<span class="lm-chip">Smooth</span><span class="lm-chip">Slower</span><span class="lm-chip">Reverse</span>
<span class="lm-chip">Hold here</span><span class="lm-chip">Loop</span>
</div>
<div class="lm-kicker">On Bounce</div>
<div class="lm-chips">
<span class="lm-chip">Smooth</span><span class="lm-chip">Transition</span><span class="lm-chip">Speed</span><span class="lm-chip">Turn at</span>
</div>
<div class="lm-kicker">On Join</div>
<div class="lm-chips">
<span class="lm-chip">Keep scene</span><span class="lm-chip">Split here</span><span class="lm-chip">Add clip</span>
<span class="lm-chip">Play join</span><span class="lm-chip">Cut</span><span class="lm-chip">Fade</span><span class="lm-chip">Dip</span>
<span class="lm-chip">Save joined GIF</span>
</div>
<div class="lm-warn"><div class="lm-bang">!</div><p>Stills cannot use Trim, Bounce or Join. Those keys stay dim. Use Crop, Grade, Stickers, then Save still.</p></div>`},{n:5,name:"Look",cls:"lm-pg",html:`<div class="lm-sec"><h1><em>3</em> · Look</h1><small>Frame it, then the light</small></div>
<ol class="lm-steps">
<li><span class="lm-n">1</span><p>Tap <b>02 LOOK</b>.</p></li>
<li><span class="lm-n">2</span><p><b>Crop</b> — drag the frame. Corners resize it.</p></li>
<li><span class="lm-n">3</span><p><b>Grade</b> — tap a look, then fine-tune the sliders.</p></li>
</ol>
<div class="lm-tools lm-two">
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><rect x="7" y="8" width="10" height="8" stroke-dasharray="2 1.5"/></svg></div>
<b>Crop</b><span>Free, 1:1, 4:5, 3:4, 9:16, 16:9. Turn, Mirror, Full, Circle, Straight, nudge.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.5 1.5M16.9 16.9l1.5 1.5M5.6 18.4l1.5-1.5M16.9 7.1l1.5-1.5"/></svg></div>
<b>Grade</b><span>The picture updates as you drag. Reset puts it back. Keep stores it.</span>
</div>
</div>
<div class="lm-kicker">Looks</div>
<div class="lm-chips">
<span class="lm-chip">Flat</span><span class="lm-chip">Punch</span><span class="lm-chip">Fade</span><span class="lm-chip">Night</span>
<span class="lm-chip lm-dim">Lamp *</span><span class="lm-chip lm-dim">Heat *</span><span class="lm-chip lm-dim">Haze *</span>
</div>
<div class="lm-kicker">Sliders</div>
<div class="lm-chips">
<span class="lm-chip">Light</span><span class="lm-chip">Contrast</span><span class="lm-chip">Color</span>
<span class="lm-chip">Tint</span><span class="lm-chip">Warmth</span><span class="lm-chip">Soft</span><span class="lm-chip">Falloff</span>
<span class="lm-chip lm-dim">Glow *</span><span class="lm-chip lm-dim">Clarity *</span>
</div>
<p class="lm-note"><b>*</b> After <b>MENU › Unlock</b>, Assist appears as a third tile under LOOK. It reads this frame and moves sliders. It does not redraw the picture. Studio looks and sliders marked * arrive with it.</p>
<div class="lm-warn"><div class="lm-bang">!</div><p>The Assist code is not printed in this book. Type it in the Unlock box from the ··· menu.</p></div>`},{n:6,name:"Add & Page",cls:"lm-pg",html:`<div class="lm-sec"><h1><em>4</em> · Add &amp; Page</h1><small>Stickers, or a comic page</small></div>
<div class="lm-kicker">On a clip — 03 ADD</div>
<div class="lm-tools lm-two">
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 9h4v10H7v-4"/><path d="M8 12h6M11 9v6"/></svg></div>
<b>Stickers</b><span>A PNG sticker or a line of text. Drag it. Erase bits that should hide under hair or a collar.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><rect x="12" y="9" width="8" height="8" stroke-width="1.8"/></svg></div>
<b>End result</b><span>A small picture of the crop you would save. Open it before SAVE.</span>
</div>
</div>
<div class="lm-chips">
<span class="lm-chip">Sticker</span><span class="lm-chip">Text</span><span class="lm-chip">Size</span><span class="lm-chip">Pick</span><span class="lm-chip">Keep</span>
</div>
<div class="lm-kicker" style="margin-top:6px">On a page — CLIP / PAGE</div>
<ol class="lm-steps">
<li><span class="lm-n">1</span><p>Flip the top switch to <b>PAGE</b>, or tap <b>Comic page</b> on the empty recorder.</p></li>
<li><span class="lm-n">2</span><p><b>Add pictures</b> — stills from this phone.</p></li>
<li><span class="lm-n">3</span><p>Set <b>Layout</b>, drop <b>Bubbles</b>, tap a reading <b>Order</b>, then SAVE.</p></li>
</ol>
<div class="lm-tools">
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7"/><rect x="13" y="4" width="8" height="7"/><rect x="3" y="13" width="18" height="7"/></svg></div>
<b>Layout</b><span>Comic, Manga or Webtoon. 2 or 3 columns, Whole picture, Fill panel.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-5 4V8a2 2 0 0 1 2-2z"/></svg></div>
<b>Bubble</b><span>Speech, Thought, Caption, Shout. Type it, then nudge.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><text x="2" y="9" font-size="7" font-family="LmPlex,sans-serif" font-weight="700" stroke="none" fill="#16120f">1</text><text x="2" y="15" font-size="7" font-family="LmPlex,sans-serif" font-weight="700" stroke="none" fill="#16120f">2</text><text x="2" y="21" font-size="7" font-family="LmPlex,sans-serif" font-weight="700" stroke="none" fill="#16120f">3</text></svg></div>
<b>Order</b><span>Tap panels 1, 2, 3 in the order you read them.</span>
</div>
</div>
<p class="lm-note">Comic reads left to right, then the next row. Manga is the other way. The page menu has Add pictures and this Manual.</p>`},{n:7,name:"Save",cls:"lm-pg",html:`<div class="lm-sec"><h1><em>5</em> · Save</h1><small>The red REC key</small></div>
<ol class="lm-steps">
<li><span class="lm-n">1</span><p>Turn on <b>ADD › End result</b> so you see the crop, not the full frame.</p></li>
<li><span class="lm-n">2</span><p>Tap the red <b>SAVE</b> key.</p></li>
<li><span class="lm-n">3</span><p>Pick what to write, a size, and whether it loops.</p></li>
</ol>
<div class="lm-tools">
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg></div>
<b>GIF</b><span>The cut, crop, grade, loop and bounce, in one file. For video or GIF tape.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="11" r="2"/><path d="M7 17l4-4 3 3 3-2 4 3"/></svg></div>
<b>Still</b><span>This one frame as a PNG picture.</span>
</div>
<div class="lm-tool">
<div class="lm-ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9l6 3-6 3z"/></svg></div>
<b>Clip</b><span>A short video. Only when the tape is a video. Sound when the phone allows it.</span>
</div>
</div>
<div class="lm-kicker">Loop &amp; size</div>
<div class="lm-chips">
<span class="lm-chip lm-hot">Loop forever</span><span class="lm-chip">Play once</span>
<span class="lm-chip">S · 240</span><span class="lm-chip">M · 360</span><span class="lm-chip">L · 480</span>
<span class="lm-chip">Keep</span>
</div>
<p class="lm-note">While it writes, a meter appears on the picture. <b>STOP</b> cancels the file. Two or more Join scenes can also <b>Save joined GIF</b> from the Join tool.</p>
<div class="lm-warn"><div class="lm-bang">!</div><p>Saves to this phone only. Nothing leaves the unit. Look in this phone’s pictures when it is done.</p></div>`},{n:8,name:"Settings",cls:"lm-pg",html:`<div class="lm-sec"><h1><em>6</em> · Settings</h1><small>The ··· menu, and the quiet keys</small></div>
<p class="lm-note" style="margin-top:0">Tap the <b>···</b> key on the top bar. That is the recorder menu.</p>
<div class="lm-menufig">
<div class="lm-mtile">
<svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 8l4-4 4 4"/><rect x="5" y="14" width="14" height="6" rx="1"/></svg>
<b>Open clip</b><span>Swap the tape</span>
</div>
<div class="lm-mtile">
<svg viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<b>Unlock</b><span>Assist code</span>
</div>
<div class="lm-mtile lm-here">
<svg viewBox="0 0 24 24"><path d="M5 5h14v16H5z"/><path d="M9 5v16"/><path d="M11 9h6M11 13h6"/></svg>
<b>Manual</b><span>This book</span>
</div>
</div>
<div class="lm-kicker" style="margin-top:12px">Always on the unit</div>
<div class="lm-qa" style="flex:none">
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.2 2.4c-.8.4-1.2 1-1.2 2"/><path d="M12 17h.01"/></svg></div>
<p><b>?  Guide</b> Numbers every part of the screen. While it is on, a tap explains the key instead of running it. Tap ? again to turn it off.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M7 11h10v9H7z"/></svg></div>
<p><b>Hold a key</b> A tip balloon appears. Nothing is saved or changed. Useful when the Guide is off.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/><path d="M9 14h6"/></svg></div>
<p><b>Keep</b> Stores that tool’s settings on this phone. A number appears. Tap the number later to put them back.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 1 1 0 10"/></svg></div>
<p><b>Undo</b> Steps back one cut, crop, grade or sticker move. The top-left key.</p>
</div>
</div>
<div class="lm-warn"><div class="lm-bang">!</div><p>Unlock shows Assist under LOOK, plus the studio looks (Lamp, Heat, Haze) and Glow / Clarity. The Assist code is not printed here. Lock hides them again. Nothing leaves this phone.</p></div>`},{n:9,name:"Troubleshooting",cls:"lm-pg",html:`<div class="lm-sec"><h1><em>7</em> · If it fails</h1><small>Before you assume it is broken</small></div>
<div class="lm-qa">
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 3.4 2.3c-.8.4-1.3 1-1.3 2"/><path d="M12 17.2h.01"/></svg></div>
<p><b>A key explains itself, but does nothing.</b> Guide is on. Tap the Guide (?) key to turn it off, then try again.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 12h8"/></svg></div>
<p><b>Trim, Bounce or Join will not open.</b> The tape is a still. Use Crop, Grade, Stickers, then Save still.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><rect x="12" y="9" width="8" height="8"/></svg></div>
<p><b>The saved GIF is not the frame I saw.</b> Turn on <b>ADD › End result</b> and check the crop before SAVE.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><path d="M5 8h9M14 8l-3-3M14 8l-3 3"/><path d="M19 16H10M10 16l3-3M10 16l3 3"/></svg></div>
<p><b>Bounce pauses at the turn.</b> Set Bounce <b>Transition</b> to 0. Leave Turn at on End.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="4" height="12"/><rect x="10" y="8" width="4" height="8"/><rect x="16" y="5" width="4" height="14"/></svg></div>
<p><b>The GIF looks choppy.</b> On Trim, turn <b>Smooth</b> on to blend each frame with the one before it.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.2 6.2l1.6 1.6M16.2 16.2l1.6 1.6M6.2 17.8l1.6-1.6M16.2 7.8l1.6-1.6"/></svg></div>
<p><b>There is no Assist tile.</b> Open <b>MENU › Unlock</b> and type the Assist code (not in this book). Assist moves sliders only — it never redraws the picture.</p>
</div>
<div class="lm-row">
<div class="lm-mark"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l4 4V6L7 10H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></div>
<p><b>I cannot hear the tape.</b> Preview starts muted. On a video, tap the sound key. A saved Clip keeps sound when the phone allows it. GIFs have none.</p>
</div>
