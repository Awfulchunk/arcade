<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Papa Potato 2.0.1</title>
<style>
/* Papa Potato 2.0.1 (Tough & J's Arcade). Full rework: corner-iso continuous map, belts, machines, power, jams, wash room scrubbing. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0c1220;color:#eee;font-family:"Courier New",Courier,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--tap:44px;--panel-h:196px}
@media (max-height:700px){:root{--panel-h:150px}}
#app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 50px var(--panel-h) 50px;
  grid-template-areas:"top" "play" "orders" "panel" "nav"}
@media (min-aspect-ratio:1/1){#app{grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto 50px minmax(0,1fr) 50px;grid-template-areas:"play top" "play orders" "play panel" "play nav"}}
#top{grid-area:top;background:#0f1828;border-bottom:2px solid #2a3a58;padding:5px 6px 4px}
#top .r1{display:grid;grid-template-columns:auto 1fr auto;align-items:center}
#top .brand{color:#ffe066;font:700 11px/1 monospace;letter-spacing:.06em}
#top .brand span{color:#7f93ad;font-size:8px;margin-left:4px}
#top .stats{text-align:center;font:700 13px/1 monospace;white-space:nowrap;overflow:hidden}
#top .stats b{color:#ffe066;margin:0 4px}
#top .stats i{font-style:normal;color:#f0c890;margin:0 4px}
#top .stats u{text-decoration:none;color:#e8c070;margin:0 4px}
#top .stats u.messy{color:#ff9a6a}
#top .clock{font:700 10px/1 monospace;color:#9fd0ff}
#top .r2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:5px}
.m{padding:0 3px}
.m .k{font:700 8px/1 monospace;color:#9ab;letter-spacing:.06em;display:flex;justify-content:space-between}
.bar{height:7px;background:#152038;border:1px solid #2e4060;border-radius:2px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%}
.hunger i{background:#e09040}.energy i{background:#81ad78}.mood i{background:#d68ac8}.hands i{background:#7ac0e0}
.bar.low i{background:#d04a3a}
#top .r3{font:700 9px/1.25 monospace;color:#fff3c0;margin-top:4px;min-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#play{grid-area:play;position:relative;overflow:hidden;background:#1b2130;touch-action:none;min-width:0;min-height:0}
#play canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#zoom{position:absolute;right:6px;top:6px;z-index:3;display:grid;grid-template-rows:44px 44px 44px;row-gap:6px}
#zoom button,#roomBtns button{width:44px;height:44px;border-radius:8px;border:2px solid #3a5070;background:rgba(14,22,38,.85);color:#ffe066;font:700 18px/1 monospace}
#zoom button.on{border-color:#ffe066}
#roomBtns{position:absolute;left:6px;top:6px;z-index:3;display:grid;grid-template-columns:auto auto;column-gap:6px}
#roomBtns button{width:auto;min-width:44px;padding:0 8px;font-size:10px}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:4;max-width:92%;background:rgba(10,14,24,.92);border:1px solid #6a5020;border-radius:6px;padding:6px 9px;font:700 10px/1.3 monospace;color:#fff3c0;pointer-events:none;text-align:center;transition:opacity .3s}
#toast.off{opacity:0}
#wantB{position:absolute;left:6px;top:56px;z-index:3;max-width:62%;min-height:44px;text-align:left;background:rgba(255,246,226,.95);border:2px solid #f08a3c;border-radius:12px 12px 12px 3px;padding:4px 8px;font:700 10px/1.25 monospace;color:#5a3a1a;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#wantB i{display:block;font-style:normal;font-size:8px;color:#b9581f;letter-spacing:.06em}
#wantB b{color:#b9581f}
#wantB span{display:inline-block;margin-left:6px;background:#f08a3c;color:#fff;border-radius:6px;padding:1px 5px;font-size:9px}
#wantB.poor span{background:#8a7a6a}
#wantB.off{display:none}
.away .big{font:700 13px/1.3 monospace;color:#e6eefc;margin:2px 0 6px}.away .big b{color:#ffe066}.away .big small{color:#9fb0c6;font-size:9px;margin-left:4px}
.away .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:6px}.away .grid div{background:#121c2e;border:1px solid #24344e;border-radius:7px;padding:4px;font:700 8px/1.2 monospace;color:#9fb0c6;text-align:center}
.away .grid b{display:block;font-size:13px;color:#ffe066}.away .wl{font:700 10px/1.35 monospace;color:#fff3c0;margin:2px 0}.away .warn{color:#ff9a6a}
.away .tl p{font:700 9px/1.35 monospace;color:#cfdcef;margin:1px 0}.away .tl i{font-style:normal;color:#9fd0ff;display:inline-block;min-width:58px}.away .note{font:700 8px/1.3 monospace;color:#7f93ad;margin-top:6px}
#orders{grid-area:orders;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:4px;padding:3px 4px;background:#0f1828;border-top:2px solid #2a3a58}
button{font-family:inherit}
.ob{height:44px;border-radius:7px;border:2px solid #3a5070;background:#16233a;color:#e6eefc;font:700 11px/1 monospace;letter-spacing:.04em}
.ob.on{border-color:#ffe066;color:#ffe066;background:#2a2410}
.ob.alert{border-color:#ff5b4a;color:#ff8a7a;animation:blink 1s infinite}
@keyframes blink{50%{background:#3a1410}}
#panel{grid-area:panel;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#0c1220;padding:3px 4px}
#cmds{display:grid;grid-template-columns:minmax(0,1fr) 44px;column-gap:4px;height:100%}
#cmdList{min-width:0}
#cmdPg{display:grid;grid-template-rows:44px minmax(0,1fr) 44px;row-gap:3px;align-items:center}
#cmdPg button{height:44px;width:44px;border-radius:6px;border:2px solid #3a5070;background:#1a2a44;color:#ffe066;font:700 16px/1 monospace}
#cmdPg button:disabled{opacity:.35}
#cmdPg span{font:700 9px/1.2 monospace;color:#9ab;text-align:center}
.cb{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;column-gap:4px;align-items:center;margin-bottom:2px;background:#121c2e;border:1px solid #24344e;border-radius:7px;padding:2px}
.cb .pm{height:44px;border-radius:6px;border:2px solid #3a5070;background:#1a2a44;color:#ffe066;font:700 20px/1 monospace}
.cb .mid{min-width:0}
.cb .nm{font:700 9px/10px monospace;height:10px;color:#cfe0f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between}
.cb .nm b{color:#ffe066;margin-left:4px}
.cb input[type=range]{display:block;width:100%;height:44px;margin:0;accent-color:#ffe066}
.cb.lock{opacity:.45}
.cb .why{font:700 8px/1.1 monospace;color:#c090a0;min-height:44px;display:flex;align-items:center}
@media (max-width:400px){#top .stats{font-size:11px}#top .stats b,#top .stats i,#top .stats u{margin:0 2px}}
@media (max-width:359px){#top .brand span{display:none}#top .brand{font-size:10px}#top .stats{font-size:10px}#top .stats b,#top .stats i,#top .stats u{margin:0 1px}}
#edit{display:none}
#app.editing #cmds{display:none}#app.editing #edit{display:block}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:3px;margin-bottom:4px}
.tabs button{height:44px;border-radius:6px;border:2px solid #3a5070;background:#16233a;color:#cfe0f5;font:700 10px/1 monospace}
.tabs button.on{border-color:#ffe066;color:#ffe066}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:4px;row-gap:4px;margin-bottom:4px}
.ti{min-height:48px;border-radius:6px;border:2px solid #3a5070;background:#121c2e;color:#e6eefc;font:700 9px/1.15 monospace;padding:3px;text-align:left}
.ti.on{border-color:#7dff9a;background:#13301e}
.ti small{display:block;color:#9ab;font-size:8px}
.eact{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:4px;margin-top:2px}
.eact button{height:44px;border-radius:6px;border:2px solid #3a5070;background:#1a2a44;color:#ffe066;font:700 10px/1 monospace}
.eact button:disabled{opacity:.35}
.enote{font:700 9px/1.3 monospace;color:#fff3c0;margin:2px 0 4px;min-height:12px}
#nav{grid-area:nav;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:4px;padding:3px 4px;background:#0f1828;border-top:2px solid #2a3a58}
.nb{height:44px;border-radius:7px;border:2px solid #4a5a30;background:#1d2614;color:#d8f0a0;font:700 11px/1 monospace}
.nb.on{border-color:#ffe066;color:#ffe066}
#ovl{position:absolute;left:0;top:0;right:0;bottom:0;z-index:20;background:rgba(4,8,14,.72);display:none}
#ovl.show{display:block}
#sheet{position:absolute;left:4%;right:4%;top:5%;bottom:5%;background:#0f1828;border:2px solid #3a5070;border-radius:10px;display:grid;grid-template-rows:50px minmax(0,1fr)}
#sheetHd{display:grid;grid-template-columns:1fr 44px;align-items:center;padding:3px 3px 3px 10px;border-bottom:2px solid #2a3a58}
#sheetHd b{color:#ffe066;font:700 13px/1 monospace;letter-spacing:.06em}
#sheetHd button{width:44px;height:44px;border-radius:7px;border:2px solid #6a3a3a;background:#2a1414;color:#ffb0a0;font:700 16px/1 monospace}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:6px}
.sec{font:700 10px/1 monospace;color:#9fd0ff;letter-spacing:.1em;margin:10px 2px 5px;border-bottom:1px solid #24344e;padding-bottom:3px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;align-items:center;background:#121c2e;border:1px solid #24344e;border-radius:7px;padding:4px 4px 4px 7px;margin-bottom:4px}
.row .nm{font:700 10px/1.2 monospace;color:#e6eefc}
.row .nm b{color:#ffe066}
.row .fx{font:700 9px/1.3 monospace;color:#9fb0c6;margin-top:2px}
.btns{display:grid;grid-auto-flow:column;column-gap:4px}
.go{min-width:56px;height:44px;padding:0 6px;border-radius:7px;border:2px solid #4a6a30;background:#1d2a14;color:#d8f0a0;font:700 10px/1.1 monospace}
.go.done{border-color:#ffe066;color:#ffe066;background:#2a2410}
.go.poor{border-color:#6a4860;color:#c090a0;background:#22141e}
.go.lock{border-color:#333;color:#777;background:#151515}
.help p{font:700 10px/1.45 monospace;color:#d0dcec;margin:0 2px 8px}
.help p b{color:#ffe066}
#card{position:absolute;left:6px;right:6px;bottom:6px;z-index:6;background:rgba(12,18,32,.96);border:2px solid #ffe066;border-radius:9px;padding:7px;display:none}
#card.show{display:block}
#card .ct{display:grid;grid-template-columns:1fr 44px;align-items:start}
#card .ct b{color:#ffe066;font:700 12px/1.2 monospace}
#card .ct button{width:44px;height:44px;border-radius:7px;border:2px solid #6a3a3a;background:#2a1414;color:#ffb0a0;font:700 15px/1 monospace}
#card .cx{font:700 9px/1.35 monospace;color:#cfe0f5;margin:3px 0 6px}
#card .cbtn{display:grid;grid-auto-flow:column;column-gap:5px}
#card .cbtn button{height:44px;border-radius:7px;border:2px solid #4a6a30;background:#1d2a14;color:#d8f0a0;font:700 10px/1 monospace}
#boot{position:absolute;left:0;top:0;right:0;bottom:0;z-index:40;background:#0c1220;display:grid;align-content:center;justify-items:center;text-align:center}
#boot b{color:#ffe066;font:700 22px/1.2 monospace}
#boot span{color:#9ab;font:700 11px/1.4 monospace;margin-top:6px}
#boot.off{display:none}
</style></head><body>
<div id="app">
 <div id="top">
  <div class="r1"><div class="brand">PAPA POTATO<span>2.0.1</span></div><div class="stats"><b id="hCoins">0c</b><i id="hFood">FOOD 1</i><u id="hPeels">PEELS 0</u><span id="hLv" style="color:#9fd86a">LV 1</span></div><div class="clock" id="hClock">8:00</div></div>
  <div class="r2">
   <div class="m"><div class="k">HUNGER<span id="pH">80</span></div><div class="bar hunger" id="bH"><i></i></div></div>
   <div class="m"><div class="k">ENERGY<span id="pE">90</span></div><div class="bar energy" id="bE"><i></i></div></div>
   <div class="m"><div class="k">MOOD<span id="pM">60</span></div><div class="bar mood" id="bM"><i></i></div></div>
   <div class="m"><div class="k">HANDS<span id="pD">100</span></div><div class="bar hands" id="bD"><i></i></div></div>
  </div>
  <div class="r3" id="hState">Starting…</div>
 </div>
 <div id="play"><canvas id="cv"></canvas>
  <div id="roomBtns"><button type="button" id="goK" data-tt-allow-overlap>KITCHEN</button><button type="button" id="goW" data-tt-allow-overlap>WASH</button></div>
  <div id="zoom"><button type="button" id="zIn" data-tt-allow-overlap>+</button><button type="button" id="zOut" data-tt-allow-overlap>&minus;</button><button type="button" id="zFol" class="on" data-tt-allow-overlap>&#9678;</button></div>
  <div id="toast" data-tt-allow-overlap class="off"></div>
  <button type="button" id="wantB" class="off" data-tt-allow-overlap></button>
  <div id="card"><div class="ct"><b id="cardT"></b><button type="button" id="cardX">&#10005;</button></div><div class="cx" id="cardX2"></div><div class="cbtn" id="cardB"></div></div>
 </div>
 <div id="orders"><button class="ob" type="button" data-o="eat">EAT</button><button class="ob" type="button" data-o="nap">NAP</button><button class="ob" type="button" data-o="clean">CLEAN</button><button class="ob" type="button" data-o="fix">FIX</button><button class="ob" type="button" data-o="work">WORK</button></div>
 <div id="panel"><div id="cmds"></div><div id="edit"></div></div>
 <div id="nav"><button class="nb" type="button" data-n="inv">INV</button><button class="nb" type="button" data-n="radio">RADIO</button><button class="nb" type="button" data-n="shop">SHOP</button><button class="nb" type="button" data-n="help">HELP</button><button class="nb" type="button" data-n="edit">EDIT</button></div>
 <div id="ovl"><div id="sheet"><div id="sheetHd"><b id="sheetT">SHOP</b><button type="button" id="sheetX">&#10005;</button></div><div id="sheetBody"></div></div></div>
 <div id="boot"><b>PAPA POTATO 2</b><span>Loading the kitchen…</span></div>
</div>
<script>
/* ===== Papa Potato 2.0.1 — simulation (fresh rework, t1213/t1223). One continuous iso map: kitchen + wash room.
   Grid tiles (1 tile = 0.6 m). Papa, the potatoes and every machine are real objects on that grid.
   No Math.random / Date in here: everything runs off the seeded RNG so setSeed(n);step(k) is repeatable. ===== */
var PP2=(function(){
"use strict";
var VERSION="2.0.1",SAVE_KEY="papaPotato2.save.v1";
var W=26,H=24,DT=1/60,POT_CAP=360,PEEL_CAP=260;
var DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
var DNAME=["EAST","SOUTH","WEST","NORTH"];
var KIT={x0:0,y0:0,x1:14,y1:24},WSH={x0:15,y0:0,x1:26,y1:16};
var DOOR=[{x:14,y:3},{x:14,y:4}];
var FIX={
  pile:{x:1,y:19,w:5,h:4},
  chute:{x:6,y:0,w:2,h:1},
  scanK:{x:12,y:14,w:2,h:2},
  scanW:{x:15,y:14,w:2,h:2},
  pool:{x:17,y:12,w:3,h:4},
  hole:{x:25,y:0},
  outlet:{wall:"W",y:8,x:0,range:4.5,cap:5}
};
var CANAL_TILES=[];(function(){var x,y;for(x=20;x<=25;x++)CANAL_TILES.push([x,15]);for(y=14;y>=0;y--)CANAL_TILES.push([25,y]);})();
var CANAL_PTS=[{x:20,y:15.5},{x:25.5,y:15.5},{x:25.5,y:0.05}];
var CANAL_LEN=5.5+15.45;
var PACE=["CHILL","EASY","STEADY","BRISK","GRIND"],SPD=[0.6,0.8,1.0,1.25,1.5],DRN=[0.55,0.75,1.0,1.45,2.0];
var STYLE=[{n:"NEAT",sp:0.8,peels:2},{n:"NORMAL",sp:1.0,peels:3},{n:"QUICK",sp:1.3,peels:5}];
var SPEED_NAME=["OFF","SLOW","STEADY","FAST"],SPEEDV=[0,0.6,1.0,1.5];
var DELIVER=["CHUTE","SCANNER","CARRY"];
var COMMANDS=[
  {id:"pace",name:"WORK PACE",min:0,max:4,step:1,def:2,fmt:"pace",what:"How fast he walks and works.",effect:"CHILL x0.6 speed (hunger and energy drain x0.55) up to GRIND x1.5 speed (drain x2.0)."},
  {id:"eat",name:"EAT WHEN HUNGER <",min:0,max:70,step:5,def:0,fmt:"pct",what:"He goes to the cooler to eat when hunger drops below the number.",effect:"1 can = +55 hunger. OFF = never. Hunger tops out at 100."},
  {id:"nap",name:"NAP WHEN ENERGY <",min:0,max:70,step:5,def:0,fmt:"pct",what:"He goes to bed when energy drops below the number.",effect:"He sets his sack down beside the bed first and picks it up after. OFF = he dozes on the floor when he runs out."},
  {id:"wake",name:"NAP UNTIL ENERGY >",min:50,max:100,step:10,def:100,fmt:"pct",what:"How rested he is when he gets up.",effect:"Lower = short naps. Needs NAP WHEN."},
  {id:"clean",name:"CLEAN WHEN PEELS >",min:0,max:90,step:5,def:0,fmt:"num",what:"He sweeps when the floor peel count goes over the number.",effect:"Peels slow him up to 30% at 90 peels. The broom + dustpan sweeps twice as fast as bare hands."},
  {id:"rinse",name:"RINSE WHEN HANDS <",min:0,max:70,step:5,def:30,fmt:"pct",what:"He rinses at the sink built into the peel table.",effect:"Under 25% clean hands, peeling is 15% slower."},
  {id:"style",name:"PEEL STYLE",min:0,max:2,step:1,def:1,fmt:"style",what:"How carefully he peels.",effect:"NEAT x0.8 speed, 2 peels. NORMAL x1.0, 3 peels. QUICK x1.3, 5 peels."},
  {id:"autob",name:"KEEP FOOD AT LEAST",min:0,max:9,step:1,def:0,fmt:"num",what:"Buys food cans for you whenever you have the coins.",effect:"OFF = buy food in the SHOP."},
  {id:"deliver",name:"SEND PEELED TO",min:0,max:2,step:1,def:0,fmt:"deliver",need:"roomKey",what:"Where he takes peeled potatoes.",effect:"CHUTE: kitchen chute, pays by dirt (dirty 2c). SCANNER: the X-ray drops them into the wash-room pool, where they wait for him (EMPTY POOL AT); they soak in the canal on the way to the ship hole. CARRY: he walks them through the door to the scrub tub and scrubs them himself (clean = 5c)."},
  {id:"pool",name:"EMPTY POOL AT",min:0,max:30,step:1,def:6,fmt:"num",need:"roomKey",what:"Peeled potatoes from the X-ray wait in the wash-room pool until he comes for them.",effect:"When the pool holds this many he walks over, scoops them out, scrubs them at the tub (SCRUB ON) and tosses them into the canal to ship. OFF = they stay in the pool (it holds 48)."},
  {id:"scrub",name:"SCRUB AT THE TUB",min:0,max:1,step:1,def:1,fmt:"onoff",need:"roomKey",what:"He scrubs dirty potatoes in the wash-room scrub tub.",effect:"ON = he scrubs what is in the tub and tosses clean ones into the canal. You can also brush them yourself with your finger."},
  {id:"fix",name:"FIX JAMS",min:0,max:1,step:1,def:1,fmt:"onoff",need:"machine",what:"He walks over and clears jammed machines.",effect:"ON = he drops his work (not eating or sleeping) to clear a jam. OFF = only when you tap the machine and press FIX."},
  {id:"belts",name:"BELT SPEED",min:0,max:3,step:1,def:2,fmt:"speed",need:"belt",what:"How fast every belt tile runs.",effect:"OFF stops all belts. Belts need power."},
  {id:"mspeed",name:"MACHINE SPEED",min:0,max:3,step:1,def:2,fmt:"speed",need:"machine",what:"How hard the hoppers, auto peelers and washers run.",effect:"FAST = more potatoes per minute but jams twice as often. SLOW = half the jams."},
  {id:"wash",name:"WASH BEFORE PEEL",min:0,max:1,step:1,def:0,fmt:"onoff",need:"sink",what:"He rinses raw potatoes in the kitchen sink first.",effect:"Peeled potatoes come out half as dirty."},
  {id:"water",name:"WATER WHEN DRY >",min:0,max:90,step:10,def:0,fmt:"num",need:"plant",what:"He waters the plant.",effect:"A watered plant: energy drains 10% slower in the kitchen."},
  {id:"tv",name:"TV",min:0,max:1,step:1,def:0,fmt:"onoff",need:"tvArmchair",what:"Turns the TV on.",effect:"Pair with WATCH WHEN."},
  {id:"watch",name:"WATCH WHEN ENERGY <",min:0,max:70,step:5,def:0,fmt:"pct",need:"tvArmchair",what:"He sits in the armchair and watches TV.",effect:"Slow energy back (slower than a nap). Needs the TV ON."},
  {id:"lamp",name:"LAMP",min:0,max:1,step:1,def:0,fmt:"onoff",need:"lamp",what:"The floor lamp.",effect:"ON: peeling 8% faster."},
  {id:"radio",name:"RADIO",min:0,max:1,step:1,def:0,fmt:"onoff",need:"radio",what:"The radio.",effect:"ON: energy drains 20% slower and he works 5% faster. Stations or your own songs (RADIO button)."}
];
var BOX={};COMMANDS.forEach(function(c){BOX[c.id]=c;});
var UPS=[

  var g=walkOverride||this.grid().walk,N=W*H,dist=new Float64Array(N),prev=new Int32Array(N),i,heap=[];
  for(i=0;i<N;i++){dist[i]=1e9;prev[i]=-1;}
  if(sx<0||sy<0||sx>=W||sy>=H)return {dist:dist,prev:prev};
  function push(e){heap.push(e);var k=heap.length-1;while(k>0){var p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;var t=heap[p];heap[p]=heap[k];heap[k]=t;k=p;}}
  function pop(){var top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;var k=0;for(;;){var l=2*k+1,r=l+1,m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;var t=heap[m];heap[m]=heap[k];heap[k]=t;k=m;}}return top;}
  var s0=sy*W+sx;dist[s0]=0;push([0,s0]);
  while(heap.length){var e=pop(),c=e[1];if(e[0]>dist[c])continue;var cx=c%W,cy=(c/W)|0;
    for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;var n=ny*W+nx;if(!g[n])continue;
      if(dx&&dy&&(!g[cy*W+nx]||!g[ny*W+cx]))continue;var nd=dist[c]+(dx&&dy?1.414:1);if(nd<dist[n]){dist[n]=nd;prev[n]=c;push([nd,n]);}}}
  return {dist:dist,prev:prev};
};
P.papaTile=function(){var p=this.s.papa,x=Math.floor(p.x),y=Math.floor(p.y);if(!this.walkable(x,y)){var best=null,bd=1e9;for(var dy=-3;dy<=3;dy++)for(var dx=-3;dx<=3;dx++){if(this.walkable(x+dx,y+dy)){var d=dx*dx+dy*dy;if(d<bd){bd=d;best=[x+dx,y+dy];}}}if(best)return best;}return [x,y];};
P.sinkTile=function(t){var f=fp(t);if(t.r===0)return [f.x+f.w-1,f.y];if(t.r===1)return [f.x,f.y+f.h-1];if(t.r===2)return [f.x,f.y+f.h-1];return [f.x+f.w-1,f.y+f.h-1];};
P.spotsFor=function(t,sinkOnly){
  var s=this,list=[];
  if(t==="pile")list=around(FIX.pile);
  else if(t==="chute")list=[[6,1],[7,1]];
  else if(t==="scanK")list=[[11,14],[11,15]];
  else if(t==="canal"){CANAL_TILES.forEach(function(c){list.push([c[0]-1,c[1]],[c[0],c[1]-1]);});}
  else if(t&&typeof t==="object"){if(sinkOnly&&t.id==="table"){var sk=s.sinkTile(t);list=around({x:sk[0],y:sk[1],w:1,h:1});}else list=around(fp(t));}
  return list.filter(function(p){return s.walkable(p[0],p[1]);});
};
P.route=function(targets){
  var st=this.papaTile(),F=this.field(st[0],st[1]),best=null,bd=1e9,i;
  for(i=0;i<targets.length;i++){var t=targets[i],d=F.dist[t[1]*W+t[0]];if(d<bd){bd=d;best=t;}}
  if(!best||bd>=1e9)return null;
  var path=[],c=best[1]*W+best[0],s0=st[1]*W+st[0];while(c>=0&&c!==s0){path.push([c%W+0.5,((c/W)|0)+0.5]);c=F.prev[c];}path.reverse();
  return {path:path,spot:best,cost:bd};
};
/* ---------- power: the free wall outlet + generators. Each belt/machine takes the nearest source in range that still has load left ---------- */
P.sources=function(){var o=[{u:0,x:0.6,y:FIX.outlet.y+0.5,range:FIX.outlet.range,cap:FIX.outlet.cap,id:"outlet"}],g=this.up("gen");
  this.s.objs.forEach(function(b){if(b.id==="generator"){var f=fp(b);o.push({u:b.u,x:f.x+f.w/2,y:f.y+f.h/2,range:7+1.5*g,cap:12+8*g,id:"generator"});}});return o;};
P.calcPower=function(){
  var src=this.sources(),cons=[],map={};src.forEach(function(s){s.used=0;});
  this.s.objs.forEach(function(o){if(LOAD[o.id]){var f=fp(o);cons.push({o:o,x:f.x+f.w/2,y:f.y+f.h/2,load:LOAD[o.id]});}});
  cons.forEach(function(c){var best=null,bd=1e9;src.forEach(function(s){var d=Math.hypot(c.x-s.x,c.y-s.y);if(d<=s.range&&s.used+c.load<=s.cap&&d<bd){bd=d;best=s;}});
    if(best){best.used+=c.load;map[c.o.u]=best.u;}else map[c.o.u]=-1;});
  this.power={src:src,map:map};return this.power;
};
P.powered=function(o){if(!this.power)this.calcPower();var v=this.power.map[o.u];return v!=null&&v>=0;};
P.machAt=function(x,y){if(x<0||y<0||x>=W||y>=H)return null;return this.grid().occ[y*W+x]||null;};
P.beltAt=function(x,y){if(x<0||y<0||x>=W||y>=H)return null;return this.grid().belt[y*W+x]||null;};
/* can a potato moving in dir d enter tile (x,y)? */
P.accepts=function(p,x,y,d){
  var key=this.key(),b=this.beltAt(x,y);
  if(b){if((b.r+2)%4===d)return null;var n=0,minp=9;for(var i=0;i<this.s.pots.length;i++){var q=this.s.pots[i];if(q.m==="belt"&&q.o===b.u){n++;if(q.p<minp)minp=q.p;}}if(n>=3||minp<0.32)return null;return {k:"belt",o:b};}
  if(inRect(x,y,FIX.chute)&&d===3)return {k:"chute"};
  if(inRect(x,y,FIX.scanK)&&d===0)return key&&this.poolCount()<C.poolCap?{k:"scan"}:null;
  if(isWater(x,y))return key?{k:"water",x:x,y:y}:null;
  var o=this.machAt(x,y);if(!o)return null;
  if(o.id==="table"){if(p.k===0&&o.tray.length<6)return {k:"tray",o:o};return null;}
  if(o.id==="tub"){if(p.k===1&&o.q.length<8)return {k:"tub",o:o};return null;}
  if(isMach(o.id)){if(d!==o.r)return null;var cap=o.id==="hopper"?3:2;if(o.q.length>=cap)return null;
    if(o.id==="hopper"&&p.k!==0)return null;if(o.id==="autoPeeler"&&p.k!==0)return null;if(o.id==="washer"&&(p.k!==1||p.d<=0.15))return null;return {k:"mach",o:o};}
  return null;
};
P.give=function(p,a,d){
  if(a.k==="belt"){p.m="belt";p.o=a.o.u;p.p=0;p.ed=d;this.s.stats.beltMoved++;return;}
  if(a.k==="chute"){this.ship(p,"chute");return;}
  if(a.k==="scan"){this.toScanner(p);return;}
  if(a.k==="water"){this.toWater(p,a.x+0.5,a.y+0.5);return;}
  if(a.k==="tray"){p.m="tray";p.o=a.o.u;a.o.tray.push(p.u);return;}
  if(a.k==="tub"){p.m="tub";p.o=a.o.u;a.o.q.push(p.u);return;}
  if(a.k==="mach"){p.m="mach";p.o=a.o.u;a.o.q.push(p.u);return;}
};
P.frontOut=function(o){var f=fp(o),d=DIRS[o.r],cx,cy;
  if(o.r===0){cx=f.x+f.w;cy=f.y+Math.floor((f.h-1)/2);}else if(o.r===2){cx=f.x-1;cy=f.y+Math.floor((f.h-1)/2);}
  else if(o.r===1){cx=f.x+Math.floor((f.w-1)/2);cy=f.y+f.h;}else{cx=f.x+Math.floor((f.w-1)/2);cy=f.y-1;}
  return [cx,cy,o.r];};
P.touchesPile=function(o){var f=fp(o),Q=FIX.pile;var ox=Math.max(0,Math.min(f.x+f.w,Q.x+Q.w)-Math.max(f.x,Q.x)),oy=Math.max(0,Math.min(f.y+f.h,Q.y+Q.h)-Math.max(f.y,Q.y));
  var adjX=(f.x+f.w===Q.x||Q.x+Q.w===f.x)&&oy>0,adjY=(f.y+f.h===Q.y||Q.y+Q.h===f.y)&&ox>0;return adjX||adjY;};
/* ---------- economy ---------- */
P.potValue=function(p,via){var v=p.k===0?1:(p.d<=0.15?4:p.d<=0.55?3:2);if(via==="hole"&&p.k===1&&p.d<=0.15)v=5;if(p.sl)v=Math.max(1,v-1);return v;};
P.ship=function(p,via){var v=this.potValue(p,via);this.s.shipped++;if(p.k===1&&p.d<=0.15)this.s.shippedClean++;
  if(this.placed("neonSign")&&this.s.shipped%20===0){v+=1;this.s.tips++;}
  this.s.coins+=v;this.s.earned+=v;this.emit({e:"coin",v:v,via:via,x:via==="hole"?25.5:via==="chute"?7:p.x,y:via==="hole"?0.4:via==="chute"?0.8:p.y});this.killPot(p);};
P.toScanner=function(p){p.m="scan";p.t=0;p.x=12.4;p.y=15;};
P.toWater=function(p,x,y){var tx=Math.floor(x),ty=Math.floor(y);if(isCanal(tx,ty)){p.m="canal";p.c=this.canalProj(x,y);var q=this.canalPos(p.c);p.x=q.x;p.y=q.y;}
  else{p.m="pool";p.x=clamp(x,17.2,19.8);p.y=clamp(y,12.2,15.8);p.vx=0;p.vy=0;p.pt=this.s.t;}};
P.canalProj=function(x,y){if(y>=15)return clamp(x-20,0,5.5);return 5.5+clamp(15.5-y,0,15.45);};
P.canalPos=function(c){if(c<=5.5)return {x:20+c,y:15.5};return {x:25.5,y:15.5-(c-5.5)};};
P.cooCap=function(){return C.coolerBase+3*this.up("pantry")+(this.placed("smallCooler")?2:0)+(this.placed("shelf")?2:0);};
P.foodPrice=function(){return C.foodPrice-(this.placed("potsPans")?1:0);};
P.levelPrice=function(){var n=this.s.level+1;if(n>5)return 0;return Math.round(LEVEL_PRICE[n]*(this.placed("bookshelf")?0.9:1));};
P.itemPrice=function(id){var it=ITEMI[id];if(!it)return 0;if(it.stack&&it.cat!=="belt"){var n=this.s.owned[id]|0;return Math.round(it.price*Math.pow(1.5,n));}return it.price;};
P.buyLevel=function(){var pr=this.levelPrice();if(!pr)return {ok:false,why:"Max level"};if(this.s.coins<pr)return {ok:false,why:"Need "+pr+"c"};this.s.coins-=pr;this.s.level++;this.say("LEVEL "+this.s.level+"! New items in the SHOP.");return {ok:true};};
P.buyFood=function(n){n=Math.max(1,Math.min(20,Math.round(num(n,1))||1));var ok=0;for(var i=0;i<n;i++){if(this.s.food>=this.cooCap()||this.s.coins<this.foodPrice())break;this.s.coins-=this.foodPrice();this.s.food++;ok++;}return {ok:ok>0,n:ok,why:ok?"":(this.s.food>=this.cooCap()?"Cooler full":"Need "+this.foodPrice()+"c")};};
P.buyUp=function(id){var u=UPI[id];if(!u)return {ok:false,why:"no such"};var l=this.up(id);if(l>=u.max)return {ok:false,why:"Maxed"};if((u.lv||1)>this.s.level)return {ok:false,why:"Needs LV "+u.lv};var pr=u.prices[l];if(this.s.coins<pr)return {ok:false,why:"Need "+pr+"c"};this.s.coins-=pr;this.s.ups[id]=l+1;this.power=null;return {ok:true};};
P.buyItem=function(id,qty){var it=ITEMI[id];if(!it)return {ok:false,why:"no such"};if(it.lv>this.s.level)return {ok:false,why:"Needs LV "+it.lv};
  if(!it.stack&&(this.s.owned[id]|0)>0)return {ok:false,why:"Owned"};qty=it.cat==="belt"?Math.max(1,Math.min(20,Math.round(num(qty,1))||1)):1;var pr=this.itemPrice(id)*qty;if(this.s.coins<pr)return {ok:false,why:"Need "+pr+"c"};
  this.s.coins-=pr;this.s.owned[id]=(this.s.owned[id]|0)+qty;
  if(it.cat==="key"){this.dirtyGrid=true;this.say("The metal door is unlocked. The wash room is yours.");}
  else if(it.cat==="tool"){this.s.equip[id]=true;this.say(it.name+" is on Papa now (INV to take it off).");}
  else if(it.cat==="theme"){}
  else if(it.cat==="acc"){this.wear(id,true);this.s.papa.joy=60;this.s.papa.wantFlash=2;this.say(it.name+" for Papa! (INV to swap)");}
  else if(it.cat==="basin"){this.s.basin[id]=this.key();}
  else this.s.inv[id]=(this.s.inv[id]|0)+qty;
  return {ok:true};};
/* ---------- placement (free, but never blocking his way to anything) ---------- */
P.wallSlots=function(room){var o=[],x,y;if(room==="k"){for(x=0;x<14;x++)if(x!==6&&x!==7)o.push({wall:"N",x:x,y:0});for(y=0;y<24;y++)if(y!==FIX.outlet.y)o.push({wall:"W",x:0,y:y});}
  else for(x=15;x<25;x++)o.push({wall:"N",x:x,y:0});return o;};
P.wallCells=function(o){var w=itemDef(o.id).w||1,me=[];for(var i=0;i<w;i++)me.push(o.wall==="N"?[o.x+i,0]:[0,o.y+i]);return me;};
P.wallFree=function(o,skipU){var it=itemDef(o.id),i,j,me=this.wallCells(o);
  var slots=this.wallSlots(it.room==="w"?"w":"k");
  for(i=0;i<me.length;i++){var okk=false;for(j=0;j<slots.length;j++)if(slots[j].wall===o.wall&&slots[j].x===me[i][0]&&slots[j].y===me[i][1]){okk=true;break;}if(!okk)return false;}
  if(it.room==="w"&&!this.key())return false;
  for(i=0;i<this.s.objs.length;i++){var q=this.s.objs[i];if(q.u===skipU||!q.wall||q.wall!==o.wall)continue;var qc=this.wallCells(q);for(j=0;j<qc.length;j++)for(var k=0;k<me.length;k++)if(qc[j][0]===me[k][0]&&qc[j][1]===me[k][1])return false;}
  return true;};
P.wallSpot=function(id,x,y){/* nearest free wall cell to a floor tile */var it=itemDef(id),slots=this.wallSlots(it.room==="w"?"w":"k"),best=null,bd=1e9,me=this;
  slots.forEach(function(s){var o={id:id,wall:s.wall,x:s.x,y:s.y};if(!me.wallFree(o))return;var cx=s.wall==="N"?s.x+0.5:0,cy=s.wall==="N"?0:s.y+0.5,d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;best=o;}});return best;};
P.canPlace=function(id,x,y,r,skipU){
  var it=itemDef(id);if(!it)return {ok:false,why:"Unknown item"};
  if(it.cat==="wall")return {ok:false,why:"Wall item"};
  x=Math.round(num(x,-99));y=Math.round(num(y,-99));r=((Math.round(num(r,0))%4)+4)%4;
  var f=fp({id:id,x:x,y:y,r:r}),a,b,room=null,key=this.key();
  for(a=f.x;a<f.x+f.w;a++)for(b=f.y;b<f.y+f.h;b++){var rr=roomOf(a,b);if(rr!=="k"&&rr!=="w")return {ok:false,why:rr==="door"?"Keep the doorway clear":"Off the floor"};
    if(rr==="w"&&!key)return {ok:false,why:"The wash room is locked (ROOM KEY)"};if(room&&rr!==room)return {ok:false,why:"It can't straddle the wall"};room=rr;
    if(fixedBlock(a,b))return {ok:false,why:"That spot is taken (pile, chute, scanner or water)"};
    if((a===13||a===15)&&(b===3||b===4)&&it.cat!=="rug")return {ok:false,why:"Keep the doorway clear"};}
  if(it.room==="w"&&room!=="w")return {ok:false,why:"Wash room only"};if(it.room==="k"&&room!=="k")return {ok:false,why:"Kitchen only"};
  for(var i=0;i<this.s.objs.length;i++){var o=this.s.objs[i];if(o.u===skipU||o.wall)continue;var oc=(itemDef(o.id)||{}).cat,g2=fp(o);
    var hit=!(g2.x>=f.x+f.w||g2.x+g2.w<=f.x||g2.y>=f.y+f.h||g2.y+g2.h<=f.y);if(!hit)continue;
    if(it.cat==="rug"&&oc!=="rug")continue;if(oc==="rug"&&it.cat!=="rug")continue;
    return {ok:false,why:"It overlaps the "+(itemDef(o.id).name||o.id).toLowerCase()};}
  if(it.cat!=="rug"&&it.cat!=="belt"){
    var G=this.grid(),walk=new Uint8Array(G.walk);
    if(skipU){var so=this.obj(skipU);if(so&&!so.wall){var sf=fp(so);for(a=sf.x;a<sf.x+sf.w;a++)for(b=sf.y;b<sf.y+sf.h;b++){var rr2=roomOf(a,b);if((rr2==="k"||rr2==="w")&&!fixedBlock(a,b)&&!this.otherOcc(a,b,skipU))walk[b*W+a]=1;}}}
    for(a=f.x;a<f.x+f.w;a++)for(b=f.y;b<f.y+f.h;b++)walk[b*W+a]=0;
    var bad=this.unreachable(walk,{id:id,x:x,y:y,r:r,u:skipU||-1});if(bad)return {ok:false,why:"That would block his way to the "+bad};}
  return {ok:true};
};
P.otherOcc=function(a,b,skipU){for(var i=0;i<this.s.objs.length;i++){var o=this.s.objs[i];if(o.u===skipU||o.wall)continue;var c=(itemDef(o.id)||{}).cat;if(c==="rug"||o.id==="belt")continue;if(inRect(a,b,fp(o)))return true;}return false;};
P.unreachable=function(walk,cand){
  var key=this.key(),st=null,F,i,j;
  var p=this.papaTile();if(walk[p[1]*W+p[0]])st=p;
  if(!st){for(j=0;j<W*H&&!st;j++)if(walk[j]&&roomOf(j%W,(j/W)|0)==="k")st=[j%W,(j/W)|0];}
  if(!st)return "floor";
  F=this.field(st[0],st[1],walk);
  function ok(list){for(var k=0;k<list.length;k++){var t=list[k];if(t[0]>=0&&t[1]>=0&&t[0]<W&&t[1]<H&&walk[t[1]*W+t[0]]&&F.dist[t[1]*W+t[0]]<1e9)return true;}return false;}
  if(!ok(around(FIX.pile)))return "potato pile";
  if(!ok([[6,1],[7,1]]))return "chute";
  if(!ok([[11,14],[11,15]]))return "scanner";
  if(key&&!ok([[13,3],[13,4]]))return "door";
  if(key&&!ok([[15,3],[15,4]]))return "wash room";
  if(key&&!ok(this.spotsForWalk("canal",walk)))return "canal";
  var objs=this.s.objs.filter(function(o){return o.u!==cand.u;}).concat([cand]);
  for(i=0;i<objs.length;i++){var o=objs[i];if(o.wall||o.id==="belt")continue;var c=(itemDef(o.id)||{}).cat;if(c==="rug")continue;
    if(roomOf(o.x,o.y)==="w"&&!key)continue;if(!ok(around(fp(o))))return (itemDef(o.id).name||o.id).toLowerCase();}
  /* every floor tile must stay reachable too, so nothing ends up stranded behind furniture */
  for(j=0;j<W*H;j++){if(walk[j]&&F.dist[j]>=1e9){var rx=roomOf(j%W,(j/W)|0);if(rx==="k"||(rx==="w"&&key))return "far corner";}}
  return null;
};
P.spotsForWalk=function(t,walk){var list=[];CANAL_TILES.forEach(function(c){list.push([c[0]-1,c[1]],[c[0],c[1]-1]);});return list.filter(function(p){return p[0]>=0&&p[1]>=0&&walk[p[1]*W+p[0]];});};
P.place=function(id,x,y,r){
  var it=itemDef(id);if(!it||!ITEMI[id])return {ok:false,why:"Unknown"};
  if((this.s.inv[id]|0)<=0)return {ok:false,why:"None in INV"};
  if(it.cat==="wall"){var w=this.wallSpot(id,num(x,0),num(y,0));if(!w)return {ok:false,why:"No room left on the walls"};var o=this.addObj(id,w.x,w.y,0);o.wall=w.wall;this.s.inv[id]--;return {ok:true,o:o};}
  if(["floor","rug","belt","mach"].indexOf(it.cat)<0)return {ok:false,why:"Not placeable"};
  x=Math.round(num(x,-99));y=Math.round(num(y,-99));r=((Math.round(num(r,0))%4)+4)%4;
  var c=this.canPlace(id,x,y,r);if(!c.ok)return c;var o2=this.addObj(id,x,y,r);this.s.inv[id]--;this.afterEdit();return {ok:true,o:o2};
};
P.move=function(u,x,y,r){var o=this.obj(u);if(!o)return {ok:false,why:"gone"};
  if(o.wall){var w0={id:o.id,wall:o.wall,x:o.x,y:o.y};var w=null;var me=this;var keep=o.wall;o.wall="X";w=this.wallSpot(o.id,num(x,0),num(y,0));o.wall=keep;if(!w)return {ok:false,why:"No room on the walls"};o.wall=w.wall;o.x=w.x;o.y=w.y;return {ok:true};}
  x=Math.round(num(x,-99));y=Math.round(num(y,-99));r=((Math.round(num(r,o.r))%4)+4)%4;
  var c=this.canPlace(o.id,x,y,r,u);if(!c.ok)return c;o.x=x;o.y=y;o.r=r;this.afterEdit(o);return {ok:true};};

function buildHelp(){var h='<div class="help">';

  h+='<p><b>Money:</b> raw 1c · peeled dirty 2c · half clean 3c · clean 4c in the chute · <b>clean through the wash-room ship hole 5c</b>. Peeled potatoes come out dirty.</p>';
  h+='<p><b>The map:</b> one kitchen and one wash room. The camera follows Papa (&#9678;). Drag to look around, pinch or + / &minus; to zoom, KITCHEN / WASH jump the view. Papa walks through the metal door with whatever he carries (it needs the <b>ROOM KEY</b>).</p>';
  h+='<div class="sec">THE PILE</div><p>The raw pile holds 80 potatoes. Every potato that leaves (shipped, or dropped) rolls back down the return pipe onto the pile, so the pile shrinks while lots are in play and grows back as you ship.</p><div class="sec">AUTO MODE + PAPA\'S WANTS</div><p>Close the game and Papa carries on alone. He mostly <b>kicks it</b> (naps, snacks, the radio, the cat, the armchair) and works in bursts when his mood, energy and hunger allow, at most half as fast as when you watch. Machines still jam and wait for him. When you come back, <b>WHILE YOU WERE GONE</b> shows what he did.</p><p>Papa has <b>wants</b>: a snack when he is hungry, a hat, shades, a bow tie, a cat toy. When he wants something he works for it, buys it with what he earned and goes back to relaxing. In play, the <b>PAPA WANTS</b> bubble lets you get it for him (mood up).</p><div class="sec">WASH ROOM</div><p>Three ways to clean peeled potatoes: <b>SEND PEELED TO SCANNER</b> drops them through the X-ray in the wall into the pool. They pile up there and <b>wait for Papa</b>: when the pool holds <b>EMPTY POOL AT</b> potatoes he walks over, scoops them out, scrubs them at the tub (SCRUB ON) and tosses them into the canal, which carries them to the ship hole. <b>CARRY</b> makes Papa walk them through the door to the scrub tub and scrub them himself. And <b>you can scrub</b>: tap or swipe dirty potatoes in the pool, canal or tub to brush them clean.</p>';
  h+='<div class="sec">BELTS + MACHINES (LV 2+)</div><p>Belts are single tiles: place them one by one in EDIT (the next tile is ready ahead after each), tap a belt to turn it. Potatoes ride the belts for real into whatever is ahead: the peel table tray, a machine\'s back, the chute (heading NORTH), the X-ray (heading EAST), the scrub tub or the water.</p>';
  h+='<p><b>POTATO HOPPER</b> touching the raw pile pumps raw potatoes out of its spout. <b>AUTO PEELER</b>: raw in the back, peeled out the front (arrow). <b>WASHER DRUM</b>: dirty peeled in, clean out. Machines and belts need <b>power</b>: the wall outlet powers 5 load nearby, a <b>GENERATOR</b> powers 12 in its blue ring. Belt 1, hopper 2, peeler 3, washer 3. Machines sometimes <b>JAM</b> (red light, smoke): FIX JAMS sends Papa, or press FIX.</p>';
  h+='<div class="sec">PAPA</div><p>Watch his bars: hunger, energy, mood, clean hands. Feed him when hunger is low. He sets his sack down before a nap and picks it up after. The broom and dustpan only ever appear in his hands: he carries them to the mess and sweeps with them.</p>';
  h+='<div class="sec">COMMANDS</div>';S.COMMANDS.forEach(function(c){h+='<p><b>'+esc(c.name)+'</b> '+esc(c.what)+' '+esc(c.effect)+'</p>';});

  h+='<p style="color:#7f93ad">Papa Potato 2.0.1 · Tough &amp; J\'s Arcade · save: this phone only.</p></div>';return h;}

$("sheetBody").addEventListener("click",function(e){var b=e.target.closest?e.target.closest("button[data-act]"):null;if(!b)return;var a=b.getAttribute("data-act"),r=null,p=a.split(":");
