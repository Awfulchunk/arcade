<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Papa Potato 0.3</title>
<style>
/* Papa Potato 0.3 (Tough & J's Arcade). Art lock: approved mock 0.1b (true top-down). Taller room, shop + help screens. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#12141a;color:#eee;font-family:"Courier New",Courier,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--hud-w:100px;--cmd-pad:6px;--gap:4px;--tap:44px;--box-h:48px;--buy-h:44px;
  --cmd-h:calc(var(--cmd-pad)*2 + var(--buy-h) + var(--gap) + var(--box-h)*3 + var(--gap)*2)}
@media (min-height:700px){:root{--hud-w:108px}}
#app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--hud-w);grid-template-rows:minmax(0,1fr) var(--cmd-h);
  grid-template-areas:"play hud" "cmd cmd";background:#0c1220}
#play{grid-area:play;position:relative;overflow:hidden;background:#8a846c;min-width:0;min-height:0;touch-action:none}
#play canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tag{transition:opacity .35s;position:absolute;z-index:2;font:700 10px/1 "Courier New",monospace;color:#ffe066;background:rgba(0,0,0,.8);border:1px solid #6a5020;border-radius:4px;padding:3px 6px;letter-spacing:.08em;pointer-events:none;white-space:nowrap}
#play .tag.off{opacity:0}
#hint{position:absolute;z-index:3;left:6px;right:6px;top:25%;font:700 10px/1.3 "Courier New",monospace;color:#fff3c0;background:rgba(10,14,24,.88);border:1px solid #6a5020;border-radius:4px;padding:5px 7px;pointer-events:none;transition:opacity .4s;text-align:center}
#hint.off{opacity:0}
.pop{position:absolute;z-index:3;font:700 11px/1 "Courier New",monospace;color:#ffe066;text-shadow:1px 1px 0 #000;pointer-events:none;white-space:nowrap}
#hud{grid-area:hud;overflow:hidden;background:#0c1220;border-left:2px solid #2a3a58;display:flex;flex-direction:column;padding:8px 6px;min-width:0}
#hud>*{margin-bottom:8px}
@media (min-height:700px){#hud{padding:12px 8px}#hud>*{margin-bottom:12px}}
#hud .brand{flex:0 0 auto}
#hud .brand b{display:block;color:#ffe066;font-size:10px;letter-spacing:.08em;line-height:1.15}
#hud .brand span{display:block;color:#7f93ad;font-size:8px;letter-spacing:.1em;margin-top:2px}
.stat{flex:0 0 auto}
.stat .k{display:block;color:#9ab;font:700 8px/1 monospace;letter-spacing:.1em;margin-bottom:4px}
.stat .coins{color:#ffe066;font:700 18px/1 monospace;letter-spacing:.02em;display:flex;align-items:center}
.stat .coins canvas{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto;margin-right:5px}
.stat .food{color:#f0c890;font:700 13px/1 monospace;display:flex;align-items:center}
.stat .food canvas{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto;margin-right:5px}
.stat .food.out{color:#ff7a5a}
.two{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>.stat:first-child{margin-right:4px}
.stat .peels{color:#e8c070}
.stat .peels.messy{color:#ffb07a}
.stat .peels.filthy{color:#ff7a5a}
.mess{flex:0 0 auto;font:700 8px/1.2 monospace;color:#9ab;letter-spacing:.03em;min-height:10px;margin-top:-4px}
.mess.on{color:#ffb07a}
.bar{height:10px;background:#152038;border:1px solid #2e4060;border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%}
.bar.hunger i{background:#e09040}
.bar.energy i{background:#81ad78}
.bar.low i{background:#d04a3a}
.stat .pct{display:block;color:#cde;font:700 10px/1 monospace;margin-top:3px}
.states{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.states .k{margin-bottom:4px}
.st{font:700 9px/1.1 monospace;color:#7f93ad;padding:4px 4px;border:1px solid transparent;border-radius:3px;letter-spacing:.04em;margin-bottom:3px}
.st.on{color:#ffe066;background:#1a2840;border-color:#3a5080}
.st.lazy.on{color:#ffb07a;border-color:#80503a;background:#2a1c18}
#doing{font:700 8px/1.2 monospace;color:#9ab;letter-spacing:.04em;margin-top:2px;min-height:10px}
#cmd{grid-area:cmd;overflow:hidden;overflow-y:auto;background:#0c1220;border-top:3px solid #3a5080;padding:var(--cmd-pad);
  touch-action:none;box-shadow:0 -8px 18px rgba(0,0,0,.4);scrollbar-width:none;overscroll-behavior:contain}
#cmd::-webkit-scrollbar{display:none}
.box{height:var(--box-h);background:#1a2840;border:2px solid #2e4060;border-radius:5px;box-shadow:inset 0 -3px rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 4px;margin-bottom:var(--gap);position:relative}
.box.focus{border-color:#ffe066;background:#1f3150}
.box .mid{flex:1;min-width:0;margin:0 6px}
.box .top{display:flex;align-items:baseline;height:13px}
.box .nm{font:700 10px/1 monospace;color:#cde;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .lk{font:700 8px/1 monospace;color:#7f93ad;margin-left:5px;white-space:nowrap;flex:0 0 auto}
.box.focus .lk{color:#ffe066}
.box .val{margin-left:auto;padding-left:4px;font:700 10px/1 monospace;color:#ffe066;white-space:nowrap;flex:0 0 auto}
.box.unset .val{color:#ff9a6a}
.pm{flex:0 0 auto;width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);border:3px solid #647b8f;border-radius:4px;background:#162434;color:#dbe8e5;
  font:700 20px/1 monospace;box-shadow:inset 0 -4px #080f1d;padding:0;touch-action:none}
.pm.press{background:#45664f;border-color:#c4e490;box-shadow:inset 0 3px #24392d}
.trk{position:relative;height:22px;margin:1px 8px 0;touch-action:none}
.trk .ln{position:absolute;left:0;right:0;top:9px;height:5px;background:#0c1220;border:1px solid #2e4060}
.trk .fill{position:absolute;right:0;top:9px;height:5px;background:#5a6a50}
.box.focus .trk .fill{background:#ffe066}
.trk .tk{position:absolute;top:16px;width:1px;height:4px;background:#3a4a60}
.trk .kn{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border:3px solid #6a7a80;background:#3a4a50;box-shadow:inset 0 -4px #26343a;pointer-events:none}
.box.focus .trk .kn{border-color:#b3d5c1;background:#55746b;box-shadow:inset 0 -4px #304d49}
#bar{position:sticky;bottom:-9px;z-index:2;background:#0c1220;padding:4px 0 var(--cmd-pad);margin-top:-4px;margin-bottom:calc(var(--cmd-pad)*-1 - 3px);box-shadow:0 -6px 8px rgba(12,18,32,.95);display:flex}
#bar button{display:block;height:var(--buy-h);min-height:var(--tap);border:3px solid #6a5020;border-radius:5px;background:#2a1e08;color:#ffd060;
  font:700 13px/1 monospace;letter-spacing:.08em;box-shadow:inset 0 -4px #140e04;padding:0;touch-action:none}
#bar #shopBtn{flex:1 1 auto;margin-right:6px}
#bar #helpBtn{flex:0 0 33%;border-color:#3a5080;background:#14203a;color:#9fc0ff;box-shadow:inset 0 -4px #0a1226}
#bar button.press{background:#3a2c10;border-color:#ffe066;color:#ffe066}
#bar #helpBtn.press{background:#1f3150;border-color:#b3d5ff;color:#fff}
#bar #shopBtn.can{border-color:#ffe066}
/* shop + help screens */
#ovl{position:absolute;left:0;top:0;right:0;bottom:0;z-index:30;background:#0c1220;display:none;flex-direction:column}
#ovl.on{display:flex}
#ovlHead{flex:0 0 auto;display:flex;align-items:center;height:48px;padding:0 6px;border-bottom:3px solid #3a5080;background:#101a2e}
#ovlHead .tt{flex:1 1 auto;font:700 13px/1 monospace;color:#ffe066;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ovlHead .cn{flex:0 0 auto;font:700 13px/1 monospace;color:#ffe066;margin-right:8px;white-space:nowrap}
#ovlHead .x{flex:0 0 auto;width:var(--tap);height:var(--tap);border:3px solid #647b8f;border-radius:4px;background:#162434;color:#dbe8e5;font:700 16px/1 monospace;padding:0;box-shadow:inset 0 -4px #080f1d;touch-action:none}
#ovlHead .x.press{background:#45664f;border-color:#c4e490}
#ovlBody{flex:1 1 auto;min-height:0;overflow:hidden;overflow-y:auto;padding:8px 8px 18px;touch-action:none;scrollbar-width:none;overscroll-behavior:contain}
#ovlBody::-webkit-scrollbar{display:none}
.sec{font:700 10px/1 monospace;color:#7f93ad;letter-spacing:.12em;margin:10px 2px 6px}
.sec:first-child{margin-top:2px}
.row{background:#1a2840;border:2px solid #2e4060;border-radius:5px;padding:7px 8px;margin-bottom:6px;display:flex;align-items:center}
.row .tx{flex:1 1 auto;min-width:0;margin-right:8px}
.row .nm{font:700 11px/1.2 monospace;color:#e8eef4;letter-spacing:.04em}
.row .nm b{color:#ffe066}
.row .fx{font:700 9px/1.3 monospace;color:#9ab;margin-top:3px}
.row .go{flex:0 0 auto;min-width:64px;height:var(--tap);border:3px solid #6a5020;border-radius:4px;background:#2a1e08;color:#ffd060;font:700 12px/1.1 monospace;padding:0 6px;box-shadow:inset 0 -4px #140e04;touch-action:none}
.row .go.press{background:#3a2c10;border-color:#ffe066;color:#ffe066}
.row .go.poor{color:#8a7a50;border-color:#4a3a18}
.row .go.done{color:#8a9a70;border-color:#3a4a30;background:#18200f}
.row.cmdrow{display:block}
.row.cmdrow .nm{font-size:12px}
.row.cmdrow .rg{font:700 9px/1.3 monospace;color:#ffe066;margin-top:3px}
.row.cmdrow .wt{font:700 10px/1.35 monospace;color:#cde;margin-top:4px}
.row.cmdrow .fx{margin-top:4px}
.row.cmdrow .now{float:right;font:700 10px/1 monospace;color:#ffe066}
/* booklet (help) */
#ovlBody.book{overflow:hidden;padding:8px;display:flex;flex-direction:column}
#book{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#pg{flex:1 1 auto;min-height:0;position:relative;background:#e9dfc2;border:3px solid #5a3a1c;border-radius:4px 10px 10px 4px;box-shadow:inset 8px 0 10px -6px rgba(0,0,0,.35),0 3px 0 #2a1a0c;padding:10px 12px 8px 16px;color:#2a1c0c;overflow:hidden;transform-origin:0 50%}
#pg:after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 16px 16px;border-color:transparent transparent #5a3a1c transparent}
#pg.flipn{animation:flipn .34s ease-out}
#pg.flipp{animation:flipp .34s ease-out}
@keyframes flipn{0%{transform:perspective(600px) rotateY(-70deg);opacity:.2}100%{transform:perspective(600px) rotateY(0);opacity:1}}
@keyframes flipp{0%{transform:perspective(600px) rotateY(70deg);opacity:.2}100%{transform:perspective(600px) rotateY(0);opacity:1}}
#pg:not(.cover){display:flex;flex-direction:column;justify-content:space-around}
#pg .pn{position:absolute;right:12px;top:6px;font:700 9px/1 monospace;color:#8a6a40}
#pg .hd{display:flex;align-items:center;margin-bottom:8px}
#pg .hd canvas{flex:0 0 auto;width:48px;height:48px;image-rendering:pixelated;background:#cdbf98;border:2px solid #5a3a1c;border-radius:4px;margin-right:10px}
#pg .hd b{font:700 14px/1.15 monospace;color:#3a1c08;letter-spacing:.03em}
#pg .lb{font:700 9px/1 monospace;color:#8a5a20;letter-spacing:.12em;margin:8px 0 3px}
#pg .tx{font:700 12px/1.3 monospace;color:#2a1c0c}
#pg .mini{display:flex;align-items:center;margin:2px 0 0}
#pg .mini .e{flex:0 0 auto;font:700 10px/1 monospace;color:#5a3a1c;min-width:34px}
#pg .mini .e.r{text-align:right}
#pg .mt{position:relative;flex:1 1 auto;height:22px;margin:0 6px}
#pg .mt .ln{position:absolute;left:0;right:0;top:8px;height:6px;background:#b9a878;border:1px solid #5a3a1c}
#pg .mt .mf{position:absolute;right:0;top:8px;height:6px;background:#6a8a3a}
#pg .mt .tk{position:absolute;top:15px;width:1px;height:5px;background:#5a3a1c}
#pg .mt .mk{position:absolute;top:2px;width:14px;height:16px;margin-left:-7px;background:#c0361e;border:2px solid #5a1408;border-radius:2px}
#pg .now{font:700 11px/1 monospace;color:#c0361e;margin-top:6px}
#pg .rg{font:700 11px/1.2 monospace;color:#3a5a1c}
#pg.cover{background:#5a3418;border-color:#2a1808;color:#f0d890;text-align:center;box-shadow:inset 8px 0 10px -6px rgba(0,0,0,.6),0 3px 0 #1a0e04;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pg.cover:after{display:none}
#pg.cover .t1{font:700 20px/1.1 monospace;letter-spacing:.1em;color:#ffe066;text-shadow:2px 2px 0 #2a1808}
#pg.cover .t2{font:700 12px/1.2 monospace;letter-spacing:.2em;margin:6px 0 14px}
#pg.cover canvas{width:64px;height:64px;image-rendering:pixelated;margin-bottom:10px}
#pg.cover .go2{height:var(--tap);min-width:150px;border:3px solid #ffe066;border-radius:4px;background:#2a1808;color:#ffe066;font:700 13px/1 monospace;letter-spacing:.1em;touch-action:none;padding:0 12px;box-shadow:inset 0 -4px #140a02}
#pg.cover .go2.press{background:#6a4420}
#pg .chips{display:flex;flex-wrap:wrap;margin-top:4px}
#pg .chips span{font:700 10px/1 monospace;background:#cdbf98;border:2px solid #5a3a1c;border-radius:3px;padding:5px 6px;margin:0 4px 4px 0;color:#3a1c08}
@media (min-height:700px){
#pg{padding:14px 16px 10px 20px}#pg .hd{margin-bottom:14px}#pg .hd canvas{width:72px;height:72px}#pg .hd b{font-size:18px}
#pg .lb{font-size:10px;margin:14px 0 5px}#pg .tx{font-size:14px;line-height:1.35}#pg .mt{height:30px}#pg .mt .ln{top:12px;height:8px}#pg .mt .mf{top:12px;height:8px}#pg .mt .tk{top:21px;height:6px}#pg .mt .mk{top:4px;width:18px;height:22px;margin-left:-9px}
#pg .mini .e{font-size:11px;min-width:40px}#pg .now{font-size:14px;margin-top:10px}#pg .rg{font-size:13px}#pg.cover .t1{font-size:24px}#pg.cover canvas{width:96px;height:96px}#pg .chips span{font-size:12px;padding:7px 8px}}
@media (max-height:600px){#pg{padding:8px 10px 6px 14px}#pg .hd{margin-bottom:5px}#pg .lb{margin:5px 0 2px}#pg .tx{font-size:11px;line-height:1.25}#pg .hd canvas{width:40px;height:40px}}
#bkNav{flex:0 0 auto;display:flex;align-items:center;margin-top:8px}
#bkNav button{flex:0 0 auto;width:84px;height:var(--tap);border:3px solid #6a5020;border-radius:4px;background:#2a1e08;color:#ffd060;font:700 12px/1 monospace;padding:0;touch-action:none;box-shadow:inset 0 -4px #140e04}
#bkNav button.press{background:#3a2c10;border-color:#ffe066}
#bkNav button.dis{opacity:.35}
#bkNav .dots{flex:1 1 auto;text-align:center;line-height:0}
#bkNav .dots i{display:inline-block;width:7px;height:7px;margin:0 2px;background:#3a4a60;border-radius:1px}
#bkNav .dots i.on{background:#ffe066}
.note{font:700 10px/1.4 monospace;color:#9ab;margin:2px 2px 8px}
@media (max-height:600px){
  #hud{padding:6px 5px}#hud>*{margin-bottom:6px}
  .stat .coins{font-size:16px}
  .st{padding:3px 3px;font-size:8px;margin-bottom:2px}
  .box .nm,.box .val{font-size:9px}
  #bar button{font-size:12px}
  .row .fx{font-size:8.5px}
  .tag{font-size:9px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="app">
  <div id="play">
    <canvas id="cv"></canvas>
    <div class="tag" id="tagShip">SHIP IN</div>
    <div class="tag" id="tagRet">RETURN</div>
    <div class="tag" id="tagTable">PEEL TABLE</div>
    <div class="tag" id="tagBed">BED</div>
    <div class="tag" id="tagFood">FOOD</div>
    <div class="tag" id="tagSeat">SEAT</div>
    <div class="tag" id="tagPot">POTATOES</div>
    <div id="hint" class="off"></div>
  </div>
  <aside id="hud">
    <div class="brand"><b>PAPA<br>POTATO</b><span>v0.3</span></div>
    <div class="stat"><span class="k">COINS</span><div class="coins"><canvas id="coinIco" width="14" height="14"></canvas><span id="coins">0</span></div></div>
    <div class="two">
      <div class="stat"><span class="k">FOOD</span><div class="food" id="foodRow"><canvas id="foodIco" width="14" height="14"></canvas><span id="food">0</span></div></div>
      <div class="stat"><span class="k">PEELS</span><div class="food peels" id="peelRow"><canvas id="peelIco" width="14" height="14"></canvas><span id="peels">0</span></div></div>
    </div>
    <div class="mess" id="mess"></div>
    <div class="stat"><span class="k">HUNGER</span><div class="bar hunger" id="hBar"><i id="hFill"></i></div><span class="pct" id="hPct">100%</span></div>
    <div class="stat"><span class="k">ENERGY</span><div class="bar energy" id="eBar"><i id="eFill"></i></div><span class="pct" id="ePct">100%</span></div>
    <div class="states"><span class="k">STATE</span>
      <div class="st" data-s="PEELING">PEELING</div>
      <div class="st" data-s="EATING">EATING</div>
      <div class="st" data-s="NAPPING">NAPPING</div>
      <div class="st" data-s="CLEANING">CLEANING</div>
      <div class="st lazy" data-s="AUTO-LAZY">AUTO-LAZY</div>
      <div id="doing"></div>
    </div>
  </aside>
  <section id="cmd">
    <div id="boxes"></div>
    <div id="bar"><button id="shopBtn" type="button" data-act="shop">SHOP</button><button id="helpBtn" type="button" data-act="help">? HELP</button></div>
  </section>
  <div id="ovl"><div id="ovlHead"><span class="tt" id="ovlTitle"></span><span class="cn" id="ovlCoins"></span><button class="x" id="ovlClose" type="button" data-act="close" aria-label="Close">X</button></div><div id="ovlBody"></div></div>
</div>
<script>
/* ===== Papa Potato 0.3 — simulation (no DOM; runs headless for tests) ===== */
var PPSim=(function(){
  var RW=100,RH=240;                    /* canonical room, units. x,y in the save are fractions of this */
  var PACE=["CHILL","EASY","STEADY","BRISK","GRIND"];
  var SPD=[0.6,0.8,1.0,1.25,1.5];      /* work + walk speed */
  var DRN=[0.55,0.75,1.0,1.45,2.0];    /* hunger + energy drain */
  var STYLE=[{n:"NEAT",sp:0.8,peels:2},{n:"NORMAL",sp:1.0,peels:3},{n:"QUICK",sp:1.3,peels:5}];
  var C={
    walk:34,            /* room units / s (0.2: 18 in a 150-tall room; 0.3's room is taller so he walks faster) */
    grab:0.7, peel:6.0, drop:0.5, eat:3.0,
    meal:55, foodPrice:8, foodMax:9,
    hungerDrain:0.30, hungerDrainNap:0.10,
    energyDrain:0.42,
    napRegen:6.0, lazyNapRegen:4.0, napWake:98,
    value:2, sloppyValue:1,
    lazyLow:25, lazySpeed:0.5,
    startCoins:0, startFood:1,
    chuteCap:6, tPipe:1.6,              /* a full chute's batch spends tPipe in the pipe, then spills out of the return chute */
    peelPer:3, peelPerSloppy:5, peelMax:200, messFull:90, messMax:0.30,
    sweepRate:6, sweepWind:0.8, sweepTidy:0.10,
    priceGrow:1.05, priceCap:14, priceEvery:900,
    potBase:6, potLegacy:9, potPrice0:15, potPriceGrow:1.4
  };
  var POTS=[4,8,12,16,24,32,48,64,96,128,160,200,250,300,400,500,650,800];
  var POT_MAX=POTS.length-1;
  /* ---- room geometry (units; room = 100 wide x 240 tall). The renderer draws from these; the router avoids OBST. ---- */
  var GEO={WALL:7,INFL:7,
    ship:{x:50,lip:22,top:2,mouth:18},                 /* shipping chute hangs from the top wall */
    table:{x0:33,y0:74,x1:67,y1:92},
    cooler:{x0:71,y0:49,x1:85,y1:59},
    stool:{x:78,y:70},
    mat:{x:22,y:150,w:20,h:10},
    pile:{cx:50,base:218,rx:41,rz:14},
    ret:{wallX:93,mouthX:77,y:198,w:9},               /* return chute: pipe out of the right wall, mouth opens onto the pile */
    mess:{cx:50,cy:111,rx:26,rz:15}};
  var OBST=[{id:"table",x0:GEO.table.x0,y0:GEO.table.y0,x1:GEO.table.x1,y1:GEO.table.y1},{id:"cooler",x0:GEO.cooler.x0,y0:GEO.cooler.y0,x1:GEO.cooler.x1,y1:GEO.cooler.y1}];
  var SPOT={
    ship:{x:50,y:30,dir:0},
    table:{x:50,y:99,dir:0},

/* return chute: raw potatoes come OUT of the mouth (clipped inside the pipe), tumble and bounce, roll and settle onto their slot in the pile.
   The schedule (exit + rest times) comes from PPSim.spill(t0,n): the sim lands each potato at exactly the time drawn here. */
var RT=0,retLight=0;
/* where potato j of the batch is at time RT (canvas px): phase A it slides out of the mouth (clipped inside the pipe), phase B it bounces/rolls to its slot. Shared by the drawing and the test hook. */
function retPos(kk,sc,j,rt){var s=sim.s,mx=GEO.ret.mouthX,ex=sc.ex[j],ld=sc.ld[j],p=(rt-ex)/(ld-ex);if(p<0)return null;if(p>1)p=1;
  var idx=Math.min(MAXVIS-1,s.pile+(j-kk.landed)),tp=POS[idx],tx=wx(tp.x),ty=wy(tp.y),key=Math.round(kk.t0*100);
  var sy=GEO.ret.y+(srng(key+j*17)-0.5)*3.6,spx=wx(mx),spy=wy(sy);
  var pA=Math.min(1,p/0.18),pB=Math.min(1,Math.max(0,(p-0.18)/0.82)),bn=2+Math.floor(srng(key+j*31)*2.99),amp=(5+srng(j*7+Math.round(kk.t0*10))*5)*k;

  else{var e=1-Math.pow(1-pB,2.3),bx=spx-ws(9);x=bx+(tx-bx)*e;y=spy+(ty-spy)*Math.pow(pB,0.85);z=Math.abs(Math.sin(pB*Math.PI*bn))*amp*Math.pow(1-pB,1.4);}
  return {x:x,y:y,z:z,p:p,inPipe:pB<=0,ex:ex,ld:ld,tx:tx,ty:ty,mouthX:spx,slot:idx};}

  for(var j=kk.landed;j<kk.n;j++){var q=retPos(kk,sc,j,RT);if(!q)break;
    if(RT-q.ex<0.3)retLight=1;
    ctx.fillStyle="rgba(0,0,0,0.30)";ctx.beginPath();ctx.ellipse(q.x,q.y+ws(2.2),ws(2.8),ws(1.3),0,0,6.28);ctx.fill();
    if(q.inPipe){ctx.save();ctx.beginPath();ctx.rect(0,0,q.mouthX-ws(1.2),H);ctx.clip();}
    potato(q.x,q.y-q.z,Math.max(3,ws(3.3)),false,Math.floor(q.p*9)%2===0,0,["#5a3418","#7a4c28","#9a6a34","#d89a54"]);
    if(q.inPipe)ctx.restore();}
  if(retLight){var my=wy(GEO.ret.y-GEO.ret.w/2-0.2);R(wx(GEO.ret.mouthX+8),my,2,1,"#40ff70");}}

/* ---------- command panel: scroll-safe (Jay t1015) ----------
   Built from PPSim.COMMANDS, the same table the HELP screen reads, so the two can never drift apart.
   A slider is LOCKED until you tap its box (the box lights up). Vertical drags always scroll the panel and never move a slider.
   + and - always work (they act on a clean tap). SHOP / HELP also need a clean tap, so scrolling can't open them. A slide applies its value where the finger lifts. */
var cmd=$("cmd"),focusId=null;
function fmt(id,v){
  if(id==="pace")return PACE[v]+" x"+SPD[v];
  if(id==="pot")return String(POTS[v]);
  if(id==="clean")return v>0?"> "+v:"OFF";
  if(id==="style")return STYLE[v].n+" x"+STYLE[v].sp;
  if(id==="wake")return v+"%";
  if(id==="autob")return v>0?">= "+v:"OFF";
  return v>0?"< "+v+"%":"OFF";}
function bmax(id){return id==="pot"?Math.max(1,sim.potMax()):BOX[id].max;}
function pct(id,v){var b=BOX[id];return (v-b.min)/(bmax(id)-b.min);}
var UNSET={eat:1,nap:1,clean:1,autob:1};
function buildPanel(){var h="";
  for(var i=0;i<CMDS.length;i++){var c=CMDS[i];
    h+='<div class="box" data-id="'+c.id+'"><button class="pm" data-d="1" aria-label="'+c.name+' up">+</button><div class="mid"><div class="top"><span class="nm">'+c.name.replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</span><span class="lk"></span><span class="val"></span></div><div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div><button class="pm" data-d="-1" aria-label="'+c.name+' down">&minus;</button></div>';}
  $("boxes").innerHTML=h;}
function renderTicks(id){var el=cmd.querySelector('.box[data-id="'+id+'"]'),trk=el.querySelector(".trk"),b=BOX[id],mx=bmax(id),old=trk.querySelectorAll(".tk");for(var j=0;j<old.length;j++)trk.removeChild(old[j]);
  var n=Math.max(1,Math.round((mx-b.min)/b.step)),tn=Math.min(n,14);for(var i=0;i<=tn;i++){var t=document.createElement("i");t.className="tk";t.style.left=(i/tn*100)+"%";trk.appendChild(t);}}
function renderBox(id){var el=cmd.querySelector('.box[data-id="'+id+'"]'),v=sim.s.box[id],p=pct(id,v);
  el.querySelector(".kn").style.left=((1-p)*100)+"%";el.querySelector(".fill").style.width=(p*100)+"%";el.querySelector(".val").textContent=fmt(id,v);
  el.classList.toggle("unset",!!UNSET[id]&&v===0);el.classList.toggle("focus",focusId===id);el.querySelector(".lk").textContent=focusId===id?"<SLIDE>":"";
  var key=id==="pot"?"tk"+sim.potMax():"tk";if(el.getAttribute("data-tk")!==key){el.setAttribute("data-tk",key);renderTicks(id);}}
function renderAll(){for(var id in BOX)renderBox(id);}
function setFocus(id){focusId=id;renderAll();}
buildPanel();
function changed(){renderAll();updateHud();saveGame();}
function valFromX(id,trk,clientX){var r=trk.getBoundingClientRect(),b=BOX[id];var q=(clientX-r.left)/r.width;q=Math.max(0,Math.min(1,q));return b.min+(1-q)*(bmax(id)-b.min);}
var G=null; /* the active gesture */
var SLOP=8;
function doAct(a){
  if(a==="shop")openOvl("shop");else if(a==="help")openOvl("help");else if(a==="close")closeOvl();
  else if(a==="book:next")flipBook(1);else if(a==="book:prev")flipBook(-1);
  else if(a&&a.indexOf("buy:")===0)shopBuy(a.slice(4));}
cmd.addEventListener("pointerdown",function(e){if(G&&G.id!==e.pointerId)return;
  var t=e.target,box=t.closest?t.closest(".box"):null,pm=t.closest?t.closest(".pm"):null,trk=t.closest?t.closest(".trk"):null,btn=t.closest?t.closest("#bar button"):null;
  G={id:e.pointerId,x0:e.clientX,y0:e.clientY,st0:cmd.scrollTop,box:box,bid:box?box.getAttribute("data-id"):null,pm:pm,trk:trk,btn:btn,mode:null};
  if(pm)pm.classList.add("press");if(btn)btn.classList.add("press");
  try{cmd.setPointerCapture(e.pointerId);}catch(x){}
  e.preventDefault();});
cmd.addEventListener("pointermove",function(e){if(!G||G.id!==e.pointerId)return;var dx=e.clientX-G.x0,dy=e.clientY-G.y0;
  if(G.mode===null&&(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP)){
    if(Math.abs(dy)>=Math.abs(dx)*0.75)G.mode="scroll";
    else if(G.bid&&G.bid===focusId&&(G.trk||(!G.pm)))G.mode="slide";
    else G.mode="none";
    if(G.pm)G.pm.classList.remove("press");if(G.btn)G.btn.classList.remove("press");}
  if(G.mode==="scroll")cmd.scrollTop=G.st0-dy;
  else if(G.mode==="slide"){var trk=G.box.querySelector(".trk");if(sim.setBox(G.bid,valFromX(G.bid,trk,e.clientX)))changed();}});
function endG(e,cancel){if(!G||G.id!==e.pointerId)return;var g=G;G=null;if(g.pm)g.pm.classList.remove("press");if(g.btn)g.btn.classList.remove("press");
  /* a slide ends where the finger lifts: a slow WebView may not deliver a final move */
  if(!cancel&&g.mode==="slide"){var tk=g.box.querySelector(".trk");if(sim.setBox(g.bid,valFromX(g.bid,tk,e.clientX)))changed();return;}
  if(cancel||g.mode!==null)return;
  /* slow old WebViews can deliver a swipe as down -> up with few or no moves: judge by where the finger lifted */
  var dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP){if(Math.abs(dy)>=Math.abs(dx)*0.75)cmd.scrollTop=g.st0-dy;return;}
  /* a clean tap */
  if(g.pm&&g.bid){var d=+g.pm.getAttribute("data-d");setFocus(g.bid);if(sim.setBox(g.bid,sim.s.box[g.bid]+d*BOX[g.bid].step))changed();return;}
  if(g.btn){doAct(g.btn.getAttribute("data-act"));return;}
  if(g.bid){if(focusId===g.bid&&g.trk){if(sim.setBox(g.bid,valFromX(g.bid,g.trk,e.clientX)))changed();}else setFocus(g.bid);return;}
  setFocus(null);}
cmd.addEventListener("pointerup",function(e){endG(e,false);});
cmd.addEventListener("pointercancel",function(e){endG(e,true);});
cmd.addEventListener("lostpointercapture",function(e){if(G&&G.id===e.pointerId&&G.mode!==null)endG(e,true);});

  else if(id==="autob"){r(2,6,9,8,"#7a3a10");r(2,7,9,6,"#e0a040");r(2,6,9,1,"#f0e0b0");r(9,1,5,5,"#c4a020");r(10,2,3,3,"#ffe066");r(11,3,1,1,"#c4a020");}
  else{r(1,7,3,3,"#8a6a40");r(3,6,10,5,"#3a4038");r(4,7,8,3,"#12141a");r(5,3,6,1,"#c0361e");r(7,2,2,1,"#c0361e");r(5,12,6,1,"#3ad070");}}
function miniSlider(c,v){var mx=c.id==="pot"?Math.max(1,sim.potMax()):c.max,p=(v-c.min)/(mx-c.min),n=Math.max(1,Math.round((mx-c.min)/c.step)),tn=Math.min(n,14),tk="";
  for(var i=0;i<=tn;i++)tk+='<i class="tk" style="left:'+(i/tn*100)+'%"></i>';
  return '<div class="mini"><span class="e">'+esc(c.hi)+'</span><div class="mt"><div class="ln"></div><div class="mf" style="width:'+(p*100)+'%"></div>'+tk+'<div class="mk" style="left:'+((1-p)*100)+'%"></div></div><span class="e r">'+esc(c.lo)+'</span></div>';}
function pageHtml(pg){var s=sim.s,N=bookPages(),pn='<span class="pn">'+(pg+1)+' / '+N+'</span>';
  if(pg===0)return '<div id="pg" class="cover"><canvas class="ic" data-ic="cover" width="16" height="16"></canvas><div class="t1">PAPA POTATO</div><div class="t2">HANDBOOK</div><button class="go2" type="button" data-act="book:next">OPEN THE BOOK</button><div class="note" style="margin-top:12px;color:#d8b878">'+CMDS.length+' commands, one page each</div></div>';
  if(pg===N-1)return '<div id="pg">'+pn+'<div class="hd"><canvas class="ic" data-ic="loop" width="16" height="16"></canvas><b>THE LOOP</b></div><div class="lb">WHAT HE DOES</div><div class="chips"><span>PILE</span><span>&gt; PEEL TABLE</span><span>&gt; SHIP IN</span><span>&gt; RETURN</span><span>&gt; PILE</span></div><div class="tx">Peels pop off onto the floor and slow him down. A full chute spills back out of RETURN.</div><div class="lb">YOUR COINS GO TO</div><div class="chips"><span>FOOD</span><span>POTATOES</span><span>UPGRADES</span></div><div class="tx">Open the SHOP. Tap the room to see object names.</div></div>';
  var c=CMDS[pg-1],v=s.box[c.id];
  return '<div id="pg" data-cmd="'+c.id+'">'+pn+'<div class="hd"><canvas class="ic" data-ic="'+c.id+'" width="16" height="16"></canvas><b>'+esc(c.name)+'</b></div><div class="lb">DOES</div><div class="tx">'+esc(c.does)+'</div><div class="lb">SLIDER</div>'+miniSlider(c,v)+'<div class="now">NOW: '+esc(fmt(c.id,v))+'</div><div class="lb">AFFECTS</div><div class="tx">'+esc(c.affects)+'</div><div class="lb">RANGE</div><div class="rg">'+esc(c.range)+'</div></div>';}
function buildBook(dir){var N=bookPages(),h='<div id="book">'+pageHtml(bookPage)+'<div id="bkNav"><button type="button" data-act="book:prev"'+(bookPage<=0?' class="dis"':'')+'>&lt; PREV</button><div class="dots">';
  for(var i=0;i<N;i++)h+='<i'+(i===bookPage?' class="on"':'')+'></i>';h+='</div><button type="button" data-act="book:next"'+(bookPage>=N-1?' class="dis"':'')+'>NEXT &gt;</button></div></div>';
  ovlBody.innerHTML=h;var cs=ovlBody.querySelectorAll("canvas.ic");for(var j=0;j<cs.length;j++)icoDraw(cs[j],cs[j].getAttribute("data-ic"));
  if(dir){var pg=$("pg");pg.className=(pg.className?pg.className+" ":"")+(dir>0?"flipn":"flipp");}}
function flipBook(d){d=+d;d=d>0?1:(d<0?-1:0);var n=Math.max(0,Math.min(bookPages()-1,bookPage+d));if(n===bookPage)return false;bookPage=n;buildBook(d);return true;}
function buildOvl(){var st=ovlBody.scrollTop;ovlBody.className=ovlMode==="help"?"book":"";if(ovlMode==="shop")buildShop();else if(ovlMode==="help")buildBook(0);ovlBody.scrollTop=ovlMode==="shop"?st:0;$("ovlCoins").textContent=ovlMode==="shop"?sim.s.coins+"c":"";}
function openOvl(mode){ovlMode=mode;ovl.className="on";$("ovlTitle").textContent=mode==="shop"?"SHOP":"HELP BOOKLET";ovlBody.scrollTop=0;if(mode==="help")bookPage=0;buildOvl();if(focusId)setFocus(null);}
function closeOvl(){ovlMode=null;ovl.className="";OG=null;}
function flash(btn,txt){if(!btn)return;var old=btn.innerHTML;btn.innerHTML=txt;setTimeout(function(){if(ovlMode)ovlDirty=true;},700);}
function shopBuy(what){var r,btn=ovl.querySelector('[data-act="buy:'+what+'"]'),pr;
  if(what==="food"){pr=sim.price();r=sim.buyFood();}
  else if(what==="pot"){pr=sim.potPrice();r=sim.buyPotatoes();}
  else if(what.indexOf("up:")===0){var id=what.slice(3);pr=sim.upPrice(id);r=sim.buyUp(id);}
  else return "bad";
  if(r==="ok"){if(btn)btn.innerHTML="BOUGHT!";setTimeout(function(){ovlDirty=true;},600);changed();}
  else if(r==="poor"){if(btn)btn.innerHTML="NEED<br>"+pr+"c";setTimeout(function(){ovlDirty=true;},800);}
  else{if(btn)btn.innerHTML=r==="full"?"FULL":"MAXED";setTimeout(function(){ovlDirty=true;},800);}
  updateHud();saveGame();return r;}
ovl.addEventListener("pointerdown",function(e){if(OG&&OG.id!==e.pointerId)return;var t=e.target,btn=t.closest?t.closest("[data-act]"):null;
  OG={id:e.pointerId,x0:e.clientX,y0:e.clientY,st0:ovlBody.scrollTop,btn:btn,mode:null};if(btn)btn.classList.add("press");
  try{ovl.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
ovl.addEventListener("pointermove",function(e){if(!OG||OG.id!==e.pointerId)return;var dx=e.clientX-OG.x0,dy=e.clientY-OG.y0;
  if(OG.mode===null&&(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP)){OG.mode=Math.abs(dy)>=Math.abs(dx)*0.75?"scroll":"none";if(OG.btn)OG.btn.classList.remove("press");}
  if(OG.mode==="scroll")ovlBody.scrollTop=OG.st0-dy;});
function endO(e,cancel){if(!OG||OG.id!==e.pointerId)return;var g=OG;OG=null;if(g.btn)g.btn.classList.remove("press");if(cancel)return;
  var dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(ovlMode==="help"&&Math.abs(dx)>=40&&Math.abs(dx)>=Math.abs(dy)*1.2){flipBook(dx<0?1:-1);return;}   /* sideways swipe turns the page, judged where the finger lifts */
  if(g.mode!==null)return;
  if(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP){if(Math.abs(dy)>=Math.abs(dx)*0.75)ovlBody.scrollTop=g.st0-dy;return;}
  if(g.btn)doAct(g.btn.getAttribute("data-act"));}
ovl.addEventListener("pointerup",function(e){endO(e,false);});
ovl.addEventListener("pointercancel",function(e){endO(e,true);});
ovl.addEventListener("click",function(e){e.preventDefault();});

/* ---------- main loop: time runs only while the game is open and visible ---------- */
function events(){var ev=sim.s.ev;while(ev.length){var e=ev.shift();if(e.k==="coin"){popCoin(e.v,e.sloppy);pushSuck(e.sloppy);}else if(e.k==="peel")spawnPeel(e.slot);}}
var last=0,acc=0,STEP=0.05,paused=false,frames=0;
function frame(ts){
  var dt=last?Math.min(0.25,(ts-last)/1000):0;last=ts;
  if(!paused){acc+=dt;while(acc>=STEP){sim.step(STEP);acc-=STEP;}events();tickFlights(dt);tickDust(dt);tickSucks(dt);tickPops(dt);}
  RT=sim.s.t+acc;drawScene(ts);frames++;updateLabels();
  if(frames%6===0)updateHud();
  if(ts-lastSave>2000)saveGame();
  requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;saveGame();}else{paused=false;last=0;}});
window.addEventListener("pagehide",saveGame);window.addEventListener("beforeunload",saveGame);window.addEventListener("unload",saveGame);

coinIcon();layout();renderAll();updateHud();migUntil=performance.now()+9000;RT=sim.s.t;showLabels(30000);drawScene(performance.now());

  pause:function(p){paused=!!p;},layout:function(){return {W:W,H:H,k:k,roomW:roomW,roomH:roomH,offX:offX,offY:offY,detail:DETAIL,fitW:RW*k,fitH:RH*k};},version:"0.3",

  retView:function(){var s=sim.s,kk=s.suck;if(!kk)return [];var sc=PPSim.spill(kk.t0,kk.n),o=[];for(var j=kk.landed;j<kk.n;j++){var q=retPos(kk,sc,j,RT);o.push(q?{j:j,x:q.x,y:q.y,z:q.z,p:q.p,inPipe:q.inPipe,mouthX:q.mouthX,tx:q.tx,ty:q.ty}:{j:j,p:-1});}return o;},spillView:function(){var s=sim.s,kk=s.suck;if(!kk)return [];var sc=PPSim.spill(kk.t0,kk.n),o=[];for(var j=kk.landed;j<kk.n;j++)o.push({j:j,ex:sc.ex[j],ld:sc.ld[j],rt:RT});return o;},
