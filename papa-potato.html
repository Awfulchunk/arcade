<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Papa Potato 0.2</title>
<style>
/* Papa Potato 0.2 (Tough & J's Arcade). Layout + art from the approved mock 0.1b; play area zoomed out 20% (Jay t1016). */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#12141a;color:#eee;font-family:"Courier New",Courier,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--hud-w:100px;--cmd-pad:6px;--gap:4px;--tap:44px;--box-h:48px;--buy-h:44px;
  --cmd-h:calc(var(--cmd-pad)*2 + var(--buy-h) + var(--gap) + var(--box-h)*3 + var(--gap)*2)}
@media (min-height:700px){:root{--hud-w:108px}}
#app{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--hud-w);grid-template-rows:minmax(0,1fr) var(--cmd-h);
  grid-template-areas:"play hud" "cmd cmd";background:#0c1220}
#play{grid-area:play;position:relative;overflow:hidden;background:#8a846c;min-width:0;min-height:0;touch-action:none}
#play canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tag{position:absolute;z-index:2;font:700 10px/1 "Courier New",monospace;color:#ffe066;background:rgba(0,0,0,.8);border:1px solid #6a5020;border-radius:4px;padding:3px 6px;letter-spacing:.08em;pointer-events:none;white-space:nowrap}
#hint{position:absolute;z-index:3;left:6px;right:6px;top:25%;font:700 10px/1.3 "Courier New",monospace;color:#fff3c0;background:rgba(10,14,24,.88);border:1px solid #6a5020;border-radius:4px;padding:5px 7px;pointer-events:none;transition:opacity .4s;text-align:center}
#hint.off{opacity:0}
.pop{position:absolute;z-index:3;font:700 11px/1 "Courier New",monospace;color:#ffe066;text-shadow:1px 1px 0 #000;pointer-events:none;white-space:nowrap}
#hud{grid-area:hud;overflow:hidden;background:#0c1220;border-left:2px solid #2a3a58;display:flex;flex-direction:column;padding:8px 6px;min-width:0}
#hud>*{margin-bottom:8px}
@media (min-height:700px){#hud{padding:12px 8px}#hud>*{margin-bottom:12px}}
#hud .brand{flex:0 0 auto}
#hud .brand b{display:block;color:#ffe066;font-size:10px;letter-spacing:.08em;line-height:1.15}
#hud .brand span{display:block;color:#7f93ad;font-size:8px;letter-spacing:.1em;margin-top:2px}
.stat{flex:0 0 auto}
.stat .k{display:block;color:#9ab;font:700 8px/1 monospace;letter-spacing:.1em;margin-bottom:4px}
.stat .coins{color:#ffe066;font:700 18px/1 monospace;letter-spacing:.02em;display:flex;align-items:center}
.stat .coins canvas{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto;margin-right:5px}
.stat .food{color:#f0c890;font:700 13px/1 monospace;display:flex;align-items:center}
.stat .food canvas{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto;margin-right:5px}
.stat .food.out{color:#ff7a5a}
.two{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>.stat:first-child{margin-right:4px}
.stat .peels{color:#e8c070}
.stat .peels.messy{color:#ffb07a}
.stat .peels.filthy{color:#ff7a5a}
.mess{flex:0 0 auto;font:700 8px/1.2 monospace;color:#9ab;letter-spacing:.03em;min-height:10px;margin-top:-4px}
.mess.on{color:#ffb07a}
.bar{height:10px;background:#152038;border:1px solid #2e4060;border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%}
.bar.hunger i{background:#e09040}
.bar.energy i{background:#81ad78}
.bar.low i{background:#d04a3a}
.stat .pct{display:block;color:#cde;font:700 10px/1 monospace;margin-top:3px}
.states{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.states .k{margin-bottom:4px}
.st{font:700 9px/1.1 monospace;color:#7f93ad;padding:4px 4px;border:1px solid transparent;border-radius:3px;letter-spacing:.04em;margin-bottom:3px}
.st.on{color:#ffe066;background:#1a2840;border-color:#3a5080}
.st.lazy.on{color:#ffb07a;border-color:#80503a;background:#2a1c18}
#doing{font:700 8px/1.2 monospace;color:#9ab;letter-spacing:.04em;margin-top:2px;min-height:10px}
#cmd{grid-area:cmd;overflow:hidden;overflow-y:auto;background:#0c1220;border-top:3px solid #3a5080;padding:var(--cmd-pad);
  touch-action:none;box-shadow:0 -8px 18px rgba(0,0,0,.4);scrollbar-width:none;overscroll-behavior:contain}
#cmd::-webkit-scrollbar{display:none}
.box{height:var(--box-h);background:#1a2840;border:2px solid #2e4060;border-radius:5px;box-shadow:inset 0 -3px rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 4px;margin-bottom:var(--gap);position:relative}
.box.focus{border-color:#ffe066;background:#1f3150}
.box .mid{flex:1;min-width:0;margin:0 6px}
.box .top{display:flex;align-items:baseline;height:13px}
.box .nm{font:700 10px/1 monospace;color:#cde;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .lk{font:700 8px/1 monospace;color:#7f93ad;margin-left:5px;white-space:nowrap;flex:0 0 auto}
.box.focus .lk{color:#ffe066}
.box .val{margin-left:auto;padding-left:4px;font:700 10px/1 monospace;color:#ffe066;white-space:nowrap;flex:0 0 auto}
.box.unset .val{color:#ff9a6a}
.pm{flex:0 0 auto;width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);border:3px solid #647b8f;border-radius:4px;background:#162434;color:#dbe8e5;
  font:700 20px/1 monospace;box-shadow:inset 0 -4px #080f1d;padding:0;touch-action:none}
.pm.press{background:#45664f;border-color:#c4e490;box-shadow:inset 0 3px #24392d}
.trk{position:relative;height:22px;margin:1px 8px 0;touch-action:none}
.trk .ln{position:absolute;left:0;right:0;top:9px;height:5px;background:#0c1220;border:1px solid #2e4060}
.trk .fill{position:absolute;right:0;top:9px;height:5px;background:#5a6a50}
.box.focus .trk .fill{background:#ffe066}
.trk .tk{position:absolute;top:16px;width:1px;height:4px;background:#3a4a60}
.trk .kn{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border:3px solid #6a7a80;background:#3a4a50;box-shadow:inset 0 -4px #26343a;pointer-events:none}
.box.focus .trk .kn{border-color:#b3d5c1;background:#55746b;box-shadow:inset 0 -4px #304d49}
#buyWrap{position:sticky;bottom:-9px;z-index:2;background:#0c1220;padding:4px 0 var(--cmd-pad);margin-top:-4px;margin-bottom:calc(var(--cmd-pad)*-1 - 3px);box-shadow:0 -6px 8px rgba(12,18,32,.95)}
#buy{display:block;width:100%;height:var(--buy-h);min-height:var(--tap);border:3px solid #6a5020;border-radius:5px;background:#2a1e08;color:#ffd060;
  font:700 13px/1 monospace;letter-spacing:.08em;box-shadow:inset 0 -4px #140e04;padding:0;touch-action:none}
#buy.press{background:#3a2c10;border-color:#ffe066;color:#ffe066}
#buy.poor{color:#8a7a50;border-color:#4a3a18}
#buy.full{color:#8a9a70}
@media (max-height:600px){
  #hud{padding:6px 5px}#hud>*{margin-bottom:6px}
  .stat .coins{font-size:16px}
  .st{padding:3px 3px;font-size:8px;margin-bottom:2px}
  .box .nm,.box .val{font-size:9px}
  #buy{font-size:12px}
  .tag{font-size:9px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="app">
  <div id="play">
    <canvas id="cv"></canvas>
    <div class="tag" id="tagShip">SHIPPING</div>
    <div class="tag" id="tagPot">POTATOES</div>
    <div id="hint" class="off"></div>
  </div>
  <aside id="hud">
    <div class="brand"><b>PAPA<br>POTATO</b><span>v0.2</span></div>
    <div class="stat"><span class="k">COINS</span><div class="coins"><canvas id="coinIco" width="14" height="14"></canvas><span id="coins">0</span></div></div>
    <div class="two">
      <div class="stat"><span class="k">FOOD</span><div class="food" id="foodRow"><canvas id="foodIco" width="14" height="14"></canvas><span id="food">0</span></div></div>
      <div class="stat"><span class="k">PEELS</span><div class="food peels" id="peelRow"><canvas id="peelIco" width="14" height="14"></canvas><span id="peels">0</span></div></div>
    </div>
    <div class="mess" id="mess"></div>
    <div class="stat"><span class="k">HUNGER</span><div class="bar hunger" id="hBar"><i id="hFill"></i></div><span class="pct" id="hPct">100%</span></div>
    <div class="stat"><span class="k">ENERGY</span><div class="bar energy" id="eBar"><i id="eFill"></i></div><span class="pct" id="ePct">100%</span></div>
    <div class="states"><span class="k">STATE</span>
      <div class="st" data-s="PEELING">PEELING</div>
      <div class="st" data-s="EATING">EATING</div>
      <div class="st" data-s="NAPPING">NAPPING</div>
      <div class="st" data-s="CLEANING">CLEANING</div>
      <div class="st lazy" data-s="AUTO-LAZY">AUTO-LAZY</div>
      <div id="doing"></div>
    </div>
  </aside>
  <section id="cmd">
    <div class="box" data-id="pace"><button class="pm" data-d="1" aria-label="Work pace faster">+</button>
      <div class="mid"><div class="top"><span class="nm">WORK PACE</span><span class="lk"></span><span class="val"></span></div>
      <div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div>
      <button class="pm" data-d="-1" aria-label="Work pace slower">−</button></div>
    <div class="box" data-id="eat"><button class="pm" data-d="1" aria-label="Eat sooner">+</button>
      <div class="mid"><div class="top"><span class="nm">EAT WHEN HUNGER &lt;</span><span class="lk"></span><span class="val"></span></div>
      <div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div>
      <button class="pm" data-d="-1" aria-label="Eat later">−</button></div>
    <div class="box" data-id="nap"><button class="pm" data-d="1" aria-label="Nap sooner">+</button>
      <div class="mid"><div class="top"><span class="nm">NAP WHEN ENERGY &lt;</span><span class="lk"></span><span class="val"></span></div>
      <div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div>
      <button class="pm" data-d="-1" aria-label="Nap later">−</button></div>
    <div class="box" data-id="clean"><button class="pm" data-d="1" aria-label="Clean sooner">+</button>
      <div class="mid"><div class="top"><span class="nm">CLEAN WHEN PEELS &gt;</span><span class="lk"></span><span class="val"></span></div>
      <div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div>
      <button class="pm" data-d="-1" aria-label="Clean later">−</button></div>
    <div class="box" data-id="pot"><button class="pm" data-d="1" aria-label="More potatoes">+</button>
      <div class="mid"><div class="top"><span class="nm">POTATOES IN PLAY</span><span class="lk"></span><span class="val"></span></div>
      <div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div>
      <button class="pm" data-d="-1" aria-label="Fewer potatoes">−</button></div>
    <div id="buyWrap"><button id="buy" type="button">BUY FOOD · 8c</button></div>
  </section>
</div>
<script>
/* ===== Papa Potato 0.2 — simulation (no DOM; runs headless for tests) ===== */
var PPSim=(function(){
  var PACE=["CHILL","EASY","STEADY","BRISK","GRIND"];
  var SPD=[0.6,0.8,1.0,1.25,1.5];      /* work + walk speed */
  var DRN=[0.55,0.75,1.0,1.45,2.0];    /* hunger + energy drain */
  var C={
    walk:18,            /* canonical room units / s (room = 100 x 150) */
    grab:0.7, peel:6.0, drop:0.5, eat:3.0,
    meal:55, foodPrice:8, foodMax:9,
    hungerDrain:0.30, hungerDrainNap:0.10,
    energyDrain:0.42,
    napRegen:6.0, lazyNapRegen:4.0, napWake:98,
    value:2, sloppyValue:1,
    lazyLow:25, lazySpeed:0.5,
    startCoins:0, startFood:1,
    /* 0.2: shipping chute + suction loop */
    chuteCap:6, tSuck:2.0, tTransit:1.5, retGap:0.12, flight:0.8,
    /* 0.2: peels, mess penalty, sweeping */
    peelPer:3, peelPerSloppy:5, peelMax:200, messFull:90, messMax:0.30,
    sweepRate:6, sweepWind:0.8,
    /* 0.2: food price pushback: min(priceCap, round(foodPrice * priceGrow^bought) + floor(t / priceEvery)) */
    priceGrow:1.05, priceCap:14, priceEvery:900
  };
  /* potatoes in play (settings slider; index into this list). Cap chosen from the A03s throttle tests. */
  var POTS=[4,8,12,16,24,32,48,64,96,128,160,200,250,300,400,500,650,800];
  var BOX={
    pace:{min:0,max:4,step:1,def:2},
    eat:{min:0,max:70,step:5,def:0},   /* 0 = OFF (unset) */
    nap:{min:0,max:70,step:5,def:0},
    clean:{min:0,max:90,step:5,def:0},            /* 0 = OFF: sweep when peels > X */
    pot:{min:0,max:POTS.length-1,step:1,def:9}    /* index into POTS */
  };
  /* spots, as fractions of the room (render maps them to the real room) */
  var SPOT={
    table:{x:0.50,y:0.48,dir:0},
    chute:{x:0.50,y:0.175,dir:0},
    mat:{x:0.25,y:0.575,dir:1},
    food:{x:0.64,y:0.305,dir:0},
    sweep:{x:0.37,y:0.57,dir:3},
    pileY:0.665
  };
  function fresh(seed){
    seed=(seed>>>0)||((Math.random()*4294967295)>>>0);
    return {v:2,seed:seed,rs:0,rr:seed|0,t:0,
      coins:C.startCoins,food:C.startFood,hunger:100,energy:100,
      box:{pace:BOX.pace.def,eat:BOX.eat.def,nap:BOX.nap.def,clean:BOX.clean.def,pot:BOX.pot.def},
      pile:POTS[BOX.pot.def],chute:0,suck:null,peels:0,
      stats:{peeled:0,earned:0,meals:0,naps:0,lazyNaps:0,bought:0,spent:0,lazyTime:0,eatTime:0,napTime:0,firstBuyT:-1,
        sucks:0,swept:0,sweeps:0,peelsMade:0,maxPeels:0,cleanTime:0,waitTime:0},
      g:{x:0.5,y:0.40,dir:2,hold:null,job:"pile",peel:0,sloppy:false,lazy:false,act:null,walkPh:0},
      ev:[]};
  }
  function Sim(st){
    this.s=st||fresh();if(typeof this.s.rr!=="number")this.s.rr=this.s.seed|0;
    if(!this.s.g.act)this.decide();
  }
  var P=Sim.prototype;
  /* mulberry32 with its state kept in the save, so a loaded game continues exactly */
  P.rand=function(){var a=this.s.rr=(this.s.rr+0x6D2B79F5)|0;this.s.rs=(this.s.rs|0)+1;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  P.emit=function(e){if(this.s.ev.length<64)this.s.ev.push(e);};
  P.spd=function(){var g=this.s.g;return g.lazy?C.lazySpeed:SPD[this.s.box.pace];};
  /* messy floor slows walking, grabbing, peeling and dropping (not sweeping, not eating/napping) */
  P.messF=function(){return 1-C.messMax*Math.min(1,this.s.peels/C.messFull);};
  P.wspd=function(){return this.spd()*this.messF();};
  P.price=function(){var b=this.s.stats.bought;return Math.min(C.priceCap,Math.round(C.foodPrice*Math.pow(C.priceGrow,b))+Math.floor(this.s.t/C.priceEvery));};
  P.target=function(){return POTS[this.s.box.pot];};
  P.total=function(){var s=this.s,k=s.suck;return s.pile+(s.g.hold?1:0)+s.chute+(k?k.n-k.landed:0);};
  P.suckBusy=function(){var k=this.s.suck;return !!k&&this.s.t<k.t0+C.tSuck;};
  P.startSuck=function(){var s=this.s;if(s.suck||s.chute<=0)return false;s.suck={t0:s.t,n:s.chute,landed:0};s.chute=0;s.stats.sucks++;this.emit({k:"suck"});return true;};
  /* keep the number of potatoes in play equal to the slider: add to / take from the raw pile (then chute, then the ones in transit) */
  P.retarget=function(){var s=this.s,d=this.target()-this.total();if(d>0){s.pile+=d;return;}
    var r=-d,t=Math.min(r,s.pile);s.pile-=t;r-=t;
    if(r>0){t=Math.min(r,s.chute);s.chute-=t;r-=t;}
    if(r>0&&s.suck){var k=s.suck;t=Math.min(r,k.n-k.landed);k.n-=t;r-=t;if(k.n<=k.landed)s.suck=null;}};
  P.drn=function(){var g=this.s.g;return g.lazy?DRN[0]:DRN[this.s.box.pace];};
  P.needState=function(){
    var s=this.s,b=s.box;
    var eatThr=b.eat>0?b.eat:0,napThr=b.nap>0?b.nap:0;
    var wantEat=eatThr>0&&s.hunger<eatThr&&s.food>0;
    var wantNap=napThr>0&&s.energy<napThr;
    var hungerUnmet=(eatThr>0)?(s.hunger<eatThr&&s.food<=0):(s.hunger<C.lazyLow);
    var energyUnmet=napThr>0?false:(s.energy<C.lazyLow);
    var lazy=(hungerUnmet||energyUnmet);
    return {wantEat:wantEat,wantNap:wantNap,lazy:lazy,hungerUnmet:hungerUnmet,energyUnmet:energyUnmet,
      wantClean:b.clean>0&&s.peels>b.clean&&!lazy&&!s.g.hold};
  };
  P.walkTo=function(x,y,dir,then,label){var g=this.s.g;g.act={t:"walk",x:x,y:y,dir:dir,then:then,label:label};};
  P.decide=function(){
    var s=this.s,g=s.g,n=this.needState();
    if(n.wantEat){g.lazy=false;this.walkTo(SPOT.food.x,SPOT.food.y,SPOT.food.dir,"eat","to the food");return;}
    if(n.wantNap){g.lazy=false;this.walkTo(SPOT.mat.x,SPOT.mat.y,SPOT.mat.dir,"nap","to the mat");return;}
    g.lazy=n.lazy;
    if(n.wantClean){this.walkTo(SPOT.sweep.x,SPOT.sweep.y,SPOT.sweep.dir,"sweep","to the broom");return;}
    if(g.lazy){
      var r=this.rand();
      if(s.energy<15||(s.energy<70&&r<0.30)){g.act={t:"lazynap",until:Math.min(100,60+this.rand()*35),label:"dozing on the floor"};s.stats.lazyNaps++;this.emit({k:"lazynap"});return;}
      if(r>0.72){g.act={t:"idle",d:1.5+this.rand()*2.5,e:0,label:"slacking off"};return;}
    }
    if(g.job==="pile"){var px=0.36+this.rand()*0.28;this.walkTo(px,SPOT.pileY,2,"grab","to the pile");}
    else if(g.job==="table"||g.job==="peel"){this.walkTo(SPOT.table.x,SPOT.table.y,0,"peel","to the table");}
    else this.walkTo(SPOT.chute.x,SPOT.chute.y,0,"drop","to the chute");
  };
  P.startAt=function(kind){
    var g=this.s.g;
    if(kind==="grab")g.act={t:"grab",e:0,label:"grabbing a potato"};
    else if(kind==="peel"){g.job="peel";g.act={t:"peel",label:g.lazy?"peeling (sloppy)":"peeling"};}
    else if(kind==="drop")g.act={t:"drop",e:0,label:"shipping it"};
    else if(kind==="eat")g.act={t:"eat",e:0,label:"eating"};
    else if(kind==="sweep")g.act={t:"sweep",e:0,acc:0,label:"sweeping up the peels"};
    else if(kind==="nap"){g.act={t:"nap",label:"napping on the mat"};this.s.stats.naps++;this.emit({k:"nap"});}
  };
  /* one fixed step of game time (dt seconds, ≤ 0.25) */
  P.step=function(dt){
    var s=this.s,g=s.g,a=g.act,sp=this.spd(),dr=this.drn(),wsp=sp*this.messF();
    s.t+=dt;
    if(s.suck){var k=s.suck,T0=k.t0+C.tSuck+C.tTransit;
      while(k.landed<k.n&&s.t>=T0+k.landed*C.retGap+C.flight){s.pile++;k.landed++;this.emit({k:"land"});}
      if(k.landed>=k.n)s.suck=null;}
    if(a&&(a.t==="sweep"||(a.t==="walk"&&a.then==="sweep")))s.stats.cleanTime+=dt;
    var resting=a&&(a.t==="nap"||a.t==="lazynap"),eating=a&&a.t==="eat";
    if(resting){s.hunger-=C.hungerDrainNap*dt;}
    else if(!eating){s.hunger-=C.hungerDrain*dr*dt;s.energy-=C.energyDrain*dr*dt*(a&&a.t==="idle"?0.4:1);}
    if(s.hunger<0)s.hunger=0;if(s.energy<0)s.energy=0;
    if(g.lazy)s.stats.lazyTime+=dt;
    if(eating||(a&&a.t==="walk"&&a.then==="eat"))s.stats.eatTime+=dt;
    if(resting||(a&&a.t==="walk"&&a.then==="nap"))s.stats.napTime+=dt;
    if(!a){this.decide();return;}
    switch(a.t){
      case "walk":{

  el.classList.toggle("unset",id!=="pace"&&id!=="pot"&&v===0);el.classList.toggle("focus",focusId===id);el.querySelector(".lk").textContent=focusId===id?"◂SLIDE▸":"";}
function renderAll(){for(var id in BOX)renderBox(id);}
function setFocus(id){focusId=id;renderAll();}
(function(){for(var id in BOX){var el=cmd.querySelector('.box[data-id="'+id+'"]'),trk=el.querySelector(".trk"),b=BOX[id];
  var n=Math.round((b.max-b.min)/b.step),tn=Math.min(n,14);for(var i=0;i<=tn;i++){var t=document.createElement("i");t.className="tk";t.style.left=(i/tn*100)+"%";trk.appendChild(t);}}})();
function changed(){renderAll();updateHud();saveGame();}
function valFromX(id,trk,clientX){var r=trk.getBoundingClientRect(),b=BOX[id];var q=(clientX-r.left)/r.width;q=Math.max(0,Math.min(1,q));return b.min+(1-q)*(b.max-b.min);}
var G=null; /* the active gesture */
var SLOP=8;
cmd.addEventListener("pointerdown",function(e){if(G&&G.id!==e.pointerId)return;
  var t=e.target,box=t.closest?t.closest(".box"):null,pm=t.closest?t.closest(".pm"):null,trk=t.closest?t.closest(".trk"):null,buy=t.closest?t.closest("#buy"):null;
  G={id:e.pointerId,x0:e.clientX,y0:e.clientY,st0:cmd.scrollTop,box:box,bid:box?box.getAttribute("data-id"):null,pm:pm,trk:trk,buy:buy,mode:null};
  if(pm)pm.classList.add("press");if(buy)buy.classList.add("press");
  try{cmd.setPointerCapture(e.pointerId);}catch(x){}
  e.preventDefault();});
cmd.addEventListener("pointermove",function(e){if(!G||G.id!==e.pointerId)return;var dx=e.clientX-G.x0,dy=e.clientY-G.y0;
  if(G.mode===null&&(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP)){
    if(Math.abs(dy)>=Math.abs(dx)*0.75)G.mode="scroll";
    else if(G.bid&&G.bid===focusId&&(G.trk||(!G.pm)))G.mode="slide";
    else G.mode="none";
    if(G.pm)G.pm.classList.remove("press");if(G.buy)G.buy.classList.remove("press");}
  if(G.mode==="scroll")cmd.scrollTop=G.st0-dy;
  else if(G.mode==="slide"){var trk=G.box.querySelector(".trk");if(sim.setBox(G.bid,valFromX(G.bid,trk,e.clientX)))changed();}});
function endG(e,cancel){if(!G||G.id!==e.pointerId)return;var g=G;G=null;if(g.pm)g.pm.classList.remove("press");if(g.buy)g.buy.classList.remove("press");
  /* a slide ends where the finger lifts: a slow WebView may not deliver a final move (0.2 fix: swipe to the very end stopped short at 650) */
  if(!cancel&&g.mode==="slide"){var tk=g.box.querySelector(".trk");if(sim.setBox(g.bid,valFromX(g.bid,tk,e.clientX)))changed();return;}
  if(cancel||g.mode!==null)return;
  /* slow old WebViews can deliver a swipe as down → up with few or no moves: judge by where the finger lifted */
  var dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP){if(Math.abs(dy)>=Math.abs(dx)*0.75)cmd.scrollTop=g.st0-dy;return;}
  /* a clean tap */
  if(g.pm&&g.bid){var d=+g.pm.getAttribute("data-d");setFocus(g.bid);if(sim.setBox(g.bid,sim.s.box[g.bid]+d*BOX[g.bid].step))changed();return;}
  if(g.buy){doBuy();return;}
  if(g.bid){if(focusId===g.bid&&g.trk){if(sim.setBox(g.bid,valFromX(g.bid,g.trk,e.clientX)))changed();}else setFocus(g.bid);return;}
  setFocus(null);}
cmd.addEventListener("pointerup",function(e){endG(e,false);});
cmd.addEventListener("pointercancel",function(e){endG(e,true);});
cmd.addEventListener("lostpointercapture",function(e){if(G&&G.id===e.pointerId&&G.mode!==null)endG(e,true);});
/* gesture log for device tests (last 40 events) */
var GL=[];window.__ppGL=GL;["pointerdown","pointermove","pointerup","pointercancel"].forEach(function(t){cmd.addEventListener(t,function(e){GL.push(t.slice(7)+":"+Math.round(e.clientX)+","+Math.round(e.clientY)+(G?":"+G.mode:""));if(GL.length>40)GL.shift();},true);});
cmd.addEventListener("click",function(e){e.preventDefault();});
$("play").addEventListener("pointerdown",function(){if(focusId)setFocus(null);});
function doBuy(){var pr=sim.price(),r=sim.buyFood();var b=$("buy");buyFlash=true;
  var back=function(){buyFlash=false;hud.bl=null;b.textContent=buyLabel();updateHud();};
  if(r==="ok"){b.textContent="+1 FOOD!";setTimeout(back,700);}
  else if(r==="poor"){b.textContent="NEED "+pr+"c";setTimeout(back,700);}
  else{b.textContent="FOOD FULL";setTimeout(back,700);}
  updateHud();saveGame();}
b_init();
function b_init(){$("buy").textContent=buyLabel();}

/* ---------- main loop: time runs only while the game is open and visible ---------- */
var last=0,acc=0,STEP=0.05,paused=false,frames=0;
function events(){var ev=sim.s.ev;while(ev.length){var e=ev.shift();if(e.k==="coin")popCoin(e.v,e.sloppy);}}
function frame(ts){
  var dt=last?Math.min(0.25,(ts-last)/1000):0;last=ts;
  if(!paused){acc+=dt;while(acc>=STEP){sim.step(STEP);acc-=STEP;}events();tickBits(dt);tickPops(dt);}
  RT=sim.s.t+acc;drawScene(ts);frames++;
  if(frames%6===0)updateHud();
  if(ts-lastSave>2000)saveGame();
  requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;saveGame();}else{paused=false;last=0;}});
window.addEventListener("pagehide",saveGame);window.addEventListener("beforeunload",saveGame);window.addEventListener("unload",saveGame);
window.addEventListener("resize",function(){layout();drawScene(performance.now());});
coinIcon();layout();renderAll();updateHud();migUntil=performance.now()+9000;RT=sim.s.t;drawScene(performance.now());
requestAnimationFrame(frame);
/* test + debug hooks */
window.PP={get sim(){return sim;},Sim:PPSim,save:saveGame,key:SAVE_KEY,reset:function(seed){sim=PPSim.fresh(seed);focusId=null;hud={};boxSnap="";renderAll();updateHud();saveGame();},
  reload:function(){sim=loadGame();hud={};renderAll();updateHud();},focus:function(){return focusId;},
  pause:function(p){paused=!!p;},layout:function(){return {W:W,H:H,k:k,roomW:roomW,roomH:roomH,zoom:ZOOM,detail:DETAIL};},version:"0.2",setPileMax:function(n){PILEMAX=n;buildPile();pileLayer=null;pileKey=-1;},forcePile:function(n){sim.s.pile=n;},get migrated(){return migrated;},stats:function(){return {pileRenders:renders.pile,messRenders:renders.mess,maxVis:MAXVIS,tiers:TIER.slice(),messVis:MESSPOS.length};}};
window.__PP_READY=true;
})();
