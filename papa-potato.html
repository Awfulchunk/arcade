<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Papa Potato 0.4</title>
<style>
/* Papa Potato 0.4 (Tough & J's Arcade). Art lock: 0.3.1 Papa (sleep locked) + 0.4 machines/decor. Swarm DPR. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#12141a;color:#eee;font-family:"Courier New",Courier,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--hud-w:100px;--rail-w:48px;--cmd-pad:6px;--gap:4px;--tap:44px;--box-h:48px;--buy-h:44px;
  --cmd-h:calc(var(--cmd-pad)*2 + var(--buy-h) + var(--gap) + var(--box-h)*3 + var(--gap)*2)}
@media (min-height:700px){:root{--hud-w:108px}}
#app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--hud-w);grid-template-rows:minmax(0,1fr) var(--cmd-h);
  grid-template-areas:"stage hud" "cmd cmd";background:#0c1220}
#stage{grid-area:stage;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--rail-w);grid-template-rows:minmax(0,1fr);grid-template-areas:"lrail play rrail";min-width:0;min-height:0;background:#0c1220}
#play{grid-area:play;position:relative;overflow:hidden;background:#8a846c;min-width:0;min-height:0;touch-action:none}
#play canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:auto;display:block}
.tag{transition:opacity .35s;position:absolute;z-index:2;font:700 10px/1 "Courier New",monospace;color:#ffe066;background:rgba(0,0,0,.8);border:1px solid #6a5020;border-radius:4px;padding:3px 6px;letter-spacing:.08em;pointer-events:none;white-space:nowrap}
#play .tag.off{opacity:0}
#hint{position:absolute;z-index:3;left:8px;right:8px;top:8px;font:700 10px/1.3 "Courier New",monospace;color:#fff3c0;background:rgba(10,14,24,.88);border:1px solid #6a5020;border-radius:4px;padding:5px 7px;pointer-events:none;transition:opacity .4s;text-align:center}
#hint.off{opacity:0}
.pop{position:absolute;z-index:3;font:700 11px/1 "Courier New",monospace;color:#ffe066;text-shadow:1px 1px 0 #000;pointer-events:none;white-space:nowrap}
#hud{grid-area:hud;overflow:hidden;background:#0c1220;border-left:2px solid #2a3a58;display:flex;flex-direction:column;padding:8px 6px;min-width:0}
#hud>*{margin-bottom:8px}
@media (min-height:700px){#hud{padding:12px 8px}#hud>*{margin-bottom:12px}}
#hud .brand{flex:0 0 auto}
#hud .brand b{display:block;color:#ffe066;font-size:10px;letter-spacing:.08em;line-height:1.15}
#hud .brand span{display:block;color:#7f93ad;font-size:8px;letter-spacing:.1em;margin-top:2px}
.stat{flex:0 0 auto}
.stat .k{display:block;color:#9ab;font:700 8px/1 monospace;letter-spacing:.1em;margin-bottom:4px}
.stat .coins{color:#ffe066;font:700 18px/1 monospace;letter-spacing:.02em;display:flex;align-items:center}
.stat .coins canvas{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto;margin-right:5px}
.stat .food{color:#f0c890;font:700 13px/1 monospace;display:flex;align-items:center}
.stat .food canvas{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto;margin-right:5px}
.stat .food.out{color:#ff7a5a}
.two{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>.stat:first-child{margin-right:4px}
.stat .peels{color:#e8c070}
.stat .peels.messy{color:#ffb07a}
.stat .peels.filthy{color:#ff7a5a}
.mess{flex:0 0 auto;font:700 8px/1.2 monospace;color:#9ab;letter-spacing:.03em;min-height:10px;margin-top:-4px}
.mess.on{color:#ffb07a}
.bar{height:10px;background:#152038;border:1px solid #2e4060;border-radius:2px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%}
.bar.hunger i{background:#e09040}
.bar.energy i{background:#81ad78}
.bar.low i{background:#d04a3a}
.stat .pct{display:block;color:#cde;font:700 10px/1 monospace;margin-top:3px}
.states{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.states .k{margin-bottom:4px}
.st{font:700 9px/1.1 monospace;color:#7f93ad;padding:4px 4px;border:1px solid transparent;border-radius:3px;letter-spacing:.04em;margin-bottom:3px}
.st.on{color:#ffe066;background:#1a2840;border-color:#3a5080}
.st.lazy.on{color:#ffb07a;border-color:#80503a;background:#2a1c18}
#doing{font:700 8px/1.2 monospace;color:#9ab;letter-spacing:.04em;margin-top:2px;min-height:10px}
#cmd{grid-area:cmd;overflow:hidden;overflow-y:auto;background:#0c1220;border-top:3px solid #3a5080;padding:var(--cmd-pad);
  touch-action:none;box-shadow:0 -8px 18px rgba(0,0,0,.4);scrollbar-width:none;overscroll-behavior:contain}
#cmd::-webkit-scrollbar{display:none}
.box{height:var(--box-h);background:#1a2840;border:2px solid #2e4060;border-radius:5px;box-shadow:inset 0 -3px rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 4px;margin-bottom:var(--gap);position:relative}
.box.focus{border-color:#ffe066;background:#1f3150}
.box .mid{flex:1;min-width:0;margin:0 6px}
.box .top{display:flex;align-items:baseline;height:13px}
.box .nm{font:700 10px/1 monospace;color:#cde;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .lk{font:700 8px/1 monospace;color:#7f93ad;margin-left:5px;white-space:nowrap;flex:0 0 auto}
.box.focus .lk{color:#ffe066}
.box .val{margin-left:auto;padding-left:4px;font:700 10px/1 monospace;color:#ffe066;white-space:nowrap;flex:0 0 auto}
.box.unset .val{color:#ff9a6a}
.pm{flex:0 0 auto;width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);border:3px solid #647b8f;border-radius:4px;background:#162434;color:#dbe8e5;
  font:700 20px/1 monospace;box-shadow:inset 0 -4px #080f1d;padding:0;touch-action:none}
.pm.press{background:#45664f;border-color:#c4e490;box-shadow:inset 0 3px #24392d}
.trk{position:relative;height:22px;margin:1px 8px 0;touch-action:none}
.trk .ln{position:absolute;left:0;right:0;top:9px;height:5px;background:#0c1220;border:1px solid #2e4060}
.trk .fill{position:absolute;right:0;top:9px;height:5px;background:#5a6a50}
.box.focus .trk .fill{background:#ffe066}
.trk .tk{position:absolute;top:16px;width:1px;height:4px;background:#3a4a60}
.trk .kn{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border:3px solid #6a7a80;background:#3a4a50;box-shadow:inset 0 -4px #26343a;pointer-events:none}
.box.focus .trk .kn{border-color:#b3d5c1;background:#55746b;box-shadow:inset 0 -4px #304d49}
#bar{position:sticky;bottom:-9px;z-index:2;background:#0c1220;padding:4px 0 var(--cmd-pad);margin-top:-4px;margin-bottom:calc(var(--cmd-pad)*-1 - 3px);box-shadow:0 -6px 8px rgba(12,18,32,.95);display:flex}
#bar button{display:block;height:var(--buy-h);min-height:var(--tap);border:3px solid #6a5020;border-radius:5px;background:#2a1e08;color:#ffd060;
  font:700 13px/1 monospace;letter-spacing:.08em;box-shadow:inset 0 -4px #140e04;padding:0;touch-action:none}
#bar #shopBtn{flex:1 1 auto;margin-right:6px}
#bar #helpBtn{flex:0 0 33%;border-color:#3a5080;background:#14203a;color:#9fc0ff;box-shadow:inset 0 -4px #0a1226}
#bar button.press{background:#3a2c10;border-color:#ffe066;color:#ffe066}
#bar #helpBtn.press{background:#1f3150;border-color:#b3d5ff;color:#fff}
#bar #shopBtn.can{border-color:#ffe066}
/* shop + help screens */
#ovl{position:absolute;left:0;top:0;right:0;bottom:0;z-index:30;background:#0c1220;display:none;flex-direction:column}
#ovl.on{display:flex}
#ovlHead{flex:0 0 auto;display:flex;align-items:center;height:48px;padding:0 6px;border-bottom:3px solid #3a5080;background:#101a2e}
#ovlHead .tt{flex:1 1 auto;font:700 13px/1 monospace;color:#ffe066;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ovlHead .cn{flex:0 0 auto;font:700 13px/1 monospace;color:#ffe066;margin-right:8px;white-space:nowrap}
#ovlHead .x{flex:0 0 auto;width:var(--tap);height:var(--tap);border:3px solid #647b8f;border-radius:4px;background:#162434;color:#dbe8e5;font:700 16px/1 monospace;padding:0;box-shadow:inset 0 -4px #080f1d;touch-action:none}
#ovlHead .x.press{background:#45664f;border-color:#c4e490}
#ovlBody{flex:1 1 auto;min-height:0;overflow:hidden;overflow-y:auto;padding:8px 8px 18px;touch-action:none;scrollbar-width:none;overscroll-behavior:contain}
#ovlBody::-webkit-scrollbar{display:none}
.sec{font:700 10px/1 monospace;color:#7f93ad;letter-spacing:.12em;margin:10px 2px 6px}
.sec:first-child{margin-top:2px}
.row{background:#1a2840;border:2px solid #2e4060;border-radius:5px;padding:7px 8px;margin-bottom:6px;display:flex;align-items:center}
.row .tx{flex:1 1 auto;min-width:0;margin-right:8px}
.row .nm{font:700 11px/1.2 monospace;color:#e8eef4;letter-spacing:.04em}
.row .nm b{color:#ffe066}
.row .fx{font:700 9px/1.3 monospace;color:#9ab;margin-top:3px}
.row .go{flex:0 0 auto;min-width:64px;height:var(--tap);border:3px solid #6a5020;border-radius:4px;background:#2a1e08;color:#ffd060;font:700 12px/1.1 monospace;padding:0 6px;box-shadow:inset 0 -4px #140e04;touch-action:none}
.row .go.press{background:#3a2c10;border-color:#ffe066;color:#ffe066}
.row .go.poor{color:#8a7a50;border-color:#4a3a18}
.row .go.done{color:#8a9a70;border-color:#3a4a30;background:#18200f}
.row.cmdrow{display:block}
.row.cmdrow .nm{font-size:12px}
.row.cmdrow .rg{font:700 9px/1.3 monospace;color:#ffe066;margin-top:3px}
.row.cmdrow .wt{font:700 10px/1.35 monospace;color:#cde;margin-top:4px}
.row.cmdrow .fx{margin-top:4px}
.row.cmdrow .now{float:right;font:700 10px/1 monospace;color:#ffe066}
/* booklet (help) */
#ovlBody.book{overflow:hidden;padding:8px;display:flex;flex-direction:column}
#book{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#pg{flex:1 1 auto;min-height:0;position:relative;background:#e9dfc2;border:3px solid #5a3a1c;border-radius:4px 10px 10px 4px;box-shadow:inset 8px 0 10px -6px rgba(0,0,0,.35),0 3px 0 #2a1a0c;padding:10px 12px 8px 16px;color:#2a1c0c;overflow:hidden;transform-origin:0 50%}
#pg:after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 16px 16px;border-color:transparent transparent #5a3a1c transparent}
#pg.flipn{animation:flipn .34s ease-out}
#pg.flipp{animation:flipp .34s ease-out}
@keyframes flipn{0%{transform:perspective(600px) rotateY(-70deg);opacity:.2}100%{transform:perspective(600px) rotateY(0);opacity:1}}
@keyframes flipp{0%{transform:perspective(600px) rotateY(70deg);opacity:.2}100%{transform:perspective(600px) rotateY(0);opacity:1}}
#pg:not(.cover){display:flex;flex-direction:column;justify-content:space-around}
#pg .pn{position:absolute;right:12px;top:6px;font:700 9px/1 monospace;color:#8a6a40}
#pg .hd{display:flex;align-items:center;margin-bottom:8px}
#pg .hd canvas{flex:0 0 auto;width:48px;height:48px;image-rendering:pixelated;background:#cdbf98;border:2px solid #5a3a1c;border-radius:4px;margin-right:10px}
#pg .hd b{font:700 14px/1.15 monospace;color:#3a1c08;letter-spacing:.03em}
#pg .lb{font:700 9px/1 monospace;color:#8a5a20;letter-spacing:.12em;margin:8px 0 3px}
#pg .tx{font:700 12px/1.3 monospace;color:#2a1c0c}
#pg .mini{display:flex;align-items:center;margin:2px 0 0}
#pg .mini .e{flex:0 0 auto;font:700 10px/1 monospace;color:#5a3a1c;min-width:34px}
#pg .mini .e.r{text-align:right}
#pg .mt{position:relative;flex:1 1 auto;height:22px;margin:0 6px}
#pg .mt .ln{position:absolute;left:0;right:0;top:8px;height:6px;background:#b9a878;border:1px solid #5a3a1c}
#pg .mt .mf{position:absolute;right:0;top:8px;height:6px;background:#6a8a3a}
#pg .mt .tk{position:absolute;top:15px;width:1px;height:5px;background:#5a3a1c}
#pg .mt .mk{position:absolute;top:2px;width:14px;height:16px;margin-left:-7px;background:#c0361e;border:2px solid #5a1408;border-radius:2px}
#pg .now{font:700 11px/1 monospace;color:#c0361e;margin-top:6px}
#pg .rg{font:700 11px/1.2 monospace;color:#3a5a1c}
#pg.cover{background:#5a3418;border-color:#2a1808;color:#f0d890;text-align:center;box-shadow:inset 8px 0 10px -6px rgba(0,0,0,.6),0 3px 0 #1a0e04;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pg.cover:after{display:none}
#pg.cover .t1{font:700 20px/1.1 monospace;letter-spacing:.1em;color:#ffe066;text-shadow:2px 2px 0 #2a1808}
#pg.cover .t2{font:700 12px/1.2 monospace;letter-spacing:.2em;margin:6px 0 14px}
#pg.cover canvas{width:64px;height:64px;image-rendering:pixelated;margin-bottom:10px}
#pg.cover .go2{height:var(--tap);min-width:150px;border:3px solid #ffe066;border-radius:4px;background:#2a1808;color:#ffe066;font:700 13px/1 monospace;letter-spacing:.1em;touch-action:none;padding:0 12px;box-shadow:inset 0 -4px #140a02}
#pg.cover .go2.press{background:#6a4420}
#pg .chips{display:flex;flex-wrap:wrap;margin-top:4px}
#pg .chips span{font:700 10px/1 monospace;background:#cdbf98;border:2px solid #5a3a1c;border-radius:3px;padding:5px 6px;margin:0 4px 4px 0;color:#3a1c08}
@media (min-height:700px){
#pg{padding:14px 16px 10px 20px}#pg .hd{margin-bottom:14px}#pg .hd canvas{width:72px;height:72px}#pg .hd b{font-size:18px}
#pg .lb{font-size:10px;margin:14px 0 5px}#pg .tx{font-size:14px;line-height:1.35}#pg .mt{height:30px}#pg .mt .ln{top:12px;height:8px}#pg .mt .mf{top:12px;height:8px}#pg .mt .tk{top:21px;height:6px}#pg .mt .mk{top:4px;width:18px;height:22px;margin-left:-9px}
#pg .mini .e{font-size:11px;min-width:40px}#pg .now{font-size:14px;margin-top:10px}#pg .rg{font-size:13px}#pg.cover .t1{font-size:24px}#pg.cover canvas{width:96px;height:96px}#pg .chips span{font-size:12px;padding:7px 8px}}
@media (max-height:600px){#pg{padding:8px 10px 6px 14px}#pg .hd{margin-bottom:5px}#pg .lb{margin:5px 0 2px}#pg .tx{font-size:11px;line-height:1.25}#pg .hd canvas{width:40px;height:40px}}
#bkNav{flex:0 0 auto;display:flex;align-items:center;margin-top:8px}
#bkNav button{flex:0 0 auto;width:84px;height:var(--tap);border:3px solid #6a5020;border-radius:4px;background:#2a1e08;color:#ffd060;font:700 12px/1 monospace;padding:0;touch-action:none;box-shadow:inset 0 -4px #140e04}
#bkNav button.press{background:#3a2c10;border-color:#ffe066}
#bkNav button.dis{opacity:.35}
#bkNav .dots{flex:1 1 auto;text-align:center;line-height:0}
#bkNav .dots i{display:inline-block;width:7px;height:7px;margin:0 2px;background:#3a4a60;border-radius:1px}
#bkNav .dots i.on{background:#ffe066}
.note{font:700 10px/1.4 monospace;color:#9ab;margin:2px 2px 8px}
@media (max-height:600px){
  #hud{padding:6px 5px}#hud>*{margin-bottom:6px}
  .stat .coins{font-size:16px}
  .st{padding:3px 3px;font-size:8px;margin-bottom:2px}
  .box .nm,.box .val{font-size:9px}
  #bar button{font-size:12px}
  .row .fx{font-size:8.5px}
  .tag{font-size:9px;padding:2px 5px}
}

/* Side rails sit OUTSIDE the room viewport (Jay t1065). The room shrinks to fit between them. */
.rail{display:flex;flex-direction:column;align-items:center;background:#0c1220;min-width:0;min-height:0;z-index:5;pointer-events:auto;padding:4px 0}
#leftRail{grid-area:lrail;border-right:2px solid #2a3a58;justify-content:flex-end}
#rightRail{grid-area:rrail;border-left:2px solid #2a3a58;justify-content:flex-start}
#zoomRail,#panPad{position:static;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto}
#zoomRail{margin-top:2px}
#panPad{margin-bottom:2px}
#zoomRail button,#panPad button,#editBtn{width:calc(var(--rail-w) - 8px);height:40px;min-width:36px;min-height:36px;border:3px solid #647b8f;border-radius:4px;background:#162434;color:#dbe8e5;font:700 16px/1 monospace;box-shadow:inset 0 -3px #080f1d;padding:0;touch-action:none;flex:0 0 auto}
#zoomRail button.press,#panPad button.press,#editBtn.press{background:#45664f;border-color:#c4e490}
#zoomLabel{font:700 8px/1 monospace;color:#ffe066;background:#162434;border:1px solid #3a5080;border-radius:3px;padding:4px 0;width:calc(var(--rail-w) - 8px);text-align:center;letter-spacing:.04em}
#editBtn{margin-top:auto;margin-bottom:2px;height:auto;min-height:44px;padding:6px 0;font-size:10px;letter-spacing:.08em;color:#ffd060;border-color:#6a5020;background:#2a1e08;box-shadow:inset 0 -3px #140e04}
#editBtn.on{border-color:#ffe066;color:#ffe066;background:#3a2c10}
#play.editing{outline:2px solid #ffe066;outline-offset:-2px}
@media (max-height:600px){
  :root{--rail-w:44px}
  #zoomRail button,#panPad button{height:36px;font-size:14px}
  #editBtn{min-height:40px;font-size:9px}
}
@media (max-width:340px){:root{--rail-w:44px}}
.stat .lv{color:#9fc0ff;font:700 12px/1 monospace}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <aside id="leftRail" class="rail" aria-label="Scroll the room">
      <div id="panPad">
        <button type="button" data-act="pan:up" aria-label="Scroll up">▲</button>
        <button type="button" data-act="pan:left" aria-label="Scroll left">◀</button>
        <button type="button" data-act="pan:reset" aria-label="Reset view">•</button>
        <button type="button" data-act="pan:right" aria-label="Scroll right">▶</button>
        <button type="button" data-act="pan:down" aria-label="Scroll down">▼</button>
      </div>
    </aside>
    <div id="play">
      <canvas id="cv"></canvas>
      <div class="tag" id="tagShip">SHIP IN</div>
      <div class="tag" id="tagRet">RETURN</div>
      <div class="tag" id="tagTable">PEEL TABLE</div>
      <div class="tag" id="tagBed">BED</div>
      <div class="tag" id="tagFood">FOOD</div>
      <div class="tag" id="tagSeat">SEAT</div>
      <div class="tag" id="tagPot">POTATOES</div>
      <div class="tag off" id="tagPeeler">AUTO-PEELER</div>
      <div class="tag off" id="tagLine">TO SHIP</div>
      <div class="tag off" id="tagSink">SINK</div>
      <div class="tag off" id="tagTV">TV + CHAIR</div>
      <div id="hint" class="off"></div>
    </div>
    <aside id="rightRail" class="rail" aria-label="Zoom and editor">
      <div id="zoomRail">
        <button type="button" data-act="zoom:in" aria-label="Zoom in">+</button>
        <div id="zoomLabel">FIT</div>
        <button type="button" data-act="zoom:out" aria-label="Zoom out">&minus;</button>
      </div>
      <button id="editBtn" type="button" data-act="editor">EDIT</button>
    </aside>
  </div>
  <aside id="hud">
    <div class="brand"><b>PAPA<br>POTATO</b><span>v0.4</span></div>
    <div class="stat"><span class="k">LEVEL</span><div class="lv" id="level">1 / 5</div></div>
    <div class="stat"><span class="k">COINS</span><div class="coins"><canvas id="coinIco" width="14" height="14"></canvas><span id="coins">0</span></div></div>
    <div class="two">
      <div class="stat"><span class="k">FOOD</span><div class="food" id="foodRow"><canvas id="foodIco" width="14" height="14"></canvas><span id="food">0</span></div></div>
      <div class="stat"><span class="k">PEELS</span><div class="food peels" id="peelRow"><canvas id="peelIco" width="14" height="14"></canvas><span id="peels">0</span></div></div>
    </div>
    <div class="mess" id="mess"></div>
    <div class="stat"><span class="k">HUNGER</span><div class="bar hunger" id="hBar"><i id="hFill"></i></div><span class="pct" id="hPct">100%</span></div>
    <div class="stat"><span class="k">ENERGY</span><div class="bar energy" id="eBar"><i id="eFill"></i></div><span class="pct" id="ePct">100%</span></div>
    <div class="states"><span class="k">STATE</span>
      <div class="st" data-s="PEELING">PEELING</div>
      <div class="st" data-s="EATING">EATING</div>
      <div class="st" data-s="NAPPING">NAPPING</div>

      disc(cx, cy + 0.4, hr + 0.7, hr + 0.35, "#2a2018", OUT);
      oval(cx, cy + 0.15, hr - 0.15, hr - 0.35, "#3a2a20");
      oval(cx - hr * 0.22, cy - hr * 0.06, hr * 0.55, hr * 0.48, "#4a3828");
      oval(cx - hr * 0.28, cy - hr * 0.18, Math.max(0.8, hr * 0.42), Math.max(0.6, hr * 0.28), "#5a4630");
      oval(cx - hr * 0.18, cy - hr * 0.28, Math.max(0.5, hr * 0.2), Math.max(0.4, hr * 0.14), "#8a7860");
      oval(cx - hr * 0.12, cy - hr * 0.12, Math.max(0.35, hr * 0.08), Math.max(1.0, hr * 0.55), "#6a5640");
      oval(cx - hr * 0.45, cy - hr + 0.55, Math.max(0.6, hr * 0.18), Math.max(0.5, hr * 0.14), "#2a2018");
      oval(cx - hr * 0.05, cy - hr + 0.35, Math.max(0.7, hr * 0.22), Math.max(0.5, hr * 0.13), "#3a2a20");
      oval(cx + hr * 0.38, cy - hr + 0.55, Math.max(0.55, hr * 0.16), Math.max(0.5, hr * 0.13), "#2a2018");
      var ear = Math.max(0.7, Math.min(1.05 * u, hr * 0.22));
      disc(cx - hr + 0.1, cy + hr * 0.12, ear, ear * 0.92, "#8a6840", OUT);
      oval(cx - hr + 0.1, cy + hr * 0.12, ear * 0.55, ear * 0.55, "#c4a070");
      disc(cx + hr - 0.1, cy + hr * 0.12, ear, ear * 0.92, "#8a6840", OUT);
      oval(cx + hr - 0.1, cy + hr * 0.12, ear * 0.55, ear * 0.55, "#c4a070");
    }
    function body(cx, cy, shy) {
      softShadow(cx, cy + shy + 1.2, shW * 0.52, shH * 0.7);
      disc(cx, cy + shy + 0.25, shW / 2 + 0.15, shH / 2 + 0.45, "#2a4a62", OUT);
      oval(cx, cy + shy - 0.15, shW / 2 - 1.0, shH / 2 - 0.25, "#3a6a8a");
      oval(cx - 0.4, cy + shy - 0.7, Math.max(1.2, shW / 2 - 2.4), Math.max(1.0, shH / 2 - 1.6), "#5a8aaa");
      oval(cx - 0.9, cy + shy - 1.1, Math.max(0.9, shW / 2 - 3.6), Math.max(0.7, shH / 2 - 2.2), "#7aa8c0");
      disc(cx, cy + shy - shH * 0.42, Math.max(0.9, shW * 0.12), 0.85, "#2a4a62", OUT);
      oval(cx, cy + shy - shH * 0.42, Math.max(0.55, shW * 0.08), 0.45, "#c8d0a8");
    }
    var shy = hr + Math.max(1.4, shH * 0.40) + breath * 0.25;
    if (kind === "sit" || kind === "watch") {
      /* True top-down seated, facing east (toward the TV). The whole body stays IN the seat:
         shoulders as a N-S oval between the armrests, crown slightly east, hands on the arms. */
      var su = k * 0.70;
      var sHr = 4.8 * su, sShN = 6.4 * su, sShE = 4.6 * su;
      softShadow(px, py + ws(0.5), sShE * 0.75, sShN * 0.7);
      /* body west of the head (he faces east): N-S shoulders in the seat */
      disc(px - ws(1.0), py, sShE / 2 + 0.25, sShN / 2 + 0.4, "#2a4a62", OUT);
      oval(px - ws(0.85), py - 0.2, sShE / 2 - 0.5, sShN / 2 - 0.35, "#3a6a8a");
      oval(px - ws(1.05), py - 0.5, Math.max(0.8, sShE / 2 - 1.3), Math.max(0.8, sShN / 2 - 1.1), "#5a8aaa");
      disc(px - ws(0.15), py, Math.max(0.6, 0.7 * su), 0.7, "#2a4a62", OUT);
      oval(px - ws(0.15), py, Math.max(0.4, 0.45 * su), 0.4, "#c8d0a8");
      /* hands on the north and south armrests */
      disc(px - ws(0.2), py - sShN * 0.52, 1.2 * su, 1.05 * su, "#c4a070", "#5a3a22");
      disc(px - ws(0.2), py + sShN * 0.52, 1.2 * su, 1.05 * su, "#c4a070", "#5a3a22");
      /* head toward the TV (east), still in the seat */
      var oldHr = hr; hr = sHr;
      crown(px + ws(2.2), py);
      hr = oldHr;
    } else if (kind === "sleep") {
      crown(px, py);
    } else {
      body(px, py, shy);
      /* simple arm nubs */
      disc(px - shW * 0.40, py + shy - shH * 0.42, 2.1 * u, 1.95 * u, "#2a4a62", OUT);
      oval(px - shW * 0.40, py + shy - shH * 0.42, 1.65 * u, 1.5 * u, "#4a7a9a");
      disc(px + shW * 0.40, py + shy - shH * 0.42, 2.1 * u, 1.95 * u, "#2a4a62", OUT);
      oval(px + shW * 0.40, py + shy - shH * 0.42, 1.65 * u, 1.5 * u, "#5a8aaa");
      crown(px, py);
    }
  }

  /* ======================== MACHINES ======================== */

  /* Vertical belt. (cx, cy) = center of a default 11 x 36 segment, or pass opt.y0/opt.y1. */
  function drawConveyor(cx, cy, state, opt) {
    opt = opt || {};
    var h = opt.h || 36, y0 = opt.y0 != null ? opt.y0 : cy - h / 2, y1 = opt.y1 != null ? opt.y1 : cy + h / 2;
    drawConveyorRun(cx, y0, y1, state, opt);
  }
  function drawConveyorRun(cx, y0, y1, state, opt) {
    opt = opt || {};
    var on = state === "on";
    var beltW = 9, rail = 0.9;
    var x0 = cx - beltW / 2;
    if (y1 < y0) { var t = y0; y0 = y1; y1 = t; }
    /* shadow + rails + deck (same language as the shipping belt) */
    wr(x0 - rail + 0.5, y0 + 0.5, beltW + rail * 2, y1 - y0, "rgba(0,0,0,0.30)");
    wr(x0 - rail, y0, beltW + rail * 2, y1 - y0, "#2a2c28");
    wr(x0, y0, beltW, y1 - y0, on ? "#4a4a44" : "#3a3a36");
    wr(x0, y0, beltW, 0.5, "#6a6a60");
    wr(x0 - rail, y0, rail, y1 - y0, "#6a7068");
    wr(x0 + beltW, y0, rail, y1 - y0, "#3a4038");
    wr(x0 - rail, y0, beltW + rail * 2, 0.6, "#8a9088");
    wr(x0 - rail, y1 - 0.6, beltW + rail * 2, 0.6, "#2a2c28");
    /* roller caps; cap0 = north (y0), cap1 = south (y1). Omit at a butt joint. */
    if (opt.cap0 !== false) {
      wr(x0 - 1.2, y0 - 0.4, beltW + 2.4, 1.6, "#3a4038");
      wr(x0 - 0.7, y0 - 0.1, beltW + 1.4, 1.0, on ? "#9aa49a" : "#6a7068");
    }
    if (opt.cap1 !== false) {
      wr(x0 - 1.2, y1 - 1.2, beltW + 2.4, 1.6, "#3a4038");
      wr(x0 - 0.7, y1 - 0.9, beltW + 1.4, 1.0, on ? "#9aa49a" : "#6a7068");
    }
    /* slats travel north (toward the peeler). 4 discrete frames, period 3.2 like the ship belt. */
    var period = 3.2, off = on ? (ANIM_F / 4) * period : 0;
    var slatC = on ? "#6a6a58" : "#4a4a44", slatH = on ? "#8a8a70" : "#5a5a52";
    for (var y = y0 - period + off; y < y1; y += period) {
      var a = Math.max(y0 + 0.4, y), b = Math.min(y1 - 0.4, y + 1.3);
      if (b <= a) continue;
      wr(x0 + 0.3, a, beltW - 0.6, b - a, slatC);
      wr(x0 + 0.3, a, beltW - 0.6, 0.35, slatH);
    }
    /* potatoes riding (on) or sitting still (off, one idle) */
    var slots = opt.slots || (on ? [0.18, 0.42, 0.68, 0.88] : [0.55]);
    var minP = opt.minP || 0;
    var maxP = opt.maxP == null ? 1 : opt.maxP;
    for (var i = 0; i < slots.length; i++) {
      var p = slots[i];
      if (on) p = (p + ANIM_F * 0.04) % 1; /* crawl north with the slats */
      if (p < minP || p > maxP) continue;
      var py = y1 - 2 - p * (y1 - y0 - 4);
      var peeled = !!(opt.peeled);
      potato(wx(cx + (i % 2 ? 0.6 : -0.4)), wy(py), Math.max(2.4, ws(2.6)), peeled, i % 2 === 1, peeled ? 0 : 0);
    }
    /* tiny status lamp on the east rail */
    led(cx + beltW / 2 + 0.6, y0 + 2.2, on ? "#40ff70" : "#3a2010", on, 0.65);
  }

  /* Horizontal belt. Slats and potatoes travel toward x1 (east, into shipping). */
  function drawConveyorRunH(cy, x0, x1, state, opt) {
    opt = opt || {};
    var on = state === "on";
    var beltW = 9, rail = 0.9;
    if (x1 < x0) { var t = x0; x0 = x1; x1 = t; }
    var y0 = cy - beltW / 2;
    wr(x0 + 0.5, y0 - rail + 0.5, x1 - x0, beltW + rail * 2, "rgba(0,0,0,0.30)");
    wr(x0, y0 - rail, x1 - x0, beltW + rail * 2, "#2a2c28");
    wr(x0, y0, x1 - x0, beltW, on ? "#4a4a44" : "#3a3a36");
    wr(x0, y0 - rail, x1 - x0, rail, "#6a7068");
    wr(x0, y0 + beltW, x1 - x0, rail, "#3a4038");
    wr(x0, y0 - rail, 0.6, beltW + rail * 2, "#8a9088");
    wr(x1 - 0.6, y0 - rail, 0.6, beltW + rail * 2, "#2a2c28");
    if (opt.cap0 !== false) {
      wr(x0 - 0.4, y0 - 1.2, 1.6, beltW + 2.4, "#3a4038");
      wr(x0 - 0.1, y0 - 0.7, 1.0, beltW + 1.4, on ? "#9aa49a" : "#6a7068");
    }
    if (opt.cap1 !== false) {
      wr(x1 - 1.2, y0 - 1.2, 1.6, beltW + 2.4, "#3a4038");
      wr(x1 - 0.9, y0 - 0.7, 1.0, beltW + 1.4, on ? "#9aa49a" : "#6a7068");
    }
    var period = 3.2, off = on ? (ANIM_F / 4) * period : 0;
    var slatC = on ? "#6a6a58" : "#4a4a44", slatH = on ? "#8a8a70" : "#5a5a52";
    for (var x = x0 - period + off; x < x1; x += period) {
      var a = Math.max(x0 + 0.4, x), b = Math.min(x1 - 0.4, x + 1.3);
      if (b <= a) continue;
      wr(a, y0 + 0.3, b - a, beltW - 0.6, slatC);
      wr(a, y0 + 0.3, 0.35, beltW - 0.6, slatH);
    }
    if (opt.potatoes !== false) {
      var slots = opt.slots || (on ? [0.18, 0.42, 0.68, 0.88] : [0.55]);
      var peeled = opt.peeled !== false; /* outbound default: peeled */
      var minP = opt.minP || 0;
      var maxP = opt.maxP == null ? 1 : opt.maxP;
      for (var i = 0; i < slots.length; i++) {
        var p = slots[i];
        if (on) p = (p + ANIM_F * 0.04) % 1;
        if (p < minP || p > maxP) continue;
        var px = x0 + 2 + p * (x1 - x0 - 4);
        potato(wx(px), wy(cy + (i % 2 ? 0.5 : -0.4)), Math.max(2.4, ws(2.6)), peeled, i % 2 === 1, 0);
      }
    }
    led(x1 - 2.2, cy - beltW / 2 - 0.6, on ? "#40ff70" : "#3a2010", on, 0.65);
  }

  function drawSuction(cx, cy, state, opt) {
    opt = opt || {};
    var on = state === "on";
    var w = 16, h = 14;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    /* housing — squat intake hood, mouth opens south toward the pile */
    wr(x0 + 0.6, y0 + 0.6, w, h, "rgba(0,0,0,0.32)");
    wr(x0, y0, w, h - 3.2, "#3a4038");
    wr(x0 + 0.6, y0 + 0.6, w - 1.2, h - 4.4, "#5a6258");
    wr(x0 + 0.6, y0 + 0.6, w - 1.2, 1.2, "#9aa49a");
    wr(x0, y0, 0.8, h - 3.2, "#8a9088");
    wr(x0 + w - 0.8, y0, 0.8, h - 3.2, "#2a2c28");
    /* flared south mouth */
    wr(x0 - 1.2, y0 + h - 4.2, w + 2.4, 4.4, "#3a4038");
    wr(x0 - 0.6, y0 + h - 3.8, w + 1.2, 3.6, "#4a5248");
    wr(x0 + 1.6, y0 + h - 3.2, w - 3.2, 2.8, "#12141a");
    wr(x0 + 2.0, y0 + h - 2.8, w - 4.0, 2.0, "#1a1020");
    /* round intake throat */
    disc(wx(cx), wy(y0 + h - 1.6), ws(4.4), ws(1.6), "#08060c", "#1a1410");
    oval(wx(cx), wy(y0 + h - 1.6), ws(3.2), ws(1.05), "#120818");
    /* corner bolts + a top handle */
    bolt(x0 + 0.8, y0 + 0.8, 1.1);
    bolt(x0 + w - 1.9, y0 + 0.8, 1.1);
    bolt(x0 + 0.8, y0 + h - 5.4, 1.1);
    bolt(x0 + w - 1.9, y0 + h - 5.4, 1.1);
    wr(x0 + w / 2 - 3, y0 - 1.2, 6, 1.6, "#3a4038");
    wr(x0 + w / 2 - 2.5, y0 - 0.9, 5, 1.0, "#8a9088");
    /* status cluster */
    led(x0 + 2.4, y0 + 3.0, "#ff3050", on, 0.7);
    led(x0 + 4.2, y0 + 3.0, "#40ff70", on && ANIM_F >= 2, 0.55);
    led(x0 + 5.8, y0 + 3.0, "#ffd040", on && (ANIM_F === 1 || ANIM_F === 3), 0.55);
    /* Swarm suction rings, ported from the shipping suck (red expanding arcs into the mouth) */
    if (on) {
      var mx = wx(cx), my = wy(y0 + h - 2.2);
      var tt = ANIM_T || (ANIM_F * 0.125);
      ctx.save();
      for (var q = 0; q < 3; q++) {
        var rad = ws(2.4) + ((tt * 16 + q * 5.4 + ANIM_F * 2) % ws(9));
        ctx.globalAlpha = (0.34 + 0.20 * Math.sin((tt * 20) + q)) * (1 - rad / ws(14));
        ctx.strokeStyle = "#ff3050";
        ctx.lineWidth = Math.max(1.2, ws(0.35));
        ctx.beginPath();
        ctx.arc(mx, my, Math.max(1, rad), 0.12, 3.02);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,160,170,0.55)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mx, my, Math.max(1, rad - 1.2), 0.18, 2.96);
        ctx.stroke();
      }
      /* inward dust motes */
      ctx.globalAlpha = 0.7;
      for (var m = 0; m < 6; m++) {
        var a = (m / 6) * 3.0 + 0.2 + ANIM_F * 0.2;
        var rr = ws(6.5) - ANIM_F * ws(1.1) - (m % 3) * ws(0.8);
        R(mx + Math.cos(a) * rr, my + Math.sin(a) * rr * 0.55, 1, 1, "#ff8090");
      }
      ctx.restore();
      /* a potato mid-suck, shrinking toward the mouth */
      var suckP = [0.85, 0.6, 0.38, 0.18][ANIM_F];
      var psz = Math.max(1.6, ws(2.8) * suckP);
      potato(mx, my + ws(3.5) * suckP, psz, false, ANIM_F % 2 === 0, 0);
    }
  }

  /* World-unit peel landings / mid-air flakes for the auto-peeler.
     The arc ejects SOUTH-EAST of the box onto the floor, never west into a wall.
     All default positions sit in a 0.4-room inner floor (x 8..100, y 8..272). */
  var DEFAULT_ROOM = { x0: 8, y0: 8, x1: 100, y1: 272 };
  function clampRoom(x, y, b) {
    b = b || DEFAULT_ROOM;
    return {
      x: Math.max(b.x0, Math.min(b.x1, x)),
      y: Math.max(b.y0, Math.min(b.y1, y))
    };
  }
  function peelerPeelWorld(cx, cy, frame, bounds) {
    var boxW = 18, boxH = 16, x0 = cx - boxW / 2, y0 = cy - boxH / 2, y1 = y0 + boxH;
    var shots = [
      { p: 0.12, ox: 0.2, oy: 0.0 },
      { p: 0.36, ox: 1.6, oy: 0.8 },
      { p: 0.60, ox: 0.8, oy: 1.6 },
      { p: 0.84, ox: 2.2, oy: 0.4 }
    ];
    var out = [];
    for (var i = 0; i < shots.length; i++) {
      var ph = (shots[i].p + (frame & 3) * 0.18) % 1;
      /* SE floor: start at the SE slot, arc south-east, settle on the floor */
      var px = x0 + boxW + 1.2 + ph * 7.0 + shots[i].ox;
      var py = y1 + 1.4 + ph * 6.0 + Math.sin(ph * 2.4) * 1.2 + shots[i].oy;
      var c = clampRoom(px, py, bounds);
      out.push({ x: c.x, y: c.y, ang: ph * 4.2 + i, flying: ph < 0.82, rawX: px, rawY: py, clamped: c.x !== px || c.y !== py });
    }
    /* settled peel pile on the floor (always inside) */
    var settled = [[3.0, 3.2], [5.2, 4.6], [4.0, 6.0], [6.4, 5.2], [7.2, 7.0], [2.4, 5.8]];
    for (var s = 0; s < settled.length; s++) {
      var q = clampRoom(x0 + boxW + settled[s][0], y1 + settled[s][1], bounds);
      out.push({ x: q.x, y: q.y, ang: s * 0.9, flying: false, settled: true, rawX: q.x, rawY: q.y, clamped: false });
    }
    return out;
  }

  function drawAutoPeeler(cx, cy, state, opt) {
    opt = opt || {};
    var on = state === "on" || state === "peeling";
    var boxW = 18, boxH = 16;
    var x0 = cx - boxW / 2, y0 = cy - boxH / 2, y1 = y0 + boxH;
    /* boxy housing — same language as the shipping x-ray unit */
    wr(x0 + 0.6, y0 + 0.6, boxW, boxH, "rgba(0,0,0,0.32)");
    wr(x0, y0, boxW, boxH, "#3a4038");
    wr(x0 + 0.6, y0 + 0.6, boxW - 1.2, boxH - 1.2, "#5a6258");
    wr(x0 + 0.6, y0 + 0.6, boxW - 1.2, 1.2, "#9aa49a");
    wr(x0 + 0.6, y1 - 1.6, boxW - 1.2, 1, "#2a2c28");
    wr(x0, y0, 0.8, boxH, "#8a9088");
    wr(x0 + boxW - 0.8, y0, 0.8, boxH, "#2a2c28");
    /* viewing window */
    wr(x0 + 3.4, y0 + 3.6, boxW - 6.8, boxH - 8.0, "#12141a");
    wr(x0 + 3.8, y0 + 4.0, boxW - 7.6, boxH - 8.8, on ? "#1a2030" : "#10141c");
    wr(x0 + 3.8, y0 + 4.0, boxW - 7.6, 0.6, on ? "#3a5068" : "#1a2430");
    if (on) {
      var g = [0.08, 0.13, 0.18, 0.11][ANIM_F];
      ctx.globalAlpha = g;
      wr(x0 + 3.8, y0 + 4.0, boxW - 7.6, boxH - 8.8, "#40a0ff");
      ctx.globalAlpha = 1;
      /* potato in the chamber, mid-peel */
      var mid = ANIM_F >= 2;
      potato(wx(cx), wy(cy - 0.4), Math.max(2.6, ws(2.8)), mid, ANIM_F % 2 === 0, mid ? 2 : 0);
    }
    /* corner bolts */
    bolt(x0 + 0.8, y0 + 0.8, 1.1);
    bolt(x0 + boxW - 1.9, y0 + 0.8, 1.1);
    bolt(x0 + 0.8, y0 + boxH - 1.9, 1.1);
    bolt(x0 + boxW - 1.9, y0 + boxH - 1.9, 1.1);
    /* tiny blinking lights along the north edge — the "peeling" tell */
    var cols = ["#ff3050", "#ffd040", "#40ff70", "#40c0ff"];
    for (var i = 0; i < 4; i++) {
      var lit = on && ((ANIM_F + i) % 4 !== 3); /* chase, one dark per frame */
      if (on && i === ANIM_F) lit = true;
      led(x0 + 4.2 + i * 2.6, y0 + 2.0, cols[i], lit, 0.62);
    }
    /* south mouth (in from conveyor) + lead curtains */
    var mx0 = cx - 4.2, mw = 8.4;
    for (var s = 0; s < 6; s++) wr(mx0 + s * 1.4, y1 - 1.2, 1.1, 2.2, s % 2 ? "#2a2c28" : "#3a4038");
    var bl = 1.6, hy = y1 + 0.4, hx0 = cx - 5;
    for (var x = 0, n = 0; x < 10; x += bl, n++) wr(hx0 + x, hy, bl, 1.1, n % 2 ? "#2a2a24" : "#e0b020");
    /* east exit lip — feeds the outbound conveyor toward shipping */
    wr(x0 + boxW, y0 + 5.5, 2.6, 5.2, "#3a4038");
    wr(x0 + boxW, y0 + 5.9, 2.2, 4.4, "#2a2c28");
    wr(x0 + boxW + 0.3, y0 + 6.3, 1.6, 3.6, on ? "#1a2030" : "#12141a");
    /* SE peel-eject slot (onto the floor inside the room, not into a wall) */
    wr(x0 + boxW - 4.0, y1, 3.6, 2.2, "#3a4038");
    wr(x0 + boxW - 3.6, y1 + 0.3, 2.8, 1.6, "#12141a");
    if (on) {
      var peels = peelerPeelWorld(cx, cy, ANIM_F, opt.bounds);
      for (var p = 0; p < peels.length; p++) {
        peelFlake(wx(peels[p].x), wy(peels[p].y), peels[p].ang, ws(peels[p].settled ? 1.7 : 2.0));
      }
    }
    /* nameplate */
    wr(x0 + 5.5, y1 - 3.4, 7, 1.6, "#2a2c28");
    wr(x0 + 5.8, y1 - 3.15, 6.4, 1.1, on ? "#3a5040" : "#2a3028");
  }

  /* ======================== LV1 STARTERS ======================== */

  function drawBetterPeeler(cx, cy, state, opt) {
    var on = state === "on" || state === "peeling";
    var x = cx, y = cy;
    /* Y-peeler, top-down: metal head with a slot, colored handle, 1px outline */
    softShadow(wx(x), wy(y + 0.8), ws(5), ws(2.2));
    /* handle */
    wr(x - 5.2, y - 1.15, 6.2, 2.3, OUT);
    wr(x - 5.0, y - 0.95, 5.8, 1.9, "#3a2a20");
    wr(x - 5.0, y - 0.95, 5.8, 0.55, "#6a4a30");
    wr(x - 4.7, y - 0.55, 4.6, 0.55, on ? "#8a6a48" : "#5a3a28");
    /* bolster */
    wr(x + 0.8, y - 1.25, 1.3, 2.5, "#2a2c28");
    wr(x + 0.95, y - 1.05, 1.0, 2.1, "#8a9088");
    /* Y head */
    wr(x + 1.8, y - 1.55, 3.6, 3.1, OUT);
    wr(x + 2.0, y - 1.35, 3.2, 2.7, "#8a9098");
    wr(x + 2.0, y - 1.35, 3.2, 0.6, "#e8eef4");
    wr(x + 2.3, y - 0.55, 2.6, 1.1, "#4a5058"); /* blade slot */
    wr(x + 2.3, y - 0.35, 2.6, 0.35, "#c8d0d8");
    if (on) {
      /* gleam + a curl of peel coming off the slot */
      wr(x + 2.4, y - 1.2, 0.7, 0.35, "#ffffff");
      peelFlake(wx(x + 3.2), wy(y - 2.8 - ANIM_F * 0.4), -0.8 - ANIM_F * 0.25, ws(1.8));
    }
  }

  function drawCarryBag(cx, cy, state, opt) {
    var full = state === "on" || state === "full" || state === "carrying";
    var carrying = state === "carrying";
    var w = 11, h = full ? 10 : 7.5;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    if (carrying) drawPapa("stand", cx, cy - 2.2, 0, { shW: 12.5, shH: 5.4, hr: 5.8 });
    softShadow(wx(cx), wy(cy + h * 0.35), ws(w * 0.55), ws(h * 0.35));
    /* burlap sack, cinched top, same family as the bagger concept */
    blob(wx(x0), wy(y0 + (full ? 1.6 : 0.8)), ws(w), ws(h - (full ? 1.6 : 0.8)), ws(2.2), full ? "#8a6a38" : "#6a5230", "#3a2a14");
    /* cloth highlight + stitch */
    wr(x0 + 1.4, y0 + (full ? 2.2 : 1.4), w - 2.8, 0.7, full ? "#c8a860" : "#8a7050");
    wr(x0 + 2, y0 + (full ? 4.2 : 3.0), w - 4, 0.4, "#5a4020");
    wr(x0 + 2, y0 + (full ? 6.2 : 4.6), w - 4, 0.4, "#5a4020");
    /* cinch + two ear loops */
    wr(x0 + 3.2, y0 + (full ? 1.0 : 0.4), w - 6.4, 1.2, "#5a3a18");
    wr(x0 + 3.5, y0 + (full ? 1.15 : 0.55), w - 7.0, 0.7, "#c8a860");
    disc(wx(x0 + 2.4), wy(y0 + 0.6), ws(1.1), ws(0.7), "#5a3a18", OUT);
    disc(wx(x0 + w - 2.4), wy(y0 + 0.6), ws(1.1), ws(0.7), "#5a3a18", OUT);
    if (full) {
      potato(wx(cx - 1.6), wy(y0 + 0.2), Math.max(2.0, ws(2.1)), false, false, 0);
      potato(wx(cx + 1.8), wy(y0 + 0.5), Math.max(1.8, ws(1.9)), false, true, 0);
      if (!carrying) potato(wx(cx + 0.2), wy(y0 - 0.4), Math.max(1.7, ws(1.8)), false, false, 0);
    }
  }

  function drawSink(cx, cy, state, opt) {
    var on = state === "on" || state === "washing";
    var washing = state === "washing";
    var w = 16, h = 14;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    softShadow(wx(cx), wy(cy + 2), ws(w * 0.5), ws(h * 0.4));
    /* stainless basin, top-down, rim + bowl (washer-tub cousin, more sink-like) */
    wr(x0 + 0.5, y0 + 0.5, w, h, "rgba(0,0,0,0.28)");
    wr(x0, y0, w, h, "#3a4038");
    wr(x0 + 0.5, y0 + 0.5, w - 1, h - 1, "#8a9098");
    wr(x0 + 0.5, y0 + 0.5, w - 1, 0.8, "#e8eef4");
    wr(x0 + 0.5, y0 + h - 1.2, w - 1, 0.7, "#5a6058");
    wr(x0 + 1.8, y0 + 2.4, w - 3.6, h - 4.6, "#4a5058");
    wr(x0 + 2.2, y0 + 2.8, w - 4.4, h - 5.4, on ? "#3a6a9a" : "#2a3038");
    if (on) {
      wr(x0 + 2.2, y0 + 2.8, w - 4.4, 0.6, "#8ab8e0");
      /* ripple rings, 4 frames */
      var rx = wx(cx), ry = wy(cy + 0.6);
      ctx.strokeStyle = "rgba(200,230,255,0.45)";
      ctx.lineWidth = 1;
      for (var q = 0; q < 2; q++) {
        ctx.beginPath();
        ctx.ellipse(rx, ry, ws(2.2 + q * 1.6 + ANIM_F * 0.45), ws(1.3 + q * 0.9 + ANIM_F * 0.25), 0, 0, 6.28);
        ctx.stroke();
      }
      potato(wx(cx - 2.4), wy(cy + 0.8), Math.max(2.1, ws(2.3)), false, false, 0);
      potato(wx(cx + 2.2), wy(cy + 1.3), Math.max(1.9, ws(2.1)), false, true, 0);
      potato(wx(cx + 0.2), wy(cy - 0.4), Math.max(1.7, ws(1.9)), false, false, 0);
    } else {
      /* dry drain */
      disc(wx(cx), wy(cy + 0.8), ws(1.3), ws(1.3), "#1a1c18", "#3a4038");
      disc(wx(cx), wy(cy + 0.8), ws(0.6), ws(0.6), "#12141a", null);
    }
    /* faucet at the north rim */
    wr(cx - 0.7, y0 - 0.2, 1.4, 2.6, "#3a4038");
    wr(cx - 0.5, y0, 1.0, 2.2, "#c0c8c0");
    wr(cx - 0.5, y0, 1.0, 0.4, "#e8eef4");
    wr(cx - 0.7, y0 + 2.2, 2.4, 1.1, "#8a9098");
    wr(cx - 0.5, y0 + 2.35, 2.0, 0.7, "#c0c8c0");
    if (on) {
      /* dripping / flowing stream, 4 frames */
      var fl = [1.2, 2.0, 2.8, 1.6][ANIM_F];
      wr(cx + 1.0, y0 + 3.3, 0.7, fl, "#8ab8e0");
      wr(cx + 1.15, y0 + 3.3, 0.35, fl, "#d0e8f8");
    }
    /* handles */
    wr(x0 + 2.4, y0 + 0.7, 2.0, 1.1, "#4a5048");
    wr(x0 + 2.55, y0 + 0.85, 1.7, 0.7, on ? "#c0c8c0" : "#6a7068");
    wr(x0 + w - 4.4, y0 + 0.7, 2.0, 1.1, "#4a5048");
    wr(x0 + w - 4.25, y0 + 0.85, 1.7, 0.7, "#8a9098");
    if (washing) drawPapa("stand", cx, cy + 9.5, 0);
  }

  function drawBroomDustpan(cx, cy, state, opt) {
    opt = opt || {};
    var on = state === "on" || state === "sweeping";
    var sweeping = state === "sweeping";
    /* Floor peel patch NORTH of Papa — broom bristles sit ON this mess. */
    var messY = sweeping ? -8.0 : 4.4;
    var mess = [
      [0.2, messY + 0.8], [2.0, messY], [3.6, messY + 1.0], [1.2, messY - 1.0], [3.0, messY - 1.4], [4.6, messY - 0.4],
      [-0.8, messY - 0.2], [1.6, messY - 2.2], [4.0, messY - 1.8], [2.6, messY + 1.4]
    ];
    if (on || sweeping) {
      for (var m = 0; m < mess.length; m++)
        peelFlake(wx(cx + mess[m][0]), wy(cy + mess[m][1]), m * 0.7, ws(1.7));
    }
    var swing = on ? [-2.4, 0.2, 2.6, 0.3][ANIM_F] : 0;
    /* dustpan on the floor WEST and slightly SOUTH of Papa — drawn BEFORE him so it never covers his hair */
    var dx = cx - 10.4, dy = cy + 6.8;
    wr(dx - 3.2 + 0.4, dy - 1.6 + 0.4, 6.6, 4.4, "rgba(0,0,0,0.25)");
    wr(dx - 3.2, dy - 1.6, 6.6, 4.4, OUT);
    wr(dx - 3.0, dy - 1.4, 6.2, 4.0, "#8a3028");
    wr(dx - 3.0, dy - 1.4, 6.2, 0.7, "#c05040");
    wr(dx - 2.4, dy - 0.4, 5.0, 2.4, "#5a2018");
    wr(dx - 2.4, dy - 0.4, 5.0, 0.4, "#a04030");
    if (on) {
      peelFlake(wx(dx - 0.4), wy(dy + 0.4), 0.4, ws(1.5));
      peelFlake(wx(dx + 1.2), wy(dy + 0.9), -0.6, ws(1.3));
    }
    /* Papa stands SOUTH of the mess so the broom can reach north into the peels. */
    if (sweeping) drawPapa("stand", cx, cy + 3.8, 0);
    /* broom: handle at Papa, tip NORTH on the peel patch, 4-frame side-to-side stroke */
    var bx = cx + (sweeping ? 1.6 : 2.4) + swing * 0.25;
    var by = cy + (sweeping ? 2.4 : -1.2);
    var tipX = cx + 1.2 + swing;
    var tipY = cy + (sweeping ? -8.2 : 5.4);
    var hx0 = wx(bx), hy0 = wy(by), hx1 = wx(tipX), hy1 = wy(tipY);
    ctx.lineCap = "round";
    ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(2.2, ws(1.15) + 1.3);
    ctx.beginPath(); ctx.moveTo(hx0, hy0); ctx.lineTo(hx1, hy1); ctx.stroke();
    ctx.strokeStyle = "#8a6840"; ctx.lineWidth = Math.max(1.4, ws(1.15));
    ctx.beginPath(); ctx.moveTo(hx0, hy0); ctx.lineTo(hx1, hy1); ctx.stroke();
    ctx.strokeStyle = "#c8a860"; ctx.lineWidth = Math.max(0.6, ws(0.4));
    ctx.beginPath(); ctx.moveTo(hx0, hy0); ctx.lineTo(hx1, hy1); ctx.stroke();
    disc(wx(tipX), wy(tipY), ws(2.8), ws(1.4), "#5a4020", OUT);
    oval(wx(tipX), wy(tipY - 0.4), ws(2.4), ws(0.95), "#c8a860");
    wr(tipX - 2.3, tipY - 0.1, 4.6, 0.35, "#6a4a20");
    if (on) {
      ctx.globalAlpha = 0.85;
      for (var d = 0; d < 5; d++)
        R(wx(tipX + swing * 0.2 + d * 0.7), wy(tipY + 0.8 + (d % 2) * 0.4), 2, 1, "#d8c898");
      ctx.globalAlpha = 1;
    }
  }

  function drawSmallCooler(cx, cy, state, opt) {
    var on = state === "on";
    var w = 11, h = 9;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    wr(x0 + 0.6, y0 + 0.6, w, h, "rgba(0,0,0,0.28)");
    wr(x0, y0, w, h, "#1c3a5a");
    wr(x0 + 0.6, y0 + 0.6, w - 1.2, h - 1.2, "#3a6a9a");
    wr(x0 + 0.6, y0 + 0.6, w - 1.2, 0.8, "#8ab8e0");
    wr(x0 + 0.6, y0 + h - 1.4, w - 1.2, 0.8, "#1a2c44");
    wr(x0 + 0.6, y0, 0.8, h, "#8ab8e0");
    wr(x0 + w - 1.4, y0, 0.8, h, "#1a2c44");
    /* lid seam, hinges, latch */
    wr(x0 + 0.7, y0 + h * 0.62, w - 1.4, 0.7, "#24405a");
    wr(x0 + 1.2, y0 + h * 0.62 - 0.5, 1.6, 1.5, "#c0c8c0");
    wr(x0 + w - 2.8, y0 + h * 0.62 - 0.5, 1.6, 1.5, "#c0c8c0");
    wr(x0 + w * 0.3, y0 + h * 0.32, w * 0.4, 1.2, "#e8eef4");
    wr(x0 + w * 0.3, y0 + h * 0.32, w * 0.4, 0.45, "#ffffff");
    /* gasket */
    wr(x0 + 1.2, y0 + 1.2, w - 2.4, 0.5, "#1a2840");
    /* a can on the lid */
    wr(x0 + 1.3, y0 + 1.4, 2.6, 2.8, "#7a3a10");
    wr(x0 + 1.3, y0 + 1.7, 2.6, 2.2, "#e0a040");
    wr(x0 + 1.3, y0 + 1.4, 2.6, 0.5, "#f0e0b0");
    wr(x0 + 1.6, y0 + 2.6, 2.0, 0.5, "#b04020");
    /* hum lamp */
    wr(x0 + w - 3.0, y0 + 1.1, 1.9, 1.9, "#0a1828");
    var col = on ? ["#1a4a3a", "#2a8a60", "#50f0a0", "#2a8a60"][ANIM_F] : "#1a2840";
    disc(wx(x0 + w - 2.05), wy(y0 + 2.05), ws(0.85), ws(0.85), col, "#0a2018");
    if (on && ANIM_F === 2) { ctx.globalAlpha = 0.35; oval(wx(x0 + w - 2.05), wy(y0 + 2.05), ws(1.6), ws(1.6), "#40e090"); ctx.globalAlpha = 1; }
  }

  function drawBasicCot(cx, cy, state, opt) {
    var sleeping = state === "on" || state === "sleeping";
    var w = 28, h = 15;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    /* metal pipe frame, thin khaki mattress, one pillow — starter bed, not the plush 0.3.1 one */
    wr(x0 + 0.8, y0 + 0.8, w, h, "rgba(0,0,0,0.30)");
    wr(x0, y0, w, h, "#3a4038");
    wr(x0, y0, w, 1.0, "#8a9088");
    wr(x0, y0, 1.0, h, "#6a7068");
    wr(x0, y0 + h - 1.0, w, 1.0, "#2a2c28");
    wr(x0 + w - 1.0, y0, 1.0, h, "#2a2c28");
    /* corner posts */
    for (var c = 0; c < 4; c++) {
      var px = c % 2 ? x0 + w - 1.6 : x0 - 0.4, py = c < 2 ? y0 - 0.4 : y0 + h - 1.6;
      wr(px, py, 2.0, 2.0, "#3a4038"); wr(px + 0.3, py + 0.3, 1.4, 1.4, "#c0c8c0");
    }
    /* thin mattress */
    wr(x0 + 1.2, y0 + 1.2, w - 2.4, h - 2.4, "#6a5a38");
    wr(x0 + 1.2, y0 + 1.2, w - 2.4, 0.7, "#9a8a60");
    wr(x0 + 1.6, y0 + 1.8, w - 3.2, h - 3.4, "#c8b888");
    wr(x0 + 1.6, y0 + 1.8, w - 3.2, 0.6, "#e8d8a8");
    /* west pillow */
    blob(wx(x0 + 2.0), wy(y0 + 2.6), ws(6.2), ws(h - 5.2), ws(1.6), "#e8e0cc", "#8a8070");
    wr(x0 + 2.6, y0 + 3.0, 4.8, 0.5, "#fffaf0");
    if (sleeping) {
      /* Papa's head on the pillow; thin olive blanket covers the body */
      var bw = w * 0.62, bx = x0 + w - bw - 1.2;
      var rise = [0, 0.35, 0.85, 0.30][ANIM_F];
      blob(wx(bx), wy(y0 + 2.0 - rise * 0.15), ws(bw), ws(h - 4.0 + rise * 0.5), ws(1.4), "#5a6340", "#2a3018");
      wr(bx, y0 + 2.0, 1.4, h - 4.0, "#c8d0a8");
      wr(bx + 1.6, y0 + 2.0, bw - 2.2, 0.7, "#7a8460");
      drawPapa("sleep", x0 + 6.6, cy + 0.15, 1, { hr: 3.6 });
    }
  }

  /* ======================== DECORATIONS ======================== */

  function drawRadio(cx, cy, state, opt) {
    var on = state === "on" || state === "tuning";
    var tuning = state === "tuning";
    var w = 8, h = 6.2;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    if (tuning) drawPapa("stand", cx - 7.5, cy + 1, 1, { hr: 5.6, shW: 12, shH: 5.2 });
    wr(x0 + 0.5, y0 + 0.5, w, h, "rgba(0,0,0,0.28)");
    wr(x0, y0, w, h, "#2a2c30");
    wr(x0 + 0.5, y0 + 0.5, w - 1, h - 1, "#4a5058");
    wr(x0 + 0.5, y0 + 0.5, w - 1, 0.7, "#8a9098");
    wr(x0, y0, 0.6, h, "#6a7078");
    wr(x0 + w - 0.6, y0, 0.6, h, "#1a1c20");
    /* speaker grill */
    wr(x0 + 0.9, y0 + 1.5, 3.2, 3.2, "#1a1c20");
    for (var gy = 0; gy < 4; gy++) for (var gx = 0; gx < 4; gx++)
      wr(x0 + 1.15 + gx * 0.7, y0 + 1.75 + gy * 0.7, 0.45, 0.45, on && ((gx + gy + ANIM_F) % 3 === 0) ? "#c8b890" : "#3a3c40");
    /* amber dial + a knob */
    disc(wx(x0 + 5.8), wy(y0 + 2.3), ws(1.15), ws(1.15), on ? "#e0a040" : "#3a2a10", OUT);
    if (on) oval(wx(x0 + 5.8) - 0.4, wy(y0 + 2.3) - 0.4, ws(0.45), ws(0.45), "#ffe8a0");
    wr(x0 + 5.1, y0 + 3.9, 1.5, 1.5, "#2a2c28");
    wr(x0 + 5.3, y0 + 4.1, 1.1, 1.1, "#8a9088");
    /* antenna */
    wr(x0 + w - 1.0, y0 - 3.0, 0.55, 3.2, "#c0c8c0");
    wr(x0 + w - 1.15, y0 - 3.3, 0.85, 0.7, "#8a9088");
    if (on) {
      /* music notes, 4-frame float */
      var notes = [
        [1.6, -2.2], [3.4, -3.4], [5.2, -2.6]
      ];
      ctx.fillStyle = "#f0e8c0";
      for (var n = 0; n < notes.length; n++) {
        var ny = notes[n][1] - ANIM_F * 0.45 - (n % 2) * 0.3;
        var nx = notes[n][0] + Math.sin((ANIM_F + n) * 0.8) * 0.35;
        wr(x0 + nx, y0 + ny, 0.7, 0.7, "#f0e8c0");
        wr(x0 + nx + 0.7, y0 + ny - 1.1, 0.35, 1.5, "#f0e8c0");
      }
    }
  }

  function drawPlant(cx, cy, state, opt) {
    var healthy = state === "on" || state === "watering";
    var watering = state === "watering";
    /* terracotta pot */
    softShadow(wx(cx), wy(cy + 3.4), ws(4.2), ws(2.0));
    disc(wx(cx), wy(cy + 2.6), ws(3.4), ws(2.2), "#6a3a22", OUT);
    oval(wx(cx), wy(cy + 2.6), ws(2.6), ws(1.6), "#4a2414");
    wr(cx - 3.6, cy + 0.6, 7.2, 1.4, "#8a5a32");
    wr(cx - 3.6, cy + 0.6, 7.2, 0.45, "#c48a58");
    wr(cx - 3.4, cy + 0.85, 6.8, 0.4, "#3a200c");
    /* leaves — droopy brown when off, perky green + sway when on */
    var sway = healthy ? [-0.3, 0.4, 0.9, 0.2][ANIM_F] : 0;
    var leafC = healthy ? "#3a7a38" : "#6a5a30";
    var leafH = healthy ? "#6ab050" : "#8a7a48";
    var leafD = healthy ? "#2a5020" : "#4a3a18";
    function leaf(dx, dy, rw, rh, a) {
      ctx.save();
      ctx.translate(wx(cx + dx + sway * 0.15), wy(cy + dy));
      ctx.rotate(a);
      disc(0, 0, ws(rw), ws(rh), leafC, leafD);
      oval(-ws(rw) * 0.15, -ws(rh) * 0.2, ws(rw) * 0.55, ws(rh) * 0.45, leafH);
      ctx.restore();
    }
    if (healthy) {
      leaf(-1.6, -1.6, 2.2, 1.3, -0.7 + sway * 0.08);
      leaf(1.8, -1.4, 2.0, 1.2, 0.6 + sway * 0.08);
      leaf(0.1, -2.8, 2.4, 1.4, 0.05 + sway * 0.06);
      leaf(-0.2, -0.6, 1.6, 1.0, -0.2);
      leaf(1.0, -0.3, 1.4, 0.9, 0.5);
    } else {
      leaf(-1.8, 0.0, 2.0, 0.9, 0.8);
      leaf(1.6, 0.1, 1.8, 0.85, -0.85);
      leaf(0.2, -0.8, 1.6, 0.8, 0.15);
    }
    if (watering) {
      drawPapa("stand", cx + 7.5, cy + 1.5, 3, { hr: 5.6, shW: 12, shH: 5.2 });
      /* watering can + droplets */
      wr(cx + 3.4, cy - 0.6, 3.2, 2.0, "#3a6a8a");
      wr(cx + 3.4, cy - 0.6, 3.2, 0.5, "#8ab8e0");
      wr(cx + 2.0, cy - 0.2, 1.6, 0.7, "#3a6a8a");
      wr(cx + 1.2, cy - 0.1, 1.2, 0.5, "#c0c8c0");
      for (var d = 0; d < 3; d++) wr(cx + 1.0 - d * 0.3, cy + 0.6 + d * 0.8 + ANIM_F * 0.25, 0.5, 0.8, "#8ab8e0");
    }
  }

  function drawRug(cx, cy, state, opt) {
    var laid = state === "on" || state === "standing";
    var standing = state === "standing";
    var w = 24, h = 16;
    var x0 = cx - w / 2, y0 = cy - h / 2;
    if (!laid) {
      /* rolled up against a wall */
      wr(cx - 8.5 + 0.5, cy - 2.2 + 0.5, 17, 4.4, "rgba(0,0,0,0.28)");
      blob(wx(cx - 8.5), wy(cy - 2.2), ws(17), ws(4.4), ws(1.8), "#8a3a30", "#3a1810");
      wr(cx - 8.2, cy - 2.0, 16.4, 0.7, "#c06050");
      wr(cx - 7.6, cy - 0.4, 15.2, 0.5, "#5a2018");
      /* end rings of the roll */
      disc(wx(cx - 8.5), wy(cy), ws(1.5), ws(2.2), "#6a2820", OUT);
      oval(wx(cx - 8.5), wy(cy), ws(0.8), ws(1.3), "#3a1410");
      disc(wx(cx + 8.5), wy(cy), ws(1.5), ws(2.2), "#6a2820", OUT);
      return;
    }
    /* laid oval rug, rust field, dark border, simple diamond */
    softShadow(wx(cx), wy(cy + 1), ws(w * 0.48), ws(h * 0.42));
    disc(wx(cx), wy(cy), ws(w / 2), ws(h / 2), "#4a2018", OUT);
    oval(wx(cx), wy(cy), ws(w / 2 - 0.9), ws(h / 2 - 0.9), "#8a3a30");
    oval(wx(cx), wy(cy), ws(w / 2 - 1.6), ws(h / 2 - 1.5), "#a05040");

/* ---------- command panel: scroll-safe (Jay t1015) ----------
   Built from PPSim.COMMANDS, the same table the HELP screen reads, so the two can never drift apart.
   A slider is LOCKED until you tap its box (the box lights up). Vertical drags always scroll the panel and never move a slider.
   + and - always work (they act on a clean tap). SHOP / HELP also need a clean tap, so scrolling can't open them. A slide applies its value where the finger lifts. */
var cmd=$("cmd"),focusId=null;
function fmt(id,v){
  var c=null,i;for(i=0;i<CMDS.length;i++)if(CMDS[i].id===id)c=CMDS[i];
  if(c&&c.fmt==="onoff")return v>0?"ON":"OFF";
  if(c&&c.fmt==="speed")return (PPSim.SPEED_NAME||["OFF","SLOW","STEADY","FAST"])[v]||String(v);
  if(c&&c.fmt==="dry")return v>0?"> "+v:"OFF";
  if(id==="pace")return PACE[v]+" x"+SPD[v];
  if(id==="pot")return String(POTS[v]);
  if(id==="clean")return v>0?"> "+v:"OFF";
  if(id==="style")return STYLE[v].n+" x"+STYLE[v].sp;
  if(id==="wake")return v+"%";
  if(id==="autob")return v>0?">= "+v:"OFF";
  return v>0?"< "+v+"%":"OFF";}
function bmax(id){return id==="pot"?Math.max(1,sim.potMax()):BOX[id].max;}
function pct(id,v){var b=BOX[id];return (v-b.min)/(bmax(id)-b.min);}
var UNSET={eat:1,nap:1,clean:1,autob:1,suction:1,conveyor:1,apeeler:1,outbelt:1,lamp:1,radio:1,tv:1,watch:1,water:1,wash:1};

    h+='<div class="box" data-id="'+c.id+'"><button class="pm" data-d="1" aria-label="'+c.name+' up">+</button><div class="mid"><div class="top"><span class="nm">'+c.name.replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</span><span class="lk"></span><span class="val"></span></div><div class="trk"><div class="ln"></div><div class="fill"></div><div class="kn"></div></div></div><button class="pm" data-d="-1" aria-label="'+c.name+' down">&minus;</button></div>';}

cmd.addEventListener("pointerdown",function(e){if(G&&G.id!==e.pointerId)return;
  var t=e.target,box=t.closest?t.closest(".box"):null,pm=t.closest?t.closest(".pm"):null,trk=t.closest?t.closest(".trk"):null,btn=t.closest?t.closest("#bar button"):null;
  G={id:e.pointerId,x0:e.clientX,y0:e.clientY,st0:cmd.scrollTop,box:box,bid:box?box.getAttribute("data-id"):null,pm:pm,trk:trk,btn:btn,mode:null};

  if(G.mode===null&&(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP)){
    if(Math.abs(dy)>=Math.abs(dx)*0.75)G.mode="scroll";
    else if(G.bid&&G.bid===focusId&&(G.trk||(!G.pm)))G.mode="slide";
    else G.mode="none";
    if(G.pm)G.pm.classList.remove("press");if(G.btn)G.btn.classList.remove("press");}
  if(G.mode==="scroll")cmd.scrollTop=G.st0-dy;
  else if(G.mode==="slide"){var trk=G.box.querySelector(".trk");if(sim.setBox(G.bid,valFromX(G.bid,trk,e.clientX)))changed();}});
function endG(e,cancel){if(!G||G.id!==e.pointerId)return;var g=G;G=null;if(g.pm)g.pm.classList.remove("press");if(g.btn)g.btn.classList.remove("press");
  /* a slide ends where the finger lifts: a slow WebView may not deliver a final move */
  if(!cancel&&g.mode==="slide"){var tk=g.box.querySelector(".trk");if(sim.setBox(g.bid,valFromX(g.bid,tk,e.clientX)))changed();return;}
  if(cancel||g.mode!==null)return;
  /* slow old WebViews can deliver a swipe as down -> up with few or no moves: judge by where the finger lifted */
  var dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP){if(Math.abs(dy)>=Math.abs(dx)*0.75)cmd.scrollTop=g.st0-dy;return;}
  /* a clean tap */
  if(g.pm&&g.bid){var d=+g.pm.getAttribute("data-d");setFocus(g.bid);if(sim.setBox(g.bid,sim.s.box[g.bid]+d*BOX[g.bid].step))changed();return;}
  if(g.btn){doAct(g.btn.getAttribute("data-act"));return;}
  if(g.bid){if(focusId===g.bid&&g.trk){if(sim.setBox(g.bid,valFromX(g.bid,g.trk,e.clientX)))changed();}else setFocus(g.bid);return;}

  else if(id==="autob"){r(2,6,9,8,"#7a3a10");r(2,7,9,6,"#e0a040");r(2,6,9,1,"#f0e0b0");r(9,1,5,5,"#c4a020");r(10,2,3,3,"#ffe066");r(11,3,1,1,"#c4a020");}
  else{r(1,7,3,3,"#8a6a40");r(3,6,10,5,"#3a4038");r(4,7,8,3,"#12141a");r(5,3,6,1,"#c0361e");r(7,2,2,1,"#c0361e");r(5,12,6,1,"#3ad070");}}
function miniSlider(c,v){var mx=c.id==="pot"?Math.max(1,sim.potMax()):c.max,p=(v-c.min)/(mx-c.min),n=Math.max(1,Math.round((mx-c.min)/c.step)),tn=Math.min(n,14),tk="";
  for(var i=0;i<=tn;i++)tk+='<i class="tk" style="left:'+(i/tn*100)+'%"></i>';
  return '<div class="mini"><span class="e">'+esc(c.hi)+'</span><div class="mt"><div class="ln"></div><div class="mf" style="width:'+(p*100)+'%"></div>'+tk+'<div class="mk" style="left:'+((1-p)*100)+'%"></div></div><span class="e r">'+esc(c.lo)+'</span></div>';}
function pageHtml(pg){var s=sim.s,N=bookPages(),pn='<span class="pn">'+(pg+1)+' / '+N+'</span>';
  if(pg===0)return '<div id="pg" class="cover"><canvas class="ic" data-ic="cover" width="16" height="16"></canvas><div class="t1">PAPA POTATO</div><div class="t2">HANDBOOK</div><button class="go2" type="button" data-act="book:next">OPEN THE BOOK</button><div class="note" style="margin-top:12px;color:#d8b878">'+CMDS.length+' commands, plus levels, the line, the editor and decor</div></div>';
  if(pg===N-1)return '<div id="pg">'+pn+'<div class="hd"><canvas class="ic" data-ic="loop" width="16" height="16"></canvas><b>THE LOOP</b></div><div class="lb">WHAT HE DOES</div><div class="chips"><span>PILE</span><span>&gt; PEEL TABLE</span><span>&gt; SHIP IN</span><span>&gt; RETURN</span><span>&gt; PILE</span></div><div class="tx">Or buy the work line: pile &gt; suction &gt; conveyor &gt; auto-peeler &gt; out-conveyor &gt; shipping. Peels land on the floor inside the room. CLEAN sends him to sweep them.</div><div class="lb">YOUR COINS GO TO</div><div class="chips"><span>LEVELS</span><span>ITEMS</span><span>FOOD</span><span>POTATOES</span><span>UPGRADES</span></div><div class="tx">Open the SHOP. Tap the room to see object names. +/− zoom and scroll arrows sit in the side rails (never over the room). EDIT moves furniture (not the pile, return or shipping).</div></div>';
  if(pg===N-5)return '<div id="pg">'+pn+'<div class="hd"><canvas class="ic" data-ic="cover" width="16" height="16"></canvas><b>LEVELS</b></div><div class="lb">PAY TO LEVEL UP</div><div class="tx">You start at Level 1. Pay coins in the SHOP to reach the next level (up to 5). Each level UNLOCKS items; you still BUY them in the shop. Lv1 is the six starters (better peeler, carry bag, sink, broom, small cooler, cot).</div><div class="lb">UPGRADES</div><div class="tx">Old upgrades (sharp peeler, boots, chute, cooler, broom, soft bed) stay. New ones speed the auto-peeler and belts and grow the carry bag. Unused items stay in the game, just hidden until unlocked.</div></div>';
  if(pg===N-4)return '<div id="pg">'+pn+'<div class="hd"><canvas class="ic" data-ic="loop" width="16" height="16"></canvas><b>THE WORK LINE</b></div><div class="lb">MACHINES</div><div class="tx">CONVEYOR, AUTO SUCTION, AUTO-PEELER and OUT-CONVEYOR. Each has an on/off or speed slider once bought. The out-conveyor butts the shipping intake and is drawn under it. Peeled potatoes ride in and get sucked through. Peels always land inside the room.</div><div class="lb">COMMANDS</div><div class="tx">SUCTION, CONVEYOR SPEED, AUTO-PEELER SPEED, OUT-CONVEYOR SPEED. Faster belts and peelers come from the BETTER BELTS / FASTER AUTO-PEELER upgrades.</div></div>';
  if(pg===N-3)return '<div id="pg">'+pn+'<div class="hd"><canvas class="ic" data-ic="wake" width="16" height="16"></canvas><b>EDITOR AND ZOOM</b></div><div class="lb">EDITOR</div><div class="tx">Tap EDITOR, then drag any item except the potato pile, the return chute and the shipping chute. Those three stay put. Your layout is saved with the game.</div><div class="lb">ZOOM AND SCROLL</div><div class="tx">The zoom +/− and scroll arrows live in the side rails, outside the room — the room shrinks to fit between them, and nothing draws over the play area. +/− zoom like FunMotion (75% to 300%). Arrow buttons scroll the room. The centre dot resets to a fitted view.</div></div>';
  if(pg===N-2)return '<div id="pg">'+pn+'<div class="hd"><canvas class="ic" data-ic="nap" width="16" height="16"></canvas><b>DECORATIONS</b></div><div class="lb">WHAT HE DOES</div><div class="tx">LAMP on/off. RADIO on/off — he walks over to tune it. PLANT dries out; WATER WHEN DRY sends him to water it. TV + ARMCHAIR: turn the TV on and set WATCH WHEN ENERGY &lt; so he sits and watches (slow energy, not a nap). Sleep is still the 0.3.1 bed, unchanged.</div></div>';
  if(pg-1>=CMDS.length)return '<div id="pg">'+pn+'<div class="tx">Missing page.</div></div>';
  var c=CMDS[pg-1],v=s.box[c.id];
  return '<div id="pg" data-cmd="'+c.id+'">'+pn+'<div class="hd"><canvas class="ic" data-ic="'+c.id+'" width="16" height="16"></canvas><b>'+esc(c.name)+'</b></div><div class="lb">DOES</div><div class="tx">'+esc(c.does)+'</div><div class="lb">SLIDER</div>'+miniSlider(c,v)+'<div class="now">NOW: '+esc(fmt(c.id,v))+'</div><div class="lb">AFFECTS</div><div class="tx">'+esc(c.affects)+'</div><div class="lb">RANGE</div><div class="rg">'+esc(c.range)+'</div></div>';}
function buildBook(dir){var N=bookPages(),h='<div id="book">'+pageHtml(bookPage)+'<div id="bkNav"><button type="button" data-act="book:prev"'+(bookPage<=0?' class="dis"':'')+'>&lt; PREV</button><div class="dots">';
  for(var i=0;i<N;i++)h+='<i'+(i===bookPage?' class="on"':'')+'></i>';h+='</div><button type="button" data-act="book:next"'+(bookPage>=N-1?' class="dis"':'')+'>NEXT &gt;</button></div></div>';
  ovlBody.innerHTML=h;var cs=ovlBody.querySelectorAll("canvas.ic");for(var j=0;j<cs.length;j++)icoDraw(cs[j],cs[j].getAttribute("data-ic"));
  if(dir){var pg=$("pg");pg.className=(pg.className?pg.className+" ":"")+(dir>0?"flipn":"flipp");}}
function flipBook(d){d=+d;d=d>0?1:(d<0?-1:0);var n=Math.max(0,Math.min(bookPages()-1,bookPage+d));if(n===bookPage)return false;bookPage=n;buildBook(d);return true;}
function buildOvl(){var st=ovlBody.scrollTop;ovlBody.className=ovlMode==="help"?"book":"";if(ovlMode==="shop")buildShop();else if(ovlMode==="help")buildBook(0);ovlBody.scrollTop=ovlMode==="shop"?st:0;$("ovlCoins").textContent=ovlMode==="shop"?sim.s.coins+"c":"";}
function openOvl(mode){ovlMode=mode;ovl.className="on";$("ovlTitle").textContent=mode==="shop"?"SHOP":"HELP BOOKLET";ovlBody.scrollTop=0;if(mode==="help")bookPage=0;buildOvl();if(focusId)setFocus(null);}
function closeOvl(){ovlMode=null;ovl.className="";OG=null;}
function flash(btn,txt){if(!btn)return;var old=btn.innerHTML;btn.innerHTML=txt;setTimeout(function(){if(ovlMode)ovlDirty=true;},700);}
function shopBuy(what){var r,btn=ovl.querySelector('[data-act="buy:'+what+'"]'),pr;
  if(what==="food"){pr=sim.price();r=sim.buyFood();}
  else if(what==="pot"){pr=sim.potPrice();r=sim.buyPotatoes();}
  else if(what==="lv"){pr=sim.levelPrice();r=sim.buyLevel();}
  else if(what.indexOf("item:")===0){var iid=what.slice(5);pr=sim.itemPrice(iid);r=sim.buyItem(iid);if(r==="ok")rebuildPanel();}
  else if(what.indexOf("up:")===0){var id=what.slice(3);pr=sim.upPrice(id);r=sim.buyUp(id);}
  else return "bad";
  if(r==="ok"){if(btn)btn.innerHTML="BOUGHT!";setTimeout(function(){ovlDirty=true;},600);changed();}
  else if(r==="poor"){if(btn)btn.innerHTML="NEED<br>"+pr+"c";setTimeout(function(){ovlDirty=true;},800);}
  else{if(btn)btn.innerHTML=r==="full"?"FULL":"MAXED";setTimeout(function(){ovlDirty=true;},800);}
  updateHud();saveGame();return r;}
ovl.addEventListener("pointerdown",function(e){if(OG&&OG.id!==e.pointerId)return;var t=e.target,btn=t.closest?t.closest("[data-act]"):null;
  OG={id:e.pointerId,x0:e.clientX,y0:e.clientY,st0:ovlBody.scrollTop,btn:btn,mode:null};if(btn)btn.classList.add("press");
  try{ovl.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
ovl.addEventListener("pointermove",function(e){if(!OG||OG.id!==e.pointerId)return;var dx=e.clientX-OG.x0,dy=e.clientY-OG.y0;
  if(OG.mode===null&&(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP)){OG.mode=Math.abs(dy)>=Math.abs(dx)*0.75?"scroll":"none";if(OG.btn)OG.btn.classList.remove("press");}
  if(OG.mode==="scroll")ovlBody.scrollTop=OG.st0-dy;});
function endO(e,cancel){if(!OG||OG.id!==e.pointerId)return;var g=OG;OG=null;if(g.btn)g.btn.classList.remove("press");if(cancel)return;
  var dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(ovlMode==="help"&&Math.abs(dx)>=40&&Math.abs(dx)>=Math.abs(dy)*1.2){flipBook(dx<0?1:-1);return;}   /* sideways swipe turns the page, judged where the finger lifts */
  if(g.mode!==null)return;
  if(Math.abs(dx)>SLOP||Math.abs(dy)>SLOP){if(Math.abs(dy)>=Math.abs(dx)*0.75)ovlBody.scrollTop=g.st0-dy;return;}
  if(g.btn)doAct(g.btn.getAttribute("data-act"));}
ovl.addEventListener("pointerup",function(e){endO(e,false);});
ovl.addEventListener("pointercancel",function(e){endO(e,true);});
ovl.addEventListener("click",function(e){e.preventDefault();});

/* ---------- main loop: time runs only while the game is open and visible ---------- */
function events(){var ev=sim.s.ev;while(ev.length){var e=ev.shift();if(e.k==="coin"){popCoin(e.v,e.sloppy);pushSuck(e.sloppy);}else if(e.k==="peel")spawnPeel(e.slot);}}
var last=0,acc=0,STEP=0.05,paused=false,frames=0;
function frame(ts){
  var dt=last?Math.min(0.25,(ts-last)/1000):0;last=ts;
  if(!paused){acc+=dt;while(acc>=STEP){sim.step(STEP);acc-=STEP;}events();tickFlights(dt);tickDust(dt);tickSucks(dt);tickPops(dt);}
  RT=sim.s.t+acc;drawScene(ts);frames++;updateLabels();
  if(frames%6===0)updateHud();
  if(ts-lastSave>2000)saveGame();
  requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;saveGame();}else{paused=false;last=0;}});
window.addEventListener("pagehide",saveGame);window.addEventListener("beforeunload",saveGame);window.addEventListener("unload",saveGame);

window.PP={get sim(){return sim;},Sim:PPSim,save:saveGame,key:SAVE_KEY,reset:function(seed){sim=PPSim.fresh(seed);focusId=null;hud={};boxSnap="";flights=[];flying={};messVer++;sucks=[];rebuildPanel();updateHud();saveGame();},

  setPileMax:function(n){PILEMAX=n;buildPile();pileLayer=null;pileKey=-1;},forcePile:function(n){sim.s.pile=n;},get migrated(){return migrated;},

  objects:function(){return OBJECTS;},labels:function(ms,force){showLabels(ms||8000,force);updateLabels();if(playRect)placeTags();},placeTags:function(){if(playRect)placeTags();},ovl:function(){return ovlMode;},book:function(){return {page:bookPage,pages:bookPages()};},flip:flipBook,open:openOvl,close:closeOvl,buy:shopBuy,
  retView:function(){var s=sim.s,kk=s.suck;if(!kk)return [];var sc=PPSim.spill(kk.t0,kk.n),o=[];for(var j=kk.landed;j<kk.n;j++){var q=retPos(kk,sc,j,RT);o.push(q?{j:j,x:q.x,y:q.y,z:q.z,p:q.p,inPipe:q.inPipe,mouthX:q.mouthX,tx:q.tx,ty:q.ty}:{j:j,p:-1});}return o;},spillView:function(){var s=sim.s,kk=s.suck;if(!kk)return [];var sc=PPSim.spill(kk.t0,kk.n),o=[];for(var j=kk.landed;j<kk.n;j++)o.push({j:j,ex:sc.ex[j],ld:sc.ld[j],rt:RT});return o;},
