<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121633">
<title>Chill Games</title>
<style>
:root{--bg:#121633;--bg2:#1a1f45;--card:#1f2652;--line:#323c7a;--txt:#e6e9f5;--dim:#9aa3d3;--acc:#6f7dff;--acc2:#8a5cff;--gold:#ffcf4a;--red:#ff5a6a;--grn:#4cd98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.scr{position:fixed;inset:0;display:none;z-index:2;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.show{display:flex;flex-direction:column}
/* hub */
#hub{background:radial-gradient(120% 80% at 50% 0%,#252c66 0%,#151a3c 55%,#0f1230 100%);overflow:auto;touch-action:pan-y}
.hubTop{display:flex;align-items:center;gap:10px;padding:14px 14px 4px}
.hubTop h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.06em;background:linear-gradient(90deg,#9fb0ff,#c79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hubTop .sp{flex:1}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(31,38,82,.85);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.hubSub{padding:0 16px 10px;color:var(--dim);font-size:13px;font-weight:700}
#tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 14px 24px}
@media (min-width:640px){#tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#232b5e,#1a2048);padding:10px;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px;min-height:0}
.tile:active{transform:scale(.97)}
.tile canvas{width:100%;aspect-ratio:16/10;border-radius:12px;background:#0f1330;display:block}
.tile b{font-size:15.5px;font-weight:900;letter-spacing:.02em}
.tile small{font-size:11.5px;color:var(--dim);font-weight:700;line-height:1.25}
.tile .best{font-size:11px;font-weight:900;color:var(--gold)}
.tile.off{opacity:.55}
/* game screens */
.gtop{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 10px;pointer-events:none}
.gtop>*{pointer-events:auto}
.gtop .ttl{font-weight:900;font-size:16px;letter-spacing:.05em;color:#cfd5ff;text-shadow:0 1px 2px #000;pointer-events:none}
.gtop .sp{flex:1;pointer-events:none}
.gtop .stat{font-weight:900;font-size:14px;color:#fff;background:rgba(20,24,56,.75);border:1px solid var(--line);border-radius:11px;padding:7px 10px;pointer-events:none}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,10,26,.72);padding:16px}
.ov.show{display:flex}
.pan{width:min(420px,100%);max-height:100%;overflow:auto;border-radius:20px;background:linear-gradient(180deg,#232a5c,#191e44);border:1px solid #3a4486;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:pan-y}
.pan h2{margin:0 0 8px;font-size:22px;font-weight:900;letter-spacing:.04em;text-align:center}
.pan p{margin:6px 0;color:#c4cbef;font-weight:700;font-size:14px;text-align:center;line-height:1.35}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid #5b68e0;background:linear-gradient(180deg,#5b6cff,#4253d6);color:#fff;font-weight:900;font-size:16px;letter-spacing:.03em;cursor:pointer}
.btn.alt{background:#283063;border-color:#3a4378;color:#cfd5f3}
.btn.red{background:linear-gradient(180deg,#e0485a,#b0303e);border-color:#ff7a8a}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.seg button{flex:1;min-width:60px;padding:10px 6px;border-radius:12px;border:1px solid #3a4378;background:#283063;color:#cfd5f3;font-weight:900;font-size:13px;cursor:pointer}.seg button.on{background:linear-gradient(180deg,#5b6cff,#4253d6);border-color:#8792ff;color:#fff}
#setOv .pan{width:min(520px,100%);padding:14px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);z-index:30;background:rgba(20,24,56,.92);border:1px solid #4a56a8;border-radius:12px;padding:8px 14px;font-weight:900;font-size:13px;display:none;pointer-events:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hub" class="scr show">
 <div class="hubTop"><h1>CHILL GAMES</h1><div class="sp"></div><button class="ib" id="hubSet" aria-label="Settings">⚙</button></div>
 <div class="hubSub">Pick a game. Kick back. Nobody's timing you (except Minesweeper).</div>
 <div id="tiles"></div>
</div>
<div id="game" class="scr"></div>
<div class="ov" id="setOv"><div class="pan"><h2>⚙ SETTINGS</h2><div id="setForm"></div><button class="btn alt" id="setClose">Done</button></div></div>
<div class="ov" id="msgOv"><div class="pan" id="msgPan"></div></div>
<div id="toast"></div>
<script>
// ===== SETUI: shared collapsible settings panel (Tough & J's Arcade, big-list phase 1) =====
// Used by every latest game. Categories (tap to expand), alphabetical categories + settings,
// a kid-simple line under every setting, small preview thumbnails, fps cap + resolution scale.
var SETUI=(function(){
 'use strict';
 var CSS='.su{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#e6e9f5;text-align:left;-webkit-user-select:none;user-select:none}'+
 '.su *{box-sizing:border-box}'+
 '.su .su-arc{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;padding:11px 12px;border-radius:14px;border:1px solid #4b5694;background:linear-gradient(180deg,#34407e,#272f63);color:#fff;font:inherit;font-weight:900;font-size:15px;letter-spacing:.03em;cursor:pointer}'+
 '.su .su-cat{margin:0 0 9px;border-radius:16px;background:#1b2140;border:1px solid #303a6e;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.25)}'+
 '.su .su-hd{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:0;background:linear-gradient(90deg,#2c3778,#3a2c6e);color:#fff;font:inherit;font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:left;min-height:50px}'+
 '.su .su-hd .su-ic{width:30px;height:30px;flex:none;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:0}'+
 '.su .su-hd .su-n{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.04em;color:#c9cff0;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;text-transform:none}'+
 '.su .su-hd .su-ch{flex:none;width:12px;height:12px;border-right:3px solid #c9cff0;border-bottom:3px solid #c9cff0;transform:rotate(-45deg);transition:transform .2s;margin:0 4px 0 2px}'+
 '.su .su-cat.open .su-hd .su-ch{transform:rotate(45deg)}'+
 '.su .su-body{display:none;padding:6px 10px 10px;background:#161b34}'+
 '.su .su-cat.open .su-body{display:block}'+
 '.su .su-sub{margin:12px 4px 4px;font-size:11.5px;font-weight:900;letter-spacing:.08em;color:#9aa6e8;text-transform:uppercase}'+
 '.su .su-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 10px;margin:6px 0 0;border-radius:12px;background:#20274a;border:1px solid #2b3360}'+
 '.su .su-row .su-tx{flex:1 1 140px;min-width:0}'+
 '.su .su-row .su-l{font-size:14.5px;font-weight:800;color:#f1f3fb;line-height:1.2}'+
 '.su .su-row .su-d{font-size:12px;font-weight:600;color:#a7aed0;line-height:1.3;margin-top:2px}'+
 '.su .su-row canvas.su-th{width:46px;height:32px;border-radius:7px;flex:none;background:#0f1328;border:1px solid #39427a}'+
 '.su .su-ctl{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:5px;align-items:center}'+
 '.su .su-row.narrow .su-ctl{flex:0 0 auto}'+
 '.su .su-ctl button{flex:1 0 auto;min-width:46px;padding:8px 9px;border-radius:10px;border:1px solid #3a4378;background:#283063;color:#cfd5f3;font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;cursor:pointer}'+
 '.su .su-ctl button.on{background:linear-gradient(180deg,#5b6cff,#4253d6);border-color:#8792ff;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}'+
 '.su .su-ctl input[type=range]{flex:1;min-width:120px;accent-color:#6f7dff;height:28px}'+
 '.su .su-ctl b.su-v{min-width:58px;text-align:right;font-size:13px;color:#fff}'+
 '.su .su-btn{width:100%;margin-top:8px;padding:10px;border-radius:11px;border:1px solid #5a4b9a;background:#3b2f73;color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}'+
 '.su .su-note{margin:6px 2px 10px;padding:9px 11px;border-radius:12px;background:#2a2050;border:1px solid #4a3a86;color:#e2dcff;font-size:12.5px;font-weight:700;line-height:1.3}'+
 '.su .su-fold{display:flex;gap:8px;margin:0 0 9px}.su .su-fold button{flex:1;padding:7px;border-radius:10px;border:1px solid #303a6e;background:#1b2140;color:#aab3e6;font:inherit;font-size:12px;font-weight:800;cursor:pointer}';
 function css(){if(document.getElementById('su-css'))return;var s=document.createElement('style');s.id='su-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
 // ---------- storage ----------
 function lget(k){try{return localStorage.getItem(k);}catch(e){return null;}}
 function lset(k,v){try{localStorage.setItem(k,v);}catch(e){}}
 // ---------- perf runtime: fps cap + resolution scale (works in any game) ----------
 var PERF={fps:60,res:100,game:''},resT=0;var realDPR=window.devicePixelRatio||1;
 function perfLoad(game){PERF.game=game;try{var o=JSON.parse(lget('su.perf.'+game)||'{}');if(o.fps===30||o.fps===60)PERF.fps=o.fps;if(o.res>=40&&o.res<=100)PERF.res=o.res;}catch(e){}
   var raf=window.requestAnimationFrame.bind(window),lastOK=-1e9,curT=-1,curOK=true;
   window.requestAnimationFrame=function(cb){return raf(function tick(t){if(PERF.fps>=60)return cb(t);
     if(t!==curT){curT=t;curOK=(t-lastOK)>=(1000/PERF.fps)-4;if(curOK)lastOK=t;}
     if(curOK)return cb(t);raf(tick);});};}
 function perfSave(){lset('su.perf.'+PERF.game,JSON.stringify({fps:PERF.fps,res:PERF.res}));}
 function perfSet(k,v){PERF[k]=v;perfSave();if(k==='res'){clearTimeout(resT);resT=setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},120);}}
 // standard items every game gets in its Graphics category
 function perfItems(){return[
  {k:'_res',l:'Resolution',d:'Slide left = a bit blurrier but faster and cooler on old phones.',t:'range',min:40,max:100,step:5,fmt:function(v){return v+'%';},get:function(){return PERF.res;},set:function(v){perfSet('res',v);},th:'res'},
  {k:'_fps',l:'Frame rate limit',d:'60 is smoothest. 30 saves battery and stops stutter on slow phones.',t:'opt',o:[[60,'60 FPS'],[30,'30 FPS']],get:function(){return PERF.fps;},set:function(v){perfSet('fps',v);},th:'fps'}];}
 // ---------- preview thumbnails (tiny canvases drawn from the current value) ----------
 var TH={};
 function lvl(v){if(v===false||v===0||v==='off'||v==='none')return 0;if(v==='lite'||v==='low'||v==='few'||v==='simple'||v==='some')return 1;if(v==='med'||v==='normal'||v==='medium'||v===true||v===1||v==='on'||v==='auto')return 2;return 3;}
 TH.res=function(g,w,h,v){var px=v>=100?1:v>=85?2:v>=70?3:5;for(var y=0;y<h;y+=px)for(var x=0;x<w;x+=px){var dx=x+px/2-w/2,dy=y+px/2-h/2,in1=dx*dx+dy*dy<120;g.fillStyle=in1?'#ffcf4a':((x/px+y/px)&1?'#1d2550':'#232c5c');g.fillRect(x,y,px,px);}};
 TH.fps=function(g,w,h,v){var n=v>=60?7:4;for(var i=0;i<n;i++){g.globalAlpha=0.25+0.75*i/(n-1);g.fillStyle='#7fd0ff';g.beginPath();g.arc(6+i*(w-12)/(n-1),h/2+Math.sin(i*0.9)*5,3.2,0,6.3);g.fill();}g.globalAlpha=1;};
 TH.particles=function(g,w,h,v){var n=[0,6,16,34][lvl(v)];for(var i=0;i<n;i++){var a=i*2.4,r=3+(i*7%12);g.fillStyle=i%3?'#ffb52e':'#ff6a3a';g.fillRect(w/2+Math.cos(a)*r*1.4,h/2+Math.sin(a)*r,2,2);}g.fillStyle='#fff';g.beginPath();g.arc(w/2,h/2,2.5,0,6.3);g.fill();};
 TH.shadows=function(g,w,h,v){if(lvl(v)){g.fillStyle='rgba(0,0,0,.6)';g.beginPath();g.ellipse(w/2+5,h-7,12,4,0,0,6.3);g.fill();}g.fillStyle='#6f7dff';g.fillRect(w/2-8,6,16,16);g.fillStyle='#9aa6ff';g.fillRect(w/2-8,6,16,4);};
 TH.gore=function(g,w,h,v){var n=[0,2,5,9][lvl(v)];g.fillStyle='#cfd5f3';g.beginPath();g.arc(w/2,h/2-3,4,0,6.3);g.fill();g.fillRect(w/2-3,h/2,6,8);for(var i=0;i<n;i++){g.fillStyle='#d01a1a';g.beginPath();g.arc(w/2+Math.cos(i*1.9)*(7+i),h/2+Math.sin(i*1.9)*(4+i*0.6)+3,1.6+(i%3)*0.6,0,6.3);g.fill();}};
 TH.decals=function(g,w,h,v){var n=typeof v==='number'?(v===0?5:Math.min(8,Math.max(1,Math.round(v/(v>20?18:2.5))))):[0,2,5,8][lvl(v)];for(var i=0;i<n;i++){g.fillStyle=i%2?'#5a1414':'#3a2a1a';g.beginPath();g.ellipse(6+(i*13)%(w-10),6+(i*9)%(h-10),5,3,i,0,6.3);g.fill();}};
 TH.shake=function(g,w,h,v){var a=typeof v==='number'?v/100:[0,0.4,0.7,1][lvl(v)];g.strokeStyle='#ffcf4a';g.lineWidth=2;for(var i=a>0?2:0;i>=0;i--){g.globalAlpha=i?0.3:1;g.strokeRect(w/2-9+i*a*4,h/2-7-i*a*2,18,14);}g.globalAlpha=1;};
 TH.anim=function(g,w,h,v){var L=lvl(v);g.strokeStyle='#cfd5f3';g.lineWidth=2;g.lineCap='round';g.beginPath();g.arc(w/2,7,3.5,0,6.3);g.moveTo(w/2,11);g.lineTo(w/2,19);g.moveTo(w/2,19);g.lineTo(w/2-(L>1?6:2),h-4);g.moveTo(w/2,19);g.lineTo(w/2+(L>1?6:2),h-4);g.moveTo(w/2,13);g.lineTo(w/2+(L>1?8:5),L>1?10:17);g.moveTo(w/2,13);g.lineTo(w/2-5,17);g.stroke();if(L>1){g.strokeStyle='#7fd0ff';g.globalAlpha=.6;g.beginPath();g.moveTo(5,10);g.lineTo(12,10);g.moveTo(3,16);g.lineTo(11,16);g.stroke();g.globalAlpha=1;}};
 TH.gfx=function(g,w,h,v){var L=lvl(v);g.fillStyle=L>2?'#3b5cff':'#2f3a77';g.fillRect(0,h-10,w,10);g.fillStyle='#6fc24a';g.beginPath();g.moveTo(4,h-10);g.lineTo(14,6);g.lineTo(24,h-10);g.fill();if(L>1){g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(18,h-9,9,2.5,0,0,6.3);g.fill();g.fillStyle='#ffcf4a';g.beginPath();g.arc(36,8,4,0,6.3);g.fill();}if(L>2){g.fillStyle='#fff';g.fillRect(30,16,2,2);g.fillRect(38,20,2,2);g.fillRect(34,24,2,2);}};
 TH.sound=function(g,w,h,v){var on=lvl(v)>0;g.fillStyle='#cfd5f3';g.beginPath();g.moveTo(10,12);g.lineTo(15,12);g.lineTo(21,6);g.lineTo(21,26);g.lineTo(15,20);g.lineTo(10,20);g.fill();g.strokeStyle=on?'#7fd0ff':'#ff5a5a';g.lineWidth=2;g.beginPath();if(on){g.arc(22,16,6,-0.8,0.8);g.moveTo(31,9);g.arc(22,16,11,-0.8,0.8);}else{g.moveTo(26,11);g.lineTo(36,21);g.moveTo(36,11);g.lineTo(26,21);}g.stroke();};
 TH.meter=function(g,w,h,v){var on=lvl(v)>0;g.strokeStyle=on?'#7fff9a':'#4a527f';g.lineWidth=1.5;g.beginPath();for(var x=2;x<w-2;x+=3){var y=h-8-((x*7)%9)-(x%17===0?8:0);x===2?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();if(on){g.fillStyle='#7fff9a';g.font='bold 8px sans-serif';g.fillText('60',3,9);}};
 TH.tilt=function(g,w,h,v){var on=lvl(v)>0;g.fillStyle='#6fc24a';g.fillRect(0,0,w,h);g.fillStyle='#8a5a30';g.fillRect(w/2-4,h/2-4,8,8);if(on){g.fillStyle='rgba(200,220,255,.45)';g.fillRect(0,0,w,8);g.fillRect(0,h-8,w,8);}};
 TH.light=function(g,w,h,v){var L=lvl(v);g.fillStyle='#0d1022';g.fillRect(0,0,w,h);var r=g.createRadialGradient(w/2,h/2,1,w/2,h/2,8+L*5);r.addColorStop(0,'rgba(255,210,120,.9)');r.addColorStop(1,'rgba(255,210,120,0)');g.fillStyle=r;g.fillRect(0,0,w,h);};
 TH.numbers=function(g,w,h,v){if(!lvl(v))return;g.fillStyle='#ffd0d0';g.font='900 12px sans-serif';g.fillText('-25',8,20);};
 TH.weather=function(g,w,h,v){var L=lvl(v);g.strokeStyle='#7fb4ff';g.lineWidth=1.2;for(var i=0;i<[0,5,10,16][L];i++){var x=(i*11)%w,y=(i*7)%h;g.beginPath();g.moveTo(x,y);g.lineTo(x-2,y+5);g.stroke();}};
 // fraction 0..1 of the current value (slider position / option index / on-off)
 function frac(v,it){if(!it)return lvl(v)/3;if(it.t==='range'){var a=+it.min,b=+it.max;return b>a?Math.max(0,Math.min(1,(v-a)/(b-a))):0;}if(it.t==='bool')return v?1:0;if(it.o&&it.o.length>1){for(var i=0;i<it.o.length;i++)if(String(it.o[i][0])===String(v))return i/(it.o.length-1);}return lvl(v)/3;}
 var AC='#7fd0ff',GO='#ffcf4a',FG='#cfd5f3',DK='#1d2550';
 TH.dd=function(g,w,h,v,it){var f=frac(v,it);g.fillStyle='#0b0e1c';g.fillRect(0,0,w,h);var r=6+f*22;for(var i=0;i<9;i++){var x=4+(i*13)%(w-6),y=5+(i*7)%(h-8),d=Math.hypot(x-w/2,y-h/2);if(d<r){g.fillStyle='#3f8a3a';g.beginPath();g.arc(x,y,3,0,6.3);g.fill();}}g.fillStyle=GO;g.fillRect(w/2-3,h/2-2,6,4);var gr=g.createRadialGradient(w/2,h/2,r*0.6,w/2,h/2,r+1);gr.addColorStop(0,'rgba(11,14,28,0)');gr.addColorStop(1,'rgba(11,14,28,1)');g.fillStyle=gr;g.fillRect(0,0,w,h);};
 TH.crop=function(g,w,h,v,it){var f=frac(v,it),b=Math.round(f*12);g.fillStyle='#2f6a3a';g.fillRect(0,0,w,h);g.fillStyle=GO;g.fillRect(w/2-3,h/2-2,6,4);g.fillStyle='#000';g.fillRect(0,0,b,h);g.fillRect(w-b,0,b,h);};
