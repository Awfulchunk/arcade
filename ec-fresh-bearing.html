<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empire Clash FRESH — Bearing</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5f7;margin:0;padding:16px;color:#1b1d22}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:22px 0 8px;color:#444}
.q{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.q b{display:block;margin-bottom:6px;font-size:16px}
.op{font-size:13px;background:#fff6dd;border-left:4px solid #f0b400;padding:6px 8px;border-radius:6px;margin:6px 0 10px}
label{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:8px;margin:3px 0;background:#f7f8fa;font-size:15px}
label:has(input:checked){background:#dcecff;outline:2px solid #3b82f6}
.tag{font-size:11px;background:#f0b400;color:#000;border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:44px;border-radius:8px;border:1px solid #ccc;padding:8px;font:inherit;margin-top:6px}
.small{font-size:12px;color:#666}
button{position:sticky;bottom:10px;width:100%;padding:16px;font-size:18px;font-weight:800;border:0;border-radius:14px;background:#111;color:#fff;margin-top:16px}
#out{white-space:pre-wrap;background:#fff;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;display:none}
</style></head><body>
<h1>Empire Clash FRESH — Bearing</h1><div class="op" style="background:#ffe0e0;border-color:#d00"><b>⚠ NO BUILD until your paste includes GO (S3).</b> Separate game. Nothing from WWT.</div>
<div class="small">Tap your picks. The <span class="tag">TOUGH'S PICK</span> tag marks my opinion. Write in the box if you want something else. When you're done, hit <b>COPY MY ANSWERS</b> at the bottom and paste them back to me in chat.</div>
<div id="f"></div>
<button onclick="go()">COPY MY ANSWERS</button>
<div id="out"></div>
<script>
const Q=[
{s:"STARTING POINT"},
{id:"B1",t:"Where does the new EC start from?",op:"Fork the current arcade EC (the version before any WWT work) and strip it into its own project. Keeps what already works, zero wartime code.",o:[["Fork current arcade EC (pre-WWT), strip into its own repo",1],["Clean rebuild from scratch, reuse only classic EC art",0],["Clean rebuild, new code AND new art",0]]},
{id:"B2",t:"WWT code/assets allowed in?",op:"None. No wartime atlas, no WWT roster, no WWT map, no WWT settings.",o:[["ZERO — nothing from WWT",1],["Only generic bug fixes (no art/units/systems)",0]]},
{id:"B3",t:"Lock a test checklist before any ship?",op:"Yes. Written checklist: spawn, move, attack, gather, build, place, win/lose, settings, zoom, perf. I run every line on device-size before an APK.",o:[["Yes, full written checklist + video/screens proof",1],["Yes, checklist only",0]]},
{s:"KEEP WHICH FEATURES (pick any)"},
{id:"K1",t:"Core gameplay to keep",m:1,op:"Keep the core loop: gather, build, train, push. That's EC.",o:[["Gather wood/food/gold",1],["Build buildings + walls",1],["Train Spear/Sword/Archer etc.",1],["AI opponent / skirmish",1],["Ages (Stone→Medieval→...)",0],["Capture points mid-map",0],["Hero unit",0]]},
{id:"K2",t:"Controls to keep",m:1,op:"Tap select, drag box, rally point, pinch zoom.",o:[["Tap select",1],["Drag box select",1],["Rally point",1],["Pinch zoom",1],["Joystick option",0],["Retreat button",0]]},
{id:"K3",t:"Settings to keep",m:1,op:"Graphics presets + FPS counter + shake slider. Nothing else till the core is clean.",o:[["Graphics presets + FPS",1],["Screen shake slider",1],["Unit size scroller",0],["Stick-figure style",0],["Map maker",0]]},
{id:"K4",t:"Map size",op:"Keep the bigger EC map from Round 2 (2.5x tall, 1.5x wide), no fog.",o:[["Original EC size",0],["2.5x tall / 1.5x wide, no fog",1],["Bigger + fog",0]]},
{s:"ART"},
{id:"A1",t:"Art source",op:"Classic EC art only. NO wartime atlas, anywhere, ever.",o:[["Classic EC art only",1],["Classic EC + polished/redrawn classic-style",0]]},
{id:"A2",t:"Animation",op:"Real walk + attack frames for every unit. No sliding.",o:[["Real walk + attack frames all units",1],["Keep current animation",0]]},
{id:"A3",t:"Scale rule",op:"Flowers < bushes < people < buildings, locked at every zoom.",o:[["Lock the scale ladder",1],["Don't care",0]]},
{s:"IDENTITY & DELIVERY"},
{id:"P1",t:"Name",op:"'Empire Clash' — clean, its own title.",o:[["Empire Clash",1],["Empire Clash Fresh",0],["Something else (type below)",0]]},
{id:"P2",t:"Package name (separate from app.tj.wwt)",op:"app.tj.empireclash — its own app, installs next to the arcade and WWT.",o:[["app.tj.empireclash",1],["app.tj.ec",0],["Other (type below)",0]]},
{id:"P3",t:"How do you get it?",op:"Standalone APK with its own download page. Arcade card can come later.",o:[["Standalone APK only",1],["Arcade card only",0],["Both",0]]},
{s:"SCOPE & GO"},
{id:"S1",t:"First pass scope",op:"Clean standalone EC: core loop, controls, classic art with walk frames, fully tested. Extras after.",o:[["Core only, tested hard",1],["Core + Ages + capture points",0],["Everything picked above",0]]},
{id:"S3",t:"GO or HOLD?",op:"NO BUILD until this says GO.",o:[["GO",0],["HOLD — more notes first",1]]},
{id:"X",t:"Anything else?",o:[]}
];
const f=document.getElementById('f');
Q.forEach(q=>{if(q.s){f.insertAdjacentHTML('beforeend','<h2>'+q.s+'</h2>');return}
let h='<div class="q"><b>'+q.id+'. '+q.t+'</b>';if(q.op)h+='<div class="op">💬 Tough: '+q.op+'</div>';
q.o.forEach((o,i)=>{h+='<label><input type="'+(q.m?'checkbox':'radio')+'" name="'+q.id+'" value="'+i+'"> <span>'+o[0]+(o[1]?'<span class="tag">TOUGH\'S PICK</span>':'')+'</span></label>'});
h+='<textarea id="w'+q.id+'" placeholder="Your own idea or opinion (optional)"></textarea></div>';f.insertAdjacentHTML('beforeend',h)});
function go(){let s="EC FRESH BEARING ANSWERS\n";Q.forEach(q=>{if(q.s){s+="\n["+q.s+"]\n";return}
const p=[...document.querySelectorAll('input[name="'+q.id+'"]:checked')].map(e=>q.o[+e.value][0]);
const w=document.getElementById('w'+q.id).value.trim();
s+=q.id+": "+(p.length?p.join(" | "):"(no pick)")+(w?"  || Jay: "+w:"")+"\n"});
const o=document.getElementById('out');o.style.display='block';o.textContent=s;
(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert("Copied! Paste it to Tough in chat.")).catch(()=>alert("Couldn't auto-copy. Long-press the text below, copy it, and paste it to Tough."))}
</script></body></html>
