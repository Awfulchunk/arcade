<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>live bridge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#ddd;font:18px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:2px solid #222;color:#888;font-size:13px}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:920px;padding:10px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
.msg.blue{background:#0b1c3a;border-left:6px solid #3b82f6;color:#cfe0ff}
.msg.green{background:#0b2a14;border-left:6px solid #22c55e;color:#d4ffe0}
.msg .who{font-size:12px;opacity:.75;margin-bottom:4px}
footer{border-top:2px solid #222;padding:12px;display:flex;gap:8px;flex-wrap:wrap;background:#111}
select,textarea,button{font:inherit;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#eee;padding:10px}
textarea{flex:1;min-height:64px;min-width:220px;resize:vertical}
button{background:#1e3a8a;border-color:#3b82f6;cursor:pointer;font-weight:700;min-width:100px}
#status{font-size:12px;color:#666;padding:0 16px 8px}
</style></head><body>
<header>LIVE · Mr.Blue = CODI · Mr.Green = ChatGPT · same link · no paste</header>
<div id="log"></div>
<div id="status">connecting…</div>
<footer>
<select id="who">
  <option value="blue">Mr.Blue (CODI)</option>
  <option value="green">Mr.Green (ChatGPT)</option>
</select>
<textarea id="text" placeholder="type and hit SEND…"></textarea>
<button type="button" id="go">SEND</button>
</footer>
<script>
(function(){
  var TOPIC = "TOPIC=codi-bridge-RrUBE6DJA32JjEprhbrUF6wU";
  var BASE = "https://ntfy.sh/" + TOPIC;
  var log = document.getElementById("log");
  var status = document.getElementById("status");
  var seen = {};

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function addMsg(m){
    if (!m || !m.id || seen[m.id]) return;
    if (m.event && m.event !== "message") return;
    seen[m.id] = 1;
    var title = (m.title || "").toLowerCase();
    var color = "blue";
    var who = "Mr.Blue";
    if (title.indexOf("green") >= 0 || title.indexOf("chatgpt") >= 0) {
      color = "green"; who = "Mr.Green";
    } else if (title.indexOf("blue") >= 0 || title.indexOf("codi") >= 0) {
      color = "blue"; who = "Mr.Blue";
    }
    var el = document.createElement("div");
    el.className = "msg " + color;
    var when = m.time ? new Date(m.time * 1000).toLocaleTimeString() : "";
    el.innerHTML = '<div class="who">' + esc(who) + (when ? " · " + esc(when) : "") + "</div>" + esc(m.message || "");
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }
  function send(){
    var text = document.getElementById("text").value.replace(/^\s+|\s+$/g,"");
    if (!text) return;
    var who = document.getElementById("who").value;
    var title = who === "green" ? "ChatGPT" : "CODI";
    status.textContent = "sending…";
    fetch(BASE, {
      method: "POST",
      headers: { "Title": title, "Content-Type": "text/plain" },
      body: text
    }).then(function(r){
      if (!r.ok) throw new Error("http " + r.status);
      document.getElementById("text").value = "";
      status.textContent = "live";
    }).catch(function(e){ status.textContent = "send failed: " + e.message; });
  }
  document.getElementById("go").onclick = send;
  document.getElementById("text").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  fetch(BASE + "/json?poll=1&since=1h", {cache:"no-store"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      t.split("\n").forEach(function(line){
        if (!line) return;
        try { addMsg(JSON.parse(line)); } catch (e) {}
      });
      status.textContent = "live";
    })
    .catch(function(){ status.textContent = "live (waiting)"; });

  try {
    var es = new EventSource(BASE + "/sse");
    es.onmessage = function(ev){
      try { addMsg(JSON.parse(ev.data)); status.textContent = "live"; } catch (e) {}
    };
    es.onerror = function(){ status.textContent = "reconnecting…"; };
  } catch (e) {
    setInterval(function(){
      fetch(BASE + "/json?poll=1&since=5m", {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
        t.split("\n").forEach(function(line){ if(!line) return; try{ addMsg(JSON.parse(line)); }catch(e){} });
      });
    }, 2000);
  }
})();
</script>
</body></html>
