<script>
'use strict';
(function(){
/* =====================================================================
   PIXEL WAR 0.3 — full game on the 0.1.1 density engine.
   Layers: CONFIG/CUSTOM · RNG · STATE (struct-of-arrays) · SIDE API (shared by player + AI)
   · SHAPES (squads) · AI (plan + live learning, memory wiped at match end) · MATCH · PIXELS · COLLISION · RENDER · VIEWS/HUD · INPUT · __tt hook
   Pixel states: 1 exit, 2 follow path, 3 end (straight + drift, leash), 4 squad (formation slot on a path).
   ===================================================================== */
const W=360,H=500,STEP=1/60,CELL=4,GW=Math.ceil(W/CELL)+2,GH=Math.ceil(H/CELL)+2,WCELL=8,WGW=Math.ceil(W/WCELL)+2,WGH=Math.ceil(H/WCELL)+2;
const POOL=10000,CAPMAX=POOL,NP=POOL*2,CAPMIN=250,CAPSTEP=250,PERFCAP=4000,MAXP=6,MAXSQ=40,PSP=4,LGX=9,LGY=12;
const WALL_HALF=2,MAX_STROKES=12,CONTACT=3.5,LOOK=14,EXIT_T=14,STUN=24,CD_HIT=10,CD_WALL=8;
const KEY='pixelwar.v3',KEYC='pixelwar.v3.custom';
const SHAPES=['LINE','ARROW','WEDGE','RING','DIAMOND','DOUBLE','SPIRAL'];
// ---------- CONFIG: every constant a rule (quick match uses DEFCFG; CUSTOM GAME edits a copy)
const DEFCFG={poolSize:POOL,lives:20,burn:20,circleDmg:1,circleR:22,pixHP:2,pixDmg:1,missP:20,ricoP:35,ricoMode:0,leash:72,
 pathMax:520,brMax:140,maxBr:3,wallMax:220,segHP:700,wallDmg:1,wsp:8,wcell:4,matchSec:120,prepSec:0,zoneH:52,
 sqN:300,tint:1,borrowSec:1.2,shapeCD:6,armSec:4,sqPull:50,shapeLane:0.8,shapeLen:3,ring:0,rhoRef:10,kSurv:0.9,kPush:0.8,survMax:0.85,pushMax:0.9,aiLevel:3,aiLearn:1,liveBr:1,liveWall:1,converge:0,momentum:0,orient:0,bias:0,autoDist:0,reslot:0,pattern:0,duel:0,halo:1,reveal:1,capDef:PERFCAP,relMul:120};
let CFG=Object.assign({},DEFCFG);
const LBL={ricoMode:['RANDOM','ANGLE','HYBRID'],aiLevel:['OFF','EASY','NORMAL','HARD','EXPERT'],converge:['SEPARATE','MERGE','REFORM'],orient:['TIP FIRST','TIP LAST'],bias:['EVEN','FRONT','REAR'],pattern:['STEADY','PULSE'],duel:['VS AI','HOT-SEAT']};
// [key,label,hint,type(r=range,e=enum,b=bool),min,max,step]
const CUSTOM=[
 ['_','MATCH'],
 ['poolSize','Pool = circle HP (pixels)','10000 = 500 circle hits at burn 20','r',1000,POOL,500],['burn','Pool burned per circle hit','each enemy pixel that reaches your circle','r',1,200,1],['lives','Lives per pixel','each collision death uses one; at 0 it is gone for good','r',1,40,1],['circleDmg','Circle hits counted per pixel','','r',1,10,1],['circleR','Circle radius','','r',16,32,2],
 ['matchSec','Time limit (s)','higher circle HP wins at time','r',30,300,10],['prepSec','Prep timer (s)','0 = no limit, press START','r',0,120,10],['zoneH','Circle placement strip','how far up you may place it','r',30,150,10],
 ['duel','Players','HOT-SEAT = 2 humans, pass the device','e'],
 ['_','PIXELS'],
 ['pixHP','Pixel HP','Jay locked 2','r',1,6,1],['pixDmg','Pixel damage per hit','Jay locked 1','r',1,3,1],['missP','Miss: ricochet instead of damage %','','r',0,60,5],['ricoP','Ricochet alongside a hit %','','r',0,80,5],
 ['ricoMode','Ricochet rule','random, impact angle, or both','e'],['leash','Leash distance','the "2 inches"','r',30,140,6],['capDef','Max on screen per side (performance cap)','0.2 used 3000; 10000 = whole pool','r',250,POOL,250],['relMul','Release rate per notch','pixels/s per slider step','r',20,120,20],['pattern','Release pattern','steady stream or pulsing waves','e'],['momentum','Formation momentum','speed builds when not hit','b'],
 ['_','PATHS AND BRANCHES'],
 ['pathMax','Main path meter','','r',200,900,20],['brMax','Branch meter (each)','','r',40,300,20],['maxBr','Max branches','','r',0,5,1],['liveBr','Redraw branches in battle','','b'],['tint','Tint shape pixels','shape pixels draw in a brighter color so you can see the formation','b'],['converge','Branch end','where pixels go when a branch ends','e'],['autoDist','Auto-distribute branch share','','b'],
 ['_','WALLS'],
 ['wallMax','Wall meter','keep under 360 so gaps stay','r',60,340,20],['segHP','Segment HP','','r',200,6000,100],['wallDmg','Damage per hit','','r',1,10,1],['wsp','Wall draw step','distance between wall points','r',6,14,2],['wcell','Wall cell size','damage is per cell: a hole opens exactly where the enemy keeps hitting','r',2,8,2],['liveWall','Build walls in battle','','b'],
 ['_','SHAPES'],
 ['shapeCD','Shape cooldown (s)','each shape is an ability on an interval; the AI obeys the same cooldown','r',1,30,1],['armSec','Shape wait for pixels (s)','how long a fired shape waits at its form point','r',1,10,1],['sqN','Pixels borrowed per shape','','r',40,600,20],['sqPull','Borrow % of passing pixels','higher = thinner stream behind the shape, faster gather','r',10,100,5],['borrowSec','Max gather time (s)','a shape closes with what it has after this long','r',0.4,3,0.2],['shapeLane','Shape width vs lane','1 = full lane width; shapes never grow the lane','r',0.4,1,0.1],['shapeLen','Shape length (x lane half-width)','','r',1.2,4,0.2],['ring','RING shape available','moved here from the main game','b'],['orient','Formation orientation','','e'],['bias','Pixel weight in formation','','e'],['reslot','Re-shape existing formations','when you switch shape','b'],
 ['_','AI'],
 ['aiLevel','AI level','intelligence only, never stats','e'],['aiLearn','AI learns during match','memory is wiped when it ends','b'],
 ['_','LOOK'],
 ['halo','Show lane halo','','b'],['reveal','Show enemy plan in battle','','b'],
 ['_','COLLISION DENSITY'],
 ['rhoRef','Density reference (pixels per 12x12)','local density that counts as 1x','r',4,30,1],['kSurv','Packed pixel survives more','survive-chance gain per density ratio','r',0,2,0.1],['kPush','Packed pixel pushes enemies away','bounce-chance gain per density ratio','r',0,2,0.1],['survMax','Max survive chance','','r',0.2,0.95,0.05],['pushMax','Max push-away chance','','r',0.2,0.95,0.05]];
const DEF={speed:5,density:7,release:9,cap:PERFCAP,sdens:7,compact:6};
// ---------- RNG (all sim randomness)
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
let seed=1,rnd=mul(1);
const fin=v=>typeof v==='number'&&Number.isFinite(v);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function speedOf(set){return 30+9*set.speed;}
function rateOf(set){return CFG.relMul*set.release;}
function laneHW(set){return (30-set.density*2.5)*(1.25-0.05*set.speed);}
// ---------- STATE
let S=null,CR=22,ME=0;
const px=new Float32Array(NP),py=new Float32Array(NP),pvx=new Float32Array(NP),pvy=new Float32Array(NP),pox=new Float32Array(NP),poy=new Float32Array(NP);
const php=new Int8Array(NP),pst=new Uint8Array(NP),pcnt=new Uint8Array(NP),pcd=new Uint8Array(NP),pwc=new Uint8Array(NP),pstun=new Uint8Array(NP);
const pps=new Float32Array(NP),poff=new Float32Array(NP),pdr=new Float32Array(NP),pspm=new Float32Array(NP),pend=new Float32Array(NP);
const pid=new Uint8Array(NP),pcap=new Uint8Array(NP),pdec=new Uint8Array(NP),psh=new Uint8Array(NP),pmom=new Uint8Array(NP);
const psq=new Int16Array(NP).fill(-1),pslot=new Int16Array(NP);
const gHead=new Int32Array(GW*GH),gNext=new Int32Array(NP),cntA=[new Uint16Array(GW*GH),new Uint16Array(GW*GH)];
let wGrid=new Array(WGW*WGH);
// READY pixels wait in a FIFO ring per side (so lives wear evenly); pool = ready + out - debt. plife[i]=0 means the pixel is gone for good.
const plife=new Uint8Array(NP),qBuf=[new Int32Array(POOL),new Int32Array(POOL)],qHead=[0,0],qN=[0,0];
function qPush(side,i){qBuf[side][(qHead[side]+qN[side])%POOL]=i;qN[side]++;}
function qPop(side){const i=qBuf[side][qHead[side]];qHead[side]=(qHead[side]+1)%POOL;qN[side]--;return i;}
const poolN=()=>clamp(CFG.poolSize|0,1,POOL);
function resetFree(){const n=poolN();plife.fill(0);for(let s=0;s<2;s++){qHead[s]=0;qN[s]=0;for(let k=0;k<n;k++){const i=s*POOL+k;plife[i]=clamp(CFG.lives|0,1,255);qPush(s,i);}}}
let stat={ticks:0,ms:0,maxMs:0};
const zeros=n=>new Array(n).fill(0);
function mkPath(id,par,fk){return{id:id,p:[],par:par,fk:fk,share:id?40:100,sh:{t:1,pull:CFG.sqPull,at:0},rj:-1,kids:[],arm:null};}
function mkSide(id){return{id:id,dir:id===0?-1:1,circle:{x:W/2,y:id===0?H-44:44,r:CR,hp:poolN()},pool:poolN(),debt:0,paths:[mkPath(0,-1,0)],strokes:[],segs:[],sq:new Array(MAXSQ).fill(null),
  set:Object.assign({},DEF),acc:0,active:0,locked:false,human:id===0||!!CFG.duel,
  stats:{released:0,kills:0,recalled:0,circleDmg:0,burned:0,livesUsed:0,lostForGood:0,wallDmg:0,wallsBroken:0,ricochets:0,misses:0,ct:0,defl:0,surv:0,pushed:0,shapeMade:zeros(7),shapeKill:zeros(7),shapeLoss:zeros(7)},
  pathKill:zeros(MAXP),pathLoss:zeros(MAXP),lossGrid:new Float32Array(LGX*LGY),openQ:zeros(MAXP).map(()=>-1),shReady:zeros(7),shUsed:zeros(7)};}
function newGame(sd,keepSet){
  seed=sd>>>0;rnd=mul(seed);CR=CFG.circleR;
  const old=S;
  S={tick:0,phase:'prep',over:false,winner:-2,paused:false,msg:'',tool:'main',sides:[mkSide(0),mkSide(1)],prepT:0,ai:null,aiSummary:null,cfg:Object.assign({},CFG)};
  if(keepSet&&old){S.sides[0].set=Object.assign({},old.sides[0].set);S.sides[0].set.cap=Math.min(S.sides[0].set.cap,CFG.capDef);}
  for(const sd2 of S.sides){sd2.set.cap=Math.min(keepSet&&sd2.id===0?sd2.set.cap:CFG.capDef,CFG.capDef);}
  ME=0;selP=0;
  const e=S.sides[1].circle;e.x=clamp(40+rnd()*(W-80),CR+6,W-CR-6);e.y=28+Math.round(rnd()*(CFG.zoneH*0.6));
  for(const sd2 of S.sides)sd2.paths[0].p=[sd2.circle.x,sd2.circle.y];
  pst.fill(0);php.fill(0);pcd.fill(0);pwc.fill(0);pstun.fill(0);psq.fill(-1);pid.fill(0);pcap.fill(0);pdec.fill(0);psh.fill(0);pmom.fill(0);
  wGrid=new Array(WGW*WGH);resetFree();
  stat={ticks:0,ms:0,maxMs:0};
}
// ---------- SIDE API (the ONLY way to build; player input and AI both call these; same meters for both)
let selP=0;
const zoneOf=side=>side===0?{y0:H-CFG.zoneH-8,y1:H-CR-6}:{y0:CR+6,y1:CFG.zoneH+8};
const pathN=P=>P.p.length>>1;
const pathLen=P=>(pathN(P)-1)*PSP;
const pathUsed=sd=>pathLen(sd.paths[0]);
const brUsed=P=>pathLen(P);
const wallUsed=sd=>{let n=0;for(const s of sd.strokes)n+=(s.pts.length/2-1)*CFG.wsp;return n;};
const brCount=sd=>{let n=0;for(let k=1;k<sd.paths.length;k++)if(sd.paths[k])n++;return n;};
const canMain=sd=>S.phase==='prep'&&!sd.locked&&!S.over;
const canWall=sd=>!S.over&&((S.phase==='prep'&&!sd.locked)||(S.phase==='battle'&&!!CFG.liveWall));
const canBr=sd=>!S.over&&((S.phase==='prep'&&!sd.locked)||(S.phase==='battle'&&!!CFG.liveBr));
function placeCircle(side,x,y){const sd=S.sides[side];if(!canMain(sd)||!fin(x)||!fin(y))return false;
  const z=zoneOf(side);x=clamp(x,CR+6,W-CR-6);y=clamp(y,Math.min(z.y0,z.y1),Math.max(z.y0,z.y1));
  const c=sd.circle;if(Math.abs(x-c.x)<0.01&&Math.abs(y-c.y)<0.01)return true;
  c.x=x;c.y=y;resetPaths(sd);
  sd.strokes=sd.strokes.filter(s=>{for(let k=0;k<s.pts.length;k+=2)if(Math.hypot(s.pts[k]-x,s.pts[k+1]-y)<CR+8)return false;return true;});
  return true;}
function resetPaths(sd){const c=sd.circle,m=mkPath(0,-1,0);m.p=[c.x,c.y];m.sh=sd.paths[0].sh;sd.paths=[m];}
function pathExtend(side,tx,ty){const sd=S.sides[side];if(!canMain(sd)||!fin(tx)||!fin(ty))return 0;
