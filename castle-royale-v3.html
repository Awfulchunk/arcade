<html lang="en">

<title>Castle Royale v3</title>
<style>
:root{--f:"Lilita One","Luckiest Guy",ui-rounded,"SF Pro Rounded","Nunito","Arial Black",system-ui,sans-serif;--ink:#1b1b2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1d4fa8;font-family:var(--f);color:#fff;position:fixed;inset:0;width:100%;touch-action:none;overscroll-behavior:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(#3b7be8,#1d4fa8 55%,#173f8a);padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 72px);overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.scr.on{display:flex}
.scr::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 0%,#ffffff22,transparent 60%),repeating-linear-gradient(45deg,#ffffff08 0 14px,transparent 14px 28px),repeating-linear-gradient(-45deg,#00000010 0 14px,transparent 14px 28px)}
.scr{isolation:isolate}
.logo{text-align:center;font-weight:900;font-size:30px;line-height:1;margin:2px 0 8px;color:#ffd23f;letter-spacing:.03em;-webkit-text-stroke:2px #3a1a00;text-shadow:0 4px 0 #3a1a00,0 7px 10px #0007;transform:rotate(-2deg)}
.logo span{display:inline-block;font-size:16px;color:#fff;background:linear-gradient(#ff6a5a,#c8202a);-webkit-text-stroke:0;padding:3px 8px;border-radius:9px;vertical-align:middle;margin-left:6px;box-shadow:0 3px 0 #6a0a10;text-shadow:0 2px 0 #0008;transform:rotate(6deg)}
.arena{box-shadow:0 0 0 3px #ffd23f,0 8px 18px #0008 !important}
.t{font-weight:900;text-shadow:0 2px 0 #0008,0 0 2px #000;letter-spacing:.02em}
h2{margin:6px 0 8px;font-size:26px;text-align:center;font-weight:900;text-shadow:0 3px 0 #0008,0 0 3px #000}

.btn{border:0;border-radius:14px;padding:12px 14px;font-family:var(--f);font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 0 #0009;cursor:pointer;
 background:linear-gradient(#ffd23f,#f7a400);box-shadow:0 5px 0 #a35f00,0 8px 14px #0005,inset 0 2px 0 #fff8;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a35f00}
.btn.blue{background:linear-gradient(#5ec4ff,#2a86e8);box-shadow:0 5px 0 #13509a,0 8px 14px #0005,inset 0 2px 0 #fff8}
.btn.green{background:linear-gradient(#7ee05a,#3aa52c);box-shadow:0 5px 0 #1e6a17,0 8px 14px #0005,inset 0 2px 0 #fff8}
.btn.red{background:linear-gradient(#ff7a6a,#e0392b);box-shadow:0 5px 0 #8e1b12,0 8px 14px #0005,inset 0 2px 0 #fff8}
.btn.grey{background:linear-gradient(#b9c0cc,#7d8696);box-shadow:0 5px 0 #4a5160,inset 0 2px 0 #fff8}
.btn.big{font-size:30px;padding:16px 10px;border-radius:18px}
.btn:disabled{filter:grayscale(1) brightness(.8)}
#tabs{position:absolute;left:0;right:0;bottom:0;display:none;gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(#24427a,#122650);border-top:3px solid #0a1838;z-index:5}
#tabs.on{display:flex}
#tabs button{flex:1;border:0;border-radius:12px;background:#2c58a6;color:#fff;font-family:var(--f);font-weight:900;font-size:12px;padding:6px 2px;text-shadow:0 1px 0 #000;box-shadow:inset 0 -3px 0 #0005}
#tabs button.on{background:linear-gradient(#ffd23f,#f7a400);box-shadow:inset 0 -3px 0 #a35f00}
#tabs b{display:block;font-size:20px;line-height:1.1}
.arena{position:relative;border-radius:22px;overflow:hidden;min-height:180px;flex:1;max-height:340px;border:4px solid #0b2252;box-shadow:0 6px 0 #0b2252}
.arena canvas{position:absolute;inset:0;width:100%;height:100%}
.arena .lbl{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:24px}
.arena .lbl small{display:block;font-size:13px;opacity:.9}
.chests{display:flex;gap:6px;margin-top:10px}
.chest{flex:1;height:84px;border-radius:12px;background:#0b2252aa;border:2px solid #0006;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;font-weight:900;padding:3px;text-shadow:0 1px 0 #000;overflow:hidden}
.chest img{width:52px;height:46px;position:absolute;top:4px;left:50%;transform:translateX(-50%)}
.chest.ready{background:linear-gradient(#7ee05a,#3aa52c)}
.chest.unl{background:linear-gradient(#5ec4ff,#2a86e8)}
.row2{display:flex;gap:8px;margin-top:10px}.row2>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{position:relative;border-radius:10px;padding:3px;background:#5d7fb8;border:3px solid #9bb3d9;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain}
.card .cost{position:absolute;left:-1px;top:-1px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f39cff,#b01cc8);border:2px solid #4b0a58;font-size:13px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 #000}
.card .lv{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:11px;background:#0008;padding:1px 0}
.card.rare{border-color:#ffb547;background:#c27a24}.card.epic{border-color:#e46cff;background:#7a2f9a}.card.legendary{border-color:#7ff;background:linear-gradient(135deg,#2bb,#a3f,#fc4)}
.card.locked{filter:grayscale(1) brightness(.5)}
.card.sel{outline:4px solid #ffe14a;transform:scale(1.04)}
.card .up{position:absolute;right:2px;top:2px;background:#3aa52c;border-radius:6px;font-size:10px;padding:1px 4px}
.sec{background:#0b225288;border-radius:14px;padding:8px;margin-top:8px}
.sec h3{margin:0 0 6px;font-size:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 2px;border-bottom:1px solid #fff2;font-size:14px;font-weight:800}
.opt:last-child{border-bottom:0}
.opt .seg{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.seg button{border:0;border-radius:8px;padding:6px 8px;font-family:var(--f);font-weight:900;font-size:12px;background:#2c58a6;color:#fff;box-shadow:inset 0 -2px 0 #0005}
.seg button.on{background:linear-gradient(#ffd23f,#f7a400);color:#3a2300;text-shadow:none}
.opt small{display:block;font-size:11px;opacity:.75;font-weight:700}
#modal{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#mbox{background:linear-gradient(#4d8ef0,#1f56b8);border:4px solid #0b2252;border-radius:20px;padding:14px;width:min(420px,100%);max-height:92%;overflow:auto;box-shadow:0 8px 0 #0b2252;text-align:center}
#mbox p{font-weight:800;font-size:15px;margin:6px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13px;text-align:left;margin:8px 0}
.stats div{background:#0b225288;border-radius:8px;padding:4px 7px}
.prog{height:14px;border-radius:7px;background:#0b2252;overflow:hidden;margin:4px 0;position:relative;font-size:10px}
.prog i{display:block;height:100%;background:linear-gradient(#7ee05a,#3aa52c)}
.prog span{position:absolute;inset:0;text-align:center;line-height:14px}
.chal{display:flex;gap:8px;align-items:center;background:#0b225288;border-radius:14px;padding:8px;margin-top:8px}
.chal .ic{font-size:34px;width:46px;text-align:center}
.chal .tx{flex:1;font-size:13px;font-weight:700}.chal .tx b{display:block;font-size:17px}
#pause{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:15}
#pause.on{display:flex}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#000c;border-radius:12px;padding:8px 14px;font-weight:900;display:none;z-index:30;text-align:center}
.reveal{font-size:22px;margin:8px 0}
.reveal img{width:110px;height:146px;display:block;margin:6px auto;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.shk{animation:shake .25s infinite}
input.nm{font-family:var(--f);font-size:15px;border-radius:8px;border:2px solid #0b2252;padding:5px;width:130px}
</style>
</head>

<div id="modal"><div id="mbox"></div></div>

  const go=document.createElement('button');go.className='btn green';go.textContent='Continue';go.onclick=()=>playChal(ch);const q=document.createElement('button');q.className='btn grey';q.textContent='Quit run';q.onclick=()=>{SAVE.chal=null;persist();renderChal();};r.append(go,q);d.appendChild(r);B.appendChild(d);}
 for(const ch of CHALLENGES){const d=document.createElement('div');d.className='chal';d.innerHTML='<div class="ic">'+ch.ic+'</div><div class="tx"><b>'+ch.n+'</b>'+ch.d+'<br><small>🪙40 per win · Golden chest at 5 wins</small></div>';
  const b=document.createElement('button');b.className='btn';b.textContent='Play';b.onclick=()=>{au();if(!SAVE.chal||SAVE.chal.id!==ch.id){SAVE.chal={id:ch.id,w:0,l:0};persist();}playChal(ch);};d.appendChild(b);B.appendChild(d);}}
function playChal(ch){if(ch.draft){startDraft(ch);return;}const m=ch.mod||{};let my=SAVE.decks[SAVE.deck].slice(),th=aiDeck(DECKABLE);
 if(m.cheap){const pool=DECKABLE.filter(k=>CARDS[k].c<=3);my=shuffle(pool).slice(0,8);th=shuffle(pool).slice(0,8);}
 if(m.forceOgre){if(!my.includes('ogre'))my[0]='ogre';if(!th.includes('ogre'))th[0]='ogre';}
 startBattle({kind:'chal',chal:ch.id,mode:'1v1',rules:Object.assign(baseRules(SET),{elixRate:m.elixRate||1,suddenAll:!!m.sudden,towerMul:m.towerMul||1,rage:m.rage||1,ogreAllies:m.ogreAllies!==undefined?m.ogreAllies:true,emotes:false,taunts:true}),
  players:[{side:0,ctl:'human',name:SAVE.name,deck:my,lv:eqLv(9),tlv:9},{side:1,ctl:'ai',name:pick(AI_NAMES),deck:th,lv:eqLv(9),tlv:9,diff:'hard'}]});}
// ===== draft =====
let DR=null;
function startDraft(ch){const pool=shuffle(DECKABLE);DR={ch,pool,mine:[],theirs:[],round:0};showScreen('draft');draftStep();}
function draftStep(){if(DR.mine.length>=8){const ch=DR.ch;startBattle({kind:'chal',chal:ch.id,mode:'1v1',rules:Object.assign(baseRules(SET),{taunts:true}),players:[{side:0,ctl:'human',name:SAVE.name,deck:DR.mine,lv:eqLv(9),tlv:9},{side:1,ctl:'ai',name:pick(AI_NAMES),deck:DR.theirs,lv:eqLv(9),tlv:9,diff:'hard'}]});return;}
 const a=DR.pool[DR.round*2],b=DR.pool[DR.round*2+1];$('drTitle').textContent='Draft '+(DR.mine.length+1)+' / 8';const P=$('drPick');P.innerHTML='';
 for(const [k,o] of [[a,b],[b,a]]){const e=cardEl(k,{});e.style.maxWidth='150px';e.style.margin='0 auto';e.onclick=()=>{sfx('card');DR.mine.push(k);DR.theirs.push(o);DR.round++;draftStep();};const w=document.createElement('div');w.appendChild(e);const n=document.createElement('div');n.className='t';n.style.textAlign='center';n.textContent=cardName(k,'classic')+' 💧'+CARDS[k].c;w.appendChild(n);P.appendChild(w);}
 const fill=(id,arr)=>{const g=$(id);g.innerHTML='';for(const k of arr)g.appendChild(cardEl(k,{}));};fill('drMine',DR.mine);fill('drTheirs',DR.theirs);}
// ===== battle starters =====
function eqLv(l){const o={};for(const k in CARDS)o[k]=l;return o;}
function myLv(){const o={};for(const k in SAVE.cards)o[k]=SAVE.cards[k].lvl;return o;}
function aiDeck(pool){pool=pool.filter(k=>!CARDS[k].token);const sp=shuffle(pool.filter(k=>CARDS[k].spell&&CARDS[k].d>0)),tk=shuffle(pool.filter(k=>TANKS[k]&&!CARDS[k].spell)),air=shuffle(pool.filter(k=>CARDS[k].t==='a'&&!CARDS[k].spell));
 const d=new Set();if(tk[0])d.add(tk[0]);if(sp[0])d.add(sp[0]);if(air[0])d.add(air[0]);if(air[1])d.add(air[1]);for(const k of shuffle(pool)){if(d.size>=8)break;d.add(k);}return [...d].slice(0,8);}
function baseRules(O){return {weather:!!O.weather,ghosts:!!O.ghosts,mercs:!!O.mercs,towerUp:!!O.towerUp,mounts:!!O.mounts,bosses:!!O.bosses,kingTaunts:!!O.kingTaunts};}
function diffFor(a){return a===0?'easy':a<=2?'normal':a<=5?'hard':'brutal';}
function startLadder(mode){const a=arenaIdx(SAVE.trophies),pool=DECKABLE.filter(unlocked),lv=myLv(),avg=Math.round(SAVE.decks[SAVE.deck].reduce((s,k)=>s+(lv[k]||1),0)/8);
 const ailv=eqLv(clamp(avg+(rnd()<0.3?1:0)-(rnd()<0.3?1:0),1,MAXLV)),tl=clamp(Math.max(avg,a+1),1,MAXLV),d=diffFor(a);
 const pl=[{side:0,ctl:'human',name:SAVE.name,deck:SAVE.decks[SAVE.deck],lv,tlv:tl}];
 if(mode==='2v2'){pl.push({side:0,ctl:'ai',name:'Buddy '+pick(['Tough','Fault','Bambi','Dale']),deck:aiDeck(pool),lv:ailv,tlv:tl,diff:d==='easy'?'normal':d,lane:1});
  pl.push({side:1,ctl:'ai',name:pick(AI_NAMES),deck:aiDeck(pool),lv:ailv,tlv:tl,diff:d,lane:0});pl.push({side:1,ctl:'ai',name:pick(AI_NAMES),deck:aiDeck(pool),lv:ailv,tlv:tl,diff:d,lane:1});}
 else pl.push({side:1,ctl:'ai',name:pick(AI_NAMES),deck:aiDeck(pool),lv:ailv,tlv:tl,diff:d});
 startBattle({kind:mode==='2v2'?'2v2':'ladder',mode,rules:Object.assign(baseRules(SET),{}),players:pl});}
function start2P(){const d1=SAVE.decks[SAVE.deck],d2=SAVE.decks[(SAVE.deck+1)%3];
 startBattle({kind:'2p',mode:'2p',rules:Object.assign(baseRules(SET),{}),players:[{side:0,ctl:'human',name:'Blue',deck:d1,lv:eqLv(9),tlv:9},{side:1,ctl:'human',name:'Red',deck:d2,lv:eqLv(9),tlv:9}]});}
function startCustom(){const O=SAVE.custom,all=DECKABLE;const lv=O.levels==='equal'?eqLv(9):myLv(),tl=O.levels==='equal'?9:clamp(Math.round(Object.values(myLv()).reduce((a,b)=>a+b,0)/Math.max(1,Object.keys(SAVE.cards).length)),1,9);
 const mine=O.decks==='random'?aiDeck(all):SAVE.decks[SAVE.deck];const opp=()=>O.decks==='mirror'?mine.slice():aiDeck(all);
 const R=Object.assign(baseRules(O),{theme:O.theme,matchLen:O.matchLen,dbl:!!O.dbl,otLen:O.otLen,tripleOT:!!O.tripleOT,suddenAll:!!O.suddenAll,tiebreak:!!O.tiebreak,elixRate:O.elixRate,startEl:O.startEl,kingAct:!!O.kingAct,towerMul:O.towerMul,
  emotes:!!O.emotes,taunts:!!O.taunts,ogreAllies:!!O.ogreAllies,ogreCd:O.ogreCd,stare:O.stare,rage:O.rage});
 let pl;const ai=(s,n,lane)=>({side:s,ctl:'ai',name:n||pick(AI_NAMES),deck:opp(),lv,tlv:tl,diff:O.diff,lane});
 if(O.mode==='2p')pl=[{side:0,ctl:'human',name:'Blue',deck:mine,lv,tlv:tl},{side:1,ctl:'human',name:'Red',deck:opp(),lv,tlv:tl}];
 else if(O.mode==='2v2')pl=[{side:0,ctl:'human',name:SAVE.name,deck:mine,lv,tlv:tl},ai(0,'Buddy Tough',1),ai(1,null,0),ai(1,null,1)];
 else if(O.mode==='watch')pl=[ai(0,'Blue Bot'),ai(1,'Red Bot')];
 else pl=[{side:0,ctl:'human',name:SAVE.name,deck:mine,lv,tlv:tl},ai(1)];
 startBattle({kind:'custom',mode:O.mode==='2p'?'2p':O.mode==='2v2'?'2v2':'1v1',rules:R,players:pl,gore:O.gore,adult:!!O.adult,light:!!O.light,shake:O.shake,weather:O.weatherKind==='random'?null:O.weatherKind});}
let prevShake=null;
function startBattle(cfg){closeModal();if(cfg.shake){prevShake=SET.shake;SET.shake=cfg.shake;}
 newMatch(cfg);M.arena=arenaIdx(SAVE.trophies);M.watch=cfg.players.every(p=>p.ctl==='ai');
 drags.clear();emoteOpen=-1;rainDrops=null;resize();showScreen('battle');}
$('bBattle').onclick=()=>{au();startLadder('1v1');};$('b2v2').onclick=()=>{au();startLadder('2v2');};$('b2p').onclick=()=>{au();start2P();};
function pauseGame(on){if(!M)return;M.paused=on;$('pause').classList.toggle('on',on);}
$('bResume').onclick=()=>pauseGame(false);
$('bQuit').onclick=()=>{pauseGame(false);if(!M||M.over)return;const hs=humans();const s=hs.length===1?hs[0].side:0;M.crowns[1-s]=Math.max(M.crowns[1-s],M.crowns[s]+1);endMatch();};
function onMatchEnd(m){if(m!==M)return;const w=m.winner,hs=m.players.filter(p=>p.ctl==='human'),me=hs[0]?hs[0].side:0;let html='',res=w===-1?'d':w===me?'w':'l';
 if(prevShake){SET.shake=prevShake;prevShake=null;}
 const title=m.kind==='2p'?(w===-1?'DRAW':(w===0?'BLUE':'RED')+' WINS!'):res==='w'?'VICTORY!':res==='l'?'DEFEAT':'DRAW';
 if(m.kind==='ladder'||m.kind==='2v2'){const a=arenaIdx(SAVE.trophies),floor=ARENAS[a].t;let dt=0,gold=0,ch=null;
  if(res==='w'){dt=m.kind==='2v2'?0:rr(28,32)|0;gold=m.kind==='2v2'?15:10+a*5;ch=addChest();SAVE.stat.w++;}else if(res==='l'){dt=m.kind==='2v2'?0:-Math.min(rr(24,28)|0,Math.max(0,SAVE.trophies-floor));SAVE.stat.l++;}else SAVE.stat.d++;
  SAVE.trophies+=dt;SAVE.maxTro=Math.max(SAVE.maxTro,SAVE.trophies);SAVE.gold+=gold;SAVE.crowns+=m.crowns[me];persist();
  html='<p>👑 '+m.crowns[me]+' crowns</p>'+(m.kind==='2v2'?'<p>2v2 is just for fun: no trophies lost</p>':'<p>🏆 '+(dt>=0?'+':'')+dt+' → '+SAVE.trophies+'</p>')+(gold?'<p>🪙 +'+gold+'</p>':'')+(ch?'<p><img src="'+chestImg(ch)+'" style="width:64px"><br>'+CHESTS[ch].n+'!</p>':res==='w'?'<p>Chest slots full!</p>':'');}
 else if(m.kind==='chal'&&SAVE.chal){const r=SAVE.chal;if(res==='w'){r.w++;SAVE.gold+=40;}else if(res==='l')r.l++;let msg='Wins '+r.w+'/5 · Losses '+r.l+'/3';
  if(r.w>=5){msg+='<br>🏅 CHALLENGE COMPLETE! Golden chest!';SAVE.chal=null;persist();setTimeout(()=>openChest('gold'),400);}else if(r.l>=3){msg+='<br>Run over. Try again!';SAVE.chal=null;}persist();html='<p>'+msg+'</p>'+(res==='w'?'<p>🪙 +40</p>':'');}
 else html='<p>👑 '+m.crowns[0]+' – '+m.crowns[1]+' 👑</p>';
 modal('<h2>'+title+'</h2>'+html,[['OK','green',()=>{M=null;showScreen(m.kind==='chal'?'chal':m.kind==='custom'?'custom':'home');}]]);}
// ===== main loop =====
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-lastT)/1000;lastT=now;if(dt>0.25)dt=0.25;if(document.hidden)return;
 fpsS.n++;fpsS.t+=dt;if(fpsS.t>=1){fpsS.v=fpsS.n;fpsS.n=0;fpsS.t=0;}
 if(screen==='battle'&&M){if(window.__autoplay)for(const p of M.players)if(p.ctl==='human'){p.ctl='ai';p.wasHuman=1;LY=null;}
  let left=Math.min(dt,0.1);while(left>0){const s=Math.min(left,1/30);update(s);left-=s;}render();}
 else if(screen==='home'){homeAcc+=dt;if(homeAcc>=1/30){drawHomePrev(homeAcc);homeAcc=0;}if((homeTick+=dt)>1){homeTick=0;tickHomeTimers();}}}
let homeAcc=0,homeTick=0;
function tickHomeTimers(){const now=Date.now();document.querySelectorAll('#chests .chest').forEach((d,i)=>{const c=SAVE.chests[i];if(!c)return;const s=d.querySelector('span');if(!s)return;if(c.st==='unl'){if(now>=c.at){c.st='ready';d.className='chest ready';s.textContent='OPEN!';}else s.textContent=fmtT((c.at-now)/1000);}});
 const fr=SAVE.freeAt-now;$('bFree').textContent=fr<=0?'🎁 Free chest READY':'🎁 Free in '+fmtT(fr/1000);}
addEventListener('resize',()=>{resize();});
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('.scr,#mbox')))e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&M&&!M.over&&screen==='battle'&&!M.watch&&humans().length)pauseGame(true);});
// test hooks
window.ROYALE={get M(){return M;},atlasList:()=>ATLQ,get dbg(){return {cvLog:CVLOG.slice(0,40),cvMid:CVMID,cvTotal:CVN,atlases:ATLQ.length,atlasLeft:ATLQ.reduce((n,a)=>n+a.left,0)};},art:{mix,lt,dk,spriteFor,cardFace,towerSprite,boomFrame,rubbleSprite,drawChar,poseFor,updRig,rigOf,corpsePose,ARCH,setFixDt:d=>{FIXDT=d;},renderNow:()=>render()},SAVE:()=>SAVE,SET,CARDS,showScreen,startLadder,start2P,startCustom,startBattle,playChal,CHALLENGES,
 sim(sec,step){step=step||1/30;for(let t=0;t<sec&&M;t+=step){update(step);if(M&&M.over&&M.endT>0.1)break;}return M&&{over:M.over,winner:M.winner,crowns:M.crowns.slice(),t:M.time,units:M.units.length};},
 dbgIn:()=>{layout();return {LY:{T:LY.T,huds:LY.huds.map(h=>[h.x,h.y,h.w,h.h])},drags:drags.size,slots:LY.huds[0]&&hudSlots(LY.huds[0])};},autoplay(on){window.__autoplay=!!on;if(M&&on)for(const p of M.players)if(p.ctl==='human'){p.ctl='ai';p.wasHuman=1;LY=null;}},render:()=>render(),playCard:(pi,s,x,y)=>playCard(M.players[pi],s,x,y),get screen(){return screen;},openChest,renderCards,swap:k=>{swapK=k;}};
resize();showScreen('home');requestAnimationFrame(frame);

})();
