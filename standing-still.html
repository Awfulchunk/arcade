.td{position:absolute;inset:0;z-index:70;background:#0d1410;color:#eef1f4;font:14px/1.3 system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.td canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.td button{font:700 14px system-ui;color:#eef1f4;background:#1c2a22;border:1px solid #3a5a46;border-radius:12px;min-height:46px;padding:0 12px}
.td button:disabled{opacity:.4}
.td .pri{background:linear-gradient(180deg,#4fae6e,#2f8a4e);border:0;color:#04140a;font-weight:900}
.td .danger{background:#4a1d1d;border-color:#a44}
.td .top{position:absolute;left:0;right:0;top:0;padding:max(52px,env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:8px;pointer-events:none}
.td .top>*{pointer-events:auto}
.td .chip{background:#0d1410d9;border:1px solid #3a5a46;border-radius:12px;padding:6px 10px;font-weight:900;font-size:16px;white-space:nowrap}
.td .grow{flex:1}

.td .ctx{position:absolute;left:8px;right:8px;z-index:3;background:#0d1410f0;border:1px solid #3a5a46;border-radius:14px;padding:8px;box-shadow:0 6px 24px #000a}
