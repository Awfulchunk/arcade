<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121633">
<title>8-Ball Pool</title>
<style>
:root{--bg:#121633;--bg2:#1a1f45;--card:#1f2652;--line:#323c7a;--txt:#e6e9f5;--dim:#9aa3d3;--acc:#6f7dff;--gold:#ffcf4a;--red:#ff5a6a;--grn:#4cd98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0c1c;color:var(--txt);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
#sa{position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#menu{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;touch-action:pan-y;background:linear-gradient(180deg,rgba(14,18,48,.93),rgba(10,12,32,.9));padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 12px)}
#menu.show{display:block}
#menu>*{max-width:560px;margin-left:auto;margin-right:auto}
.mtop{display:flex;align-items:center;gap:10px;padding:8px 0 6px;position:sticky;top:-6px;z-index:2;background:linear-gradient(180deg,rgba(14,18,48,1) 70%,rgba(14,18,48,0))}
.mtop h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.06em;background:linear-gradient(90deg,#9fb0ff,#c79bff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.mtop .sp{flex:1}.coins{font-weight:900;font-size:14px;color:var(--gold);background:rgba(31,38,82,.9);border:1px solid var(--line);border-radius:11px;padding:7px 10px;white-space:nowrap}
.ib{min-width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(31,38,82,.9);font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0 10px}
.ib.arc{font-size:13.5px}
.logo{display:block;width:100%;height:120px;margin:4px 0 2px}
.mlist{display:flex;flex-direction:column;gap:10px}
.mb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#252d66,#1b214c);box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.mb:active,.opp:active,.mode:active,.item:active,.trick:active{transform:scale(.98)}
.mb b{font-size:17px;font-weight:900;letter-spacing:.04em}.mb small{font-size:12.5px;color:var(--dim);font-weight:700;line-height:1.3}
.mb.gold{border-color:#c89a2a;background:linear-gradient(180deg,#5a4a1a,#3a2e10)}.mb.gold small{color:#f0dca0}
.mrow{display:flex;gap:8px}.mb.sm{align-items:center;padding:12px 6px}.mb.sm b{font-size:13px}
.msec{margin:16px 2px 6px;font-size:12px;font-weight:900;letter-spacing:.1em;color:#9aa6e8;text-transform:uppercase}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:64px;padding:10px 6px;border-radius:12px;border:1px solid #3a4378;background:#283063;color:#cfd5f3;font-weight:900;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-size:10.5px;font-weight:700;opacity:.8}.seg button.on{background:linear-gradient(180deg,#5b6cff,#4253d6);border-color:#8792ff;color:#fff}
.seg.lv button.on{background:linear-gradient(180deg,var(--c),#2a3160);border-color:var(--c)}
.seg.sm button{padding:8px 4px;font-size:12px;min-width:54px}
.mnote{margin:10px 2px;padding:10px 12px;border-radius:12px;background:#20274a;border:1px solid #2b3360;color:#c4cbef;font-weight:700;font-size:13px;line-height:1.35}
.opps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:#1d2350;cursor:pointer;text-align:center}
.opp.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,207,74,.3)}.opp canvas{width:64px;height:64px}.opp b{font-size:15px;font-weight:900}.opp small{font-size:11.5px;color:var(--dim);font-weight:700;line-height:1.25}.opp i{font-style:normal;font-size:11px;font-weight:900;color:var(--gold)}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid #5b68e0;background:linear-gradient(180deg,#5b6cff,#4253d6);color:#fff;font-weight:900;font-size:16px;letter-spacing:.03em;cursor:pointer;text-align:center}
.btn.big{padding:16px;font-size:18px;margin-top:16px}.btn.alt{background:#283063;border-color:#3a4378;color:#cfd5f3}.btn.red{background:linear-gradient(180deg,#e0485a,#b0303e);border-color:#ff7a8a}
.names{display:flex;gap:8px;align-items:center}.names input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #3a4378;background:#161b3a;color:#fff;font:inherit;font-weight:800;font-size:16px;-webkit-user-select:text;user-select:text}.names span{font-weight:900;color:var(--dim)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#1d2350;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode.on{border-color:var(--gold);background:#2a2f5e}.mode b{font-size:13.5px;font-weight:900}.mode small{font-size:11px;color:var(--dim);font-weight:700;line-height:1.25}
.copt{margin:6px 0;padding:8px 10px;border-radius:12px;background:#1b2140;border:1px solid #2b3360}.copt>span{display:block;font-size:13px;font-weight:900;margin:0 0 6px 2px}
.cut .seg{margin-bottom:6px}
.tricks{display:flex;flex-direction:column;gap:8px}.trick{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#1d2350;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.trick b{font-size:15px;font-weight:900}.trick small{font-size:12px;color:var(--dim);font-weight:700}.trick i{font-style:normal;font-size:11.5px;color:var(--gold);font-weight:900}.trick.done{border-color:#3a8a5a}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;flex-direction:column;gap:3px;text-align:left;padding:8px;border-radius:14px;border:1px solid var(--line);background:#1d2350;cursor:pointer}
.item canvas{width:100%;aspect-ratio:2/1;border-radius:10px;background:#0f1328}.item b{font-size:13.5px;font-weight:900}.item small{font-size:11px;color:var(--dim);font-weight:700;line-height:1.25}.item i{font-style:normal;font-size:12px;color:var(--gold);font-weight:900}.item.eq{border-color:var(--gold)}
.stats{border-radius:14px;background:#1b2140;border:1px solid #2b3360;padding:6px 12px}.srow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #262e58;font-size:14px;font-weight:700}.srow b{font-weight:900}.srow i{font-style:normal}
.pausebox,.pass{margin-top:max(40px,12vh)!important;padding:20px;border-radius:20px;background:linear-gradient(180deg,#232a5c,#191e44);border:1px solid #3a4486;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pausebox h2{margin:0 0 6px;text-align:center;font-size:24px;font-weight:900;letter-spacing:.05em}
.pass{text-align:center}.pbig{font-size:26px;font-weight:900;letter-spacing:.06em;color:var(--gold)}.pname{font-size:34px;font-weight:900;margin:8px 0}
.rulesTxt{padding:4px 14px;border-radius:14px;background:#1b2140;border:1px solid #2b3360;font-size:14px;font-weight:600;line-height:1.45;color:#d4d9f5}
table.res{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}table.res th{color:var(--dim);font-weight:800;font-size:11px;text-align:right;padding:4px}table.res td{padding:7px 4px;text-align:right;font-weight:800;border-top:1px solid #2b3360}table.res td:first-child,table.res th:first-child{text-align:left}table.res tr.w td{color:var(--gold)}
.coinwin{text-align:center;font-size:28px;font-weight:900;color:var(--gold);margin:10px 0;text-shadow:0 0 18px rgba(255,207,74,.5)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translateX(-50%);z-index:30;background:rgba(20,24,56,.94);border:1px solid #4a56a8;border-radius:12px;padding:9px 14px;font-weight:900;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sa"></div>
<div id="menu"></div>
<div id="toast"></div>
<script>
// ===== SETUI: shared collapsible settings panel (Tough & J's Arcade, big-list phase 1) =====
// Used by every latest game. Categories (tap to expand), alphabetical categories + settings,
// a kid-simple line under every setting, small preview thumbnails, fps cap + resolution scale.
var SETUI=(function(){
 'use strict';
 var CSS='.su{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#e6e9f5;text-align:left;-webkit-user-select:none;user-select:none}'+
 '.su *{box-sizing:border-box}'+
 '.su .su-arc{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;padding:11px 12px;border-radius:14px;border:1px solid #4b5694;background:linear-gradient(180deg,#34407e,#272f63);color:#fff;font:inherit;font-weight:900;font-size:15px;letter-spacing:.03em;cursor:pointer}'+
 '.su .su-cat{margin:0 0 9px;border-radius:16px;background:#1b2140;border:1px solid #303a6e;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.25)}'+
 '.su .su-hd{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:0;background:linear-gradient(90deg,#2c3778,#3a2c6e);color:#fff;font:inherit;font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-align:left;min-height:50px}'+
 '.su .su-hd .su-ic{width:30px;height:30px;flex:none;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:0}'+
 '.su .su-hd .su-n{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.04em;color:#c9cff0;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;text-transform:none}'+
 '.su .su-hd .su-ch{flex:none;width:12px;height:12px;border-right:3px solid #c9cff0;border-bottom:3px solid #c9cff0;transform:rotate(-45deg);transition:transform .2s;margin:0 4px 0 2px}'+
 '.su .su-cat.open .su-hd .su-ch{transform:rotate(45deg)}'+
 '.su .su-body{display:none;padding:6px 10px 10px;background:#161b34}'+
 '.su .su-cat.open .su-body{display:block}'+
 '.su .su-sub{margin:12px 4px 4px;font-size:11.5px;font-weight:900;letter-spacing:.08em;color:#9aa6e8;text-transform:uppercase}'+
 '.su .su-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 10px;margin:6px 0 0;border-radius:12px;background:#20274a;border:1px solid #2b3360}'+
 '.su .su-row .su-tx{flex:1 1 140px;min-width:0}'+
 '.su .su-row .su-l{font-size:14.5px;font-weight:800;color:#f1f3fb;line-height:1.2}'+
 '.su .su-row .su-d{font-size:12px;font-weight:600;color:#a7aed0;line-height:1.3;margin-top:2px}'+
 '.su .su-row canvas.su-th{width:46px;height:32px;border-radius:7px;flex:none;background:#0f1328;border:1px solid #39427a}'+
 '.su .su-ctl{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:5px;align-items:center}'+
 '.su .su-row.narrow .su-ctl{flex:0 0 auto}'+
 '.su .su-ctl button{flex:1 0 auto;min-width:46px;padding:8px 9px;border-radius:10px;border:1px solid #3a4378;background:#283063;color:#cfd5f3;font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;cursor:pointer}'+
 '.su .su-ctl button.on{background:linear-gradient(180deg,#5b6cff,#4253d6);border-color:#8792ff;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}'+
 '.su .su-ctl input[type=range]{flex:1;min-width:120px;accent-color:#6f7dff;height:28px}'+
 '.su .su-ctl b.su-v{min-width:58px;text-align:right;font-size:13px;color:#fff}'+
 '.su .su-btn{width:100%;margin-top:8px;padding:10px;border-radius:11px;border:1px solid #5a4b9a;background:#3b2f73;color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}'+
 '.su .su-note{margin:6px 2px 10px;padding:9px 11px;border-radius:12px;background:#2a2050;border:1px solid #4a3a86;color:#e2dcff;font-size:12.5px;font-weight:700;line-height:1.3}'+
 '.su .su-fold{display:flex;gap:8px;margin:0 0 9px}.su .su-fold button{flex:1;padding:7px;border-radius:10px;border:1px solid #303a6e;background:#1b2140;color:#aab3e6;font:inherit;font-size:12px;font-weight:800;cursor:pointer}';
 function css(){if(document.getElementById('su-css'))return;var s=document.createElement('style');s.id='su-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
 // ---------- storage ----------
 function lget(k){try{return localStorage.getItem(k);}catch(e){return null;}}
 function lset(k,v){try{localStorage.setItem(k,v);}catch(e){}}
 // ---------- perf runtime: fps cap + resolution scale (works in any game) ----------
 var PERF={fps:60,res:100,game:''},resT=0;var realDPR=window.devicePixelRatio||1;
 function perfLoad(game){PERF.game=game;try{var o=JSON.parse(lget('su.perf.'+game)||'{}');if(o.fps===30||o.fps===60)PERF.fps=o.fps;if(o.res>=40&&o.res<=100)PERF.res=o.res;}catch(e){}
   var raf=window.requestAnimationFrame.bind(window),lastOK=-1e9,curT=-1,curOK=true;
   window.requestAnimationFrame=function(cb){return raf(function tick(t){if(PERF.fps>=60)return cb(t);
     if(t!==curT){curT=t;curOK=(t-lastOK)>=(1000/PERF.fps)-4;if(curOK)lastOK=t;}
     if(curOK)return cb(t);raf(tick);});};}
 function perfSave(){lset('su.perf.'+PERF.game,JSON.stringify({fps:PERF.fps,res:PERF.res}));}
 function perfSet(k,v){PERF[k]=v;perfSave();if(k==='res'){clearTimeout(resT);resT=setTimeout(function(){try{window.dispatchEvent(new Event('resize'));}catch(e){}},120);}}
 // standard items every game gets in its Graphics category
 function perfItems(){return[
  {k:'_res',l:'Resolution',d:'Slide left = a bit blurrier but faster and cooler on old phones.',t:'range',min:40,max:100,step:5,fmt:function(v){return v+'%';},get:function(){return PERF.res;},set:function(v){perfSet('res',v);},th:'res'},
  {k:'_fps',l:'Frame rate limit',d:'60 is smoothest. 30 saves battery and stops stutter on slow phones.',t:'opt',o:[[60,'60 FPS'],[30,'30 FPS']],get:function(){return PERF.fps;},set:function(v){perfSet('fps',v);},th:'fps'}];}
 // ---------- preview thumbnails (tiny canvases drawn from the current value) ----------
 var TH={};
 function lvl(v){if(v===false||v===0||v==='off'||v==='none')return 0;if(v==='lite'||v==='low'||v==='few'||v==='simple'||v==='some')return 1;if(v==='med'||v==='normal'||v==='medium'||v===true||v===1||v==='on'||v==='auto')return 2;return 3;}
 TH.res=function(g,w,h,v){var px=v>=100?1:v>=85?2:v>=70?3:5;for(var y=0;y<h;y+=px)for(var x=0;x<w;x+=px){var dx=x+px/2-w/2,dy=y+px/2-h/2,in1=dx*dx+dy*dy<120;g.fillStyle=in1?'#ffcf4a':((x/px+y/px)&1?'#1d2550':'#232c5c');g.fillRect(x,y,px,px);}};
 TH.fps=function(g,w,h,v){var n=v>=60?7:4;for(var i=0;i<n;i++){g.globalAlpha=0.25+0.75*i/(n-1);g.fillStyle='#7fd0ff';g.beginPath();g.arc(6+i*(w-12)/(n-1),h/2+Math.sin(i*0.9)*5,3.2,0,6.3);g.fill();}g.globalAlpha=1;};
 TH.particles=function(g,w,h,v){var n=[0,6,16,34][lvl(v)];for(var i=0;i<n;i++){var a=i*2.4,r=3+(i*7%12);g.fillStyle=i%3?'#ffb52e':'#ff6a3a';g.fillRect(w/2+Math.cos(a)*r*1.4,h/2+Math.sin(a)*r,2,2);}g.fillStyle='#fff';g.beginPath();g.arc(w/2,h/2,2.5,0,6.3);g.fill();};
 TH.shadows=function(g,w,h,v){if(lvl(v)){g.fillStyle='rgba(0,0,0,.6)';g.beginPath();g.ellipse(w/2+5,h-7,12,4,0,0,6.3);g.fill();}g.fillStyle='#6f7dff';g.fillRect(w/2-8,6,16,16);g.fillStyle='#9aa6ff';g.fillRect(w/2-8,6,16,4);};
 TH.gore=function(g,w,h,v){var n=[0,2,5,9][lvl(v)];g.fillStyle='#cfd5f3';g.beginPath();g.arc(w/2,h/2-3,4,0,6.3);g.fill();g.fillRect(w/2-3,h/2,6,8);for(var i=0;i<n;i++){g.fillStyle='#d01a1a';g.beginPath();g.arc(w/2+Math.cos(i*1.9)*(7+i),h/2+Math.sin(i*1.9)*(4+i*0.6)+3,1.6+(i%3)*0.6,0,6.3);g.fill();}};
 TH.decals=function(g,w,h,v){var n=typeof v==='number'?(v===0?5:Math.min(8,Math.max(1,Math.round(v/(v>20?18:2.5))))):[0,2,5,8][lvl(v)];for(var i=0;i<n;i++){g.fillStyle=i%2?'#5a1414':'#3a2a1a';g.beginPath();g.ellipse(6+(i*13)%(w-10),6+(i*9)%(h-10),5,3,i,0,6.3);g.fill();}};
 TH.shake=function(g,w,h,v){var a=typeof v==='number'?v/100:[0,0.4,0.7,1][lvl(v)];g.strokeStyle='#ffcf4a';g.lineWidth=2;for(var i=a>0?2:0;i>=0;i--){g.globalAlpha=i?0.3:1;g.strokeRect(w/2-9+i*a*4,h/2-7-i*a*2,18,14);}g.globalAlpha=1;};
 TH.anim=function(g,w,h,v){var L=lvl(v);g.strokeStyle='#cfd5f3';g.lineWidth=2;g.lineCap='round';g.beginPath();g.arc(w/2,7,3.5,0,6.3);g.moveTo(w/2,11);g.lineTo(w/2,19);g.moveTo(w/2,19);g.lineTo(w/2-(L>1?6:2),h-4);g.moveTo(w/2,19);g.lineTo(w/2+(L>1?6:2),h-4);g.moveTo(w/2,13);g.lineTo(w/2+(L>1?8:5),L>1?10:17);g.moveTo(w/2,13);g.lineTo(w/2-5,17);g.stroke();if(L>1){g.strokeStyle='#7fd0ff';g.globalAlpha=.6;g.beginPath();g.moveTo(5,10);g.lineTo(12,10);g.moveTo(3,16);g.lineTo(11,16);g.stroke();g.globalAlpha=1;}};
 TH.gfx=function(g,w,h,v){var L=lvl(v);g.fillStyle=L>2?'#3b5cff':'#2f3a77';g.fillRect(0,h-10,w,10);g.fillStyle='#6fc24a';g.beginPath();g.moveTo(4,h-10);g.lineTo(14,6);g.lineTo(24,h-10);g.fill();if(L>1){g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(18,h-9,9,2.5,0,0,6.3);g.fill();g.fillStyle='#ffcf4a';g.beginPath();g.arc(36,8,4,0,6.3);g.fill();}if(L>2){g.fillStyle='#fff';g.fillRect(30,16,2,2);g.fillRect(38,20,2,2);g.fillRect(34,24,2,2);}};

// ===================== POOL physics: fixed-timestep, allocation-free ball/cloth/cushion/pocket sim =====================
// World units are meters. x = across the table (-HW..HW), y = along it (-HL..HL), z = up off the cloth.
// +y is the HEAD end (bottom of the portrait screen, where you break from). Rack sits on the foot spot (0,-HL/2).
const BR=0.028575,GRAV=9.81,MAXB=22,SIM_DT=1/480;
// feel presets: forgiving (default) / sim (as real as possible) / arcade (bouncy, fast)
const FEEL={
 forgiving:{muS:0.20,muR:0.010,aZ:16,eBall:0.95,muBall:0.05,muCush:0.17,eCush:[0.92,0.035,0.74],eJaw:0.50,mouthC:0.124,mouthS:0.142,throw:1},
 sim:      {muS:0.20,muR:0.010,aZ:14,eBall:0.95,muBall:0.07,muCush:0.20,eCush:[0.90,0.045,0.68],eJaw:0.58,mouthC:0.116,mouthS:0.134,throw:1},
 arcade:   {muS:0.24,muR:0.016,aZ:22,eBall:0.97,muBall:0.03,muCush:0.12,eCush:[0.95,0.02,0.85],eJaw:0.35,mouthC:0.134,mouthS:0.152,throw:0.5}};
let PHY=FEEL.forgiving;
// ---------- table geometry ----------
// segs: [x1,y1,x2,y2,kind] kind 0=rail cushion 1=pocket jaw. pockets: [x,y,fallR]
function makeTable(lengthM,feel){
 PHY=FEEL[feel]||FEEL.forgiving;
 const HL=lengthM/2,HW=lengthM/4,T={HL,HW,len:lengthM,segs:new Float64Array(40*5),nseg:0,pk:new Float64Array(6*3),feel:feel||'forgiving'};
 const add=(x1,y1,x2,y2,k)=>{const o=T.nseg*5;T.segs[o]=x1;T.segs[o+1]=y1;T.segs[o+2]=x2;T.segs[o+3]=y2;T.segs[o+4]=k;T.nseg++;};
 const mc=PHY.mouthC/Math.SQRT2,ms=PHY.mouthS/2,JL=0.075,jn=Math.hypot(0.62,1);
 for(const sx of [-1,1]){
  // long rails (two halves, broken by the side pocket)
  add(sx*HW,-(HL-mc),sx*HW,-ms,0);add(sx*HW,ms,sx*HW,HL-mc,0);
  // side pocket jaws (narrow slightly into the throat)
  for(const sy of [-1,1]){const d=Math.hypot(1,0.22);add(sx*HW,sy*ms,sx*(HW+0.055/d*1),sy*(ms-0.055*0.22/d),1);}
 }
 for(const sy of [-1,1])add(-(HW-mc),sy*HL,HW-mc,sy*HL,0);
 // corner jaws
 for(const sx of [-1,1])for(const sy of [-1,1]){
  add(sx*HW,sy*(HL-mc),sx*(HW+JL*0.62/jn),sy*(HL-mc+JL/jn),1);
  add(sx*(HW-mc),sy*HL,sx*(HW-mc+JL/jn),sy*(HL+JL*0.62/jn),1);
 }
 // pockets 0 TL 1 TR 2 ML 3 MR 4 BL 5 BR  (T = foot end, top of screen)
 const P=[[-1,-1,'c'],[1,-1,'c'],[-1,0,'s'],[1,0,'s'],[-1,1,'c'],[1,1,'c']];
 P.forEach((p,i)=>{const o=i*3;if(p[2]==='c'){T.pk[o]=p[0]*(HW+0.028);T.pk[o+1]=p[1]*(HL+0.028);T.pk[o+2]=0.062;}else{T.pk[o]=p[0]*(HW+0.052);T.pk[o+1]=0;T.pk[o+2]=0.053;}});
 T.bb=new Float64Array(T.nseg*4);for(let k=0;k<T.nseg;k++){const o=k*5,q=k*4,m=BR+0.002;T.bb[q]=Math.min(T.segs[o],T.segs[o+2])-m;T.bb[q+1]=Math.max(T.segs[o],T.segs[o+2])+m;T.bb[q+2]=Math.min(T.segs[o+1],T.segs[o+3])-m;T.bb[q+3]=Math.max(T.segs[o+1],T.segs[o+3])+m;}
 T.mc=mc;T.ms=ms;T.headY=HL/2;T.footY=-HL/2;return T;}
// ---------- world state ----------
function World(){const F=()=>new Float64Array(MAXB);
 this.n=0;this.x=F();this.y=F();this.z=F();this.vx=F();this.vy=F();this.vz=F();this.wx=F();this.wy=F();this.wz=F();
 this.on=new Uint8Array(MAXB);this.rot=null;// render-only orientation (9 floats per ball)
 this.ev=new Events();this.t=0;this.snd=null;// snd: optional ring buffer {push(type,speed,x,y)}
}
function Events(){this.first=-1;this.firstT=0;this.np=0;this.pb=new Int8Array(MAXB);this.pp=new Int8Array(MAXB);this.pt=new Float32Array(MAXB);
 this.railAfter=0;this.cueRailsBefore=0;this.rails=new Uint8Array(MAXB);this.railsAfterHit=new Uint8Array(MAXB);this.touched=new Uint8Array(MAXB);this.hits=0;this.cueMaxZ=0;
 this.cueHitBalls=0;this.kiss=new Uint8Array(MAXB);this.firstAir=0;}
Events.prototype.reset=function(){this.first=-1;this.firstT=0;this.np=0;this.railAfter=0;this.cueRailsBefore=0;this.rails.fill(0);this.railsAfterHit.fill(0);this.touched.fill(0);this.hits=0;this.cueMaxZ=0;this.cueHitBalls=0;this.kiss.fill(0);this.firstAir=0;};
function copyWorld(dst,src){dst.n=src.n;dst.x.set(src.x);dst.y.set(src.y);dst.z.set(src.z);dst.vx.set(src.vx);dst.vy.set(src.vy);dst.vz.set(src.vz);dst.wx.set(src.wx);dst.wy.set(src.wy);dst.wz.set(src.wz);dst.on.set(src.on);dst.t=src.t;}
function stopAll(W){W.vx.fill(0);W.vy.fill(0);W.vz.fill(0);W.wx.fill(0);W.wy.fill(0);W.wz.fill(0);W.z.fill(0);}
function isMoving(W){for(let i=0;i<W.n;i++){if(!W.on[i])continue;if(W.vx[i]!==0||W.vy[i]!==0||W.z[i]>0||W.vz[i]!==0)return true;}return false;}
// ---------- the cue strike ----------
// ang: aim direction (radians, table coords), speed: cue ball speed m/s, a: side offset -1..1 (right +), b: vertical -1..1 (top +), elev: cue elevation radians.
// Tip offsets are scaled to the miscue limit (0.5 R). Impulse along the cue axis -> linear + angular velocity of the cue ball.
const MISCUE=0.5;
function strike(W,i,ang,speed,a,b,elev){
 const fx=Math.cos(ang),fy=Math.sin(ang),rx=-fy,ry=fx,ce=Math.cos(elev),se=Math.sin(elev);
 let A=a*MISCUE,B=b*MISCUE;const m=Math.hypot(A,B);if(m>MISCUE){A*=MISCUE/m;B*=MISCUE/m;}
 const c=Math.sqrt(Math.max(0,1-A*A-B*B));
 // cue axis D (down into the ball when elevated), up-perp U, side r
 const Dx=ce*fx,Dy=ce*fy,Dz=-se,Ux=se*fx,Uy=se*fy,Uz=ce;
 const Px=BR*(A*rx+B*Ux-c*Dx),Py=BR*(A*ry+B*Uy-c*Dy),Pz=BR*(B*Uz-c*Dz);
 const j=speed/Math.max(0.2,ce);// impulse per unit mass so that the horizontal speed == speed
 // w = (P x jD)/I , I=0.4 m R^2
 const k=j/(0.4*BR*BR);
 W.wx[i]=k*(Py*Dz-Pz*Dy);W.wy[i]=k*(Pz*Dx-Px*Dz);W.wz[i]=k*(Px*Dy-Py*Dx);
 W.vx[i]=fx*speed;W.vy[i]=fy*speed;
 // driven down into the slate -> hop (jump shots). Off-centre masse strokes hop less.
 const hop=0.48*Math.cos(elev*0.95)*j*se*c;W.vz[i]=hop>0.05?hop:0;
 W.ev.reset();W.t=0;
}
// ---------- one fixed step ----------
const _mv=new Uint8Array(MAXB);
function stepWorld(W,T,dt,fast){
 const n=W.n,X=W.x,Y=W.y,Z=W.z,VX=W.vx,VY=W.vy,VZ=W.vz,WX=W.wx,WY=W.wy,WZ=W.wz,ON=W.on,P=PHY;
 // sub-steps so nothing moves more than 0.35R per sub-step
 let vmax=0;for(let i=0;i<n;i++){if(!ON[i])continue;const s=Math.abs(VX[i])+Math.abs(VY[i])+Math.abs(VZ[i]);if(s>vmax)vmax=s;}
 if(vmax===0){W.t+=dt;return;}
 const ns=Math.max(1,Math.ceil(vmax*dt/(0.35*BR))),h=dt/ns;
 for(let s=0;s<ns;s++){
  for(let i=0;i<n;i++){if(!ON[i])continue;
   let vx=VX[i],vy=VY[i];
   if(Z[i]>0||VZ[i]!==0){// airborne: ballistic, no cloth
    Z[i]+=VZ[i]*h;VZ[i]-=GRAV*h;
    if(Z[i]<=0){Z[i]=0;if(VZ[i]<-0.35){VZ[i]=-VZ[i]*0.45;if(W.snd&&!fast)W.snd(3,-VZ[i],X[i],Y[i]);
       // landing grabs the cloth a little
       VX[i]*=0.96;VY[i]*=0.96;}else VZ[i]=0;}
    if(i===0&&Z[i]>W.ev.cueMaxZ)W.ev.cueMaxZ=Z[i];
   }else if(vx!==0||vy!==0||WX[i]!==0||WY[i]!==0){
    // contact point slip u = v + w x (-R z)
    const ux=vx-BR*WY[i],uy=vy+BR*WX[i],um=Math.sqrt(ux*ux+uy*uy);
    if(um>1e-4){
     const dv=P.muS*GRAV*h;
     if(um<=3.5*dv){// slip dies this step -> natural roll
      vx-=ux/3.5;vy-=uy/3.5;WY[i]=vx/BR;WX[i]=-vy/BR;
     }else{const nx=ux/um,ny=uy/um;vx-=dv*nx;vy-=dv*ny;const dw=2.5*dv/BR;WX[i]-=dw*ny;WY[i]+=dw*nx;}
    }else{// rolling
     const sp=Math.sqrt(vx*vx+vy*vy),dv=P.muR*GRAV*h;
     if(sp<=dv){vx=0;vy=0;WX[i]=0;WY[i]=0;}else{const k=(sp-dv)/sp;vx*=k;vy*=k;WY[i]=vx/BR;WX[i]=-vy/BR;}
    }
    VX[i]=vx;VY[i]=vy;
   }
   if(WZ[i]!==0){const d=P.aZ*h;WZ[i]=WZ[i]>d?WZ[i]-d:WZ[i]<-d?WZ[i]+d:0;}
   X[i]+=VX[i]*h;Y[i]+=VY[i]*h;
   if(VX[i]!==0&&Math.abs(VX[i])<0.004&&Math.abs(VY[i])<0.004&&Z[i]===0&&Math.abs(VX[i]-BR*WY[i])<0.01&&Math.abs(VY[i]+BR*WX[i])<0.01){VX[i]=0;VY[i]=0;WX[i]=0;WY[i]=0;}
  }
  // ball-ball (pairs where at least one ball moves)
  for(let i=0;i<n;i++)_mv[i]=ON[i]&&(VX[i]!==0||VY[i]!==0||Z[i]>0||VZ[i]!==0)?1:0;
  for(let i=0;i<n;i++){if(!ON[i])continue;const xi=X[i],yi=Y[i],mi=_mv[i];
   for(let j=i+1;j<n;j++){if(!ON[j]||!(mi||_mv[j]))continue;
    const dx=X[j]-xi,dy=Y[j]-yi;if(dx>2*BR||dx<-2*BR||dy>2*BR||dy<-2*BR)continue;
    const dz=Z[j]-Z[i],d2=dx*dx+dy*dy+dz*dz;if(d2>=4*BR*BR||d2<1e-12)continue;
    collideBalls(W,i,j,dx,dy,dz,Math.sqrt(d2),fast);}}
  // cushions + pockets (only balls near an edge)
  const HW=T.HW,HL=T.HL,ex=HW-BR-0.004,ey=HL-BR-0.004;
  for(let i=0;i<n;i++){if(!ON[i]||!_mv[i])continue;const x=X[i],y=Y[i];
   if(x>-ex&&x<ex&&y>-ey&&y<ey)continue;
   if(Z[i]<0.06){const S=T.segs,B=T.bb;for(let k=0;k<T.nseg;k++){const q=k*4;if(x<B[q]||x>B[q+1]||y<B[q+2]||y>B[q+3])continue;const o=k*5;cushionSeg(W,T,i,S[o],S[o+1],S[o+2],S[o+3],S[o+4],fast);}}
   for(let p=0;p<6;p++){const o=p*3,dx=X[i]-T.pk[o],dy=Y[i]-T.pk[o+1],r=T.pk[o+2];if(dx*dx+dy*dy<r*r&&Z[i]<0.05){pocketBall(W,i,p,fast);break;}}
   // past the slate edge inside a pocket throat -> it drops
   if(ON[i]&&Z[i]<0.05){const ax=Math.abs(X[i]),ay=Math.abs(Y[i]);if((ax>HW+0.006&&(ay<T.ms||ay>HL-T.mc))||(ay>HL+0.006&&ax>HW-T.mc)){const p=(ay<T.ms&&ax>HW)?(X[i]<0?2:3):(Y[i]<0?(X[i]<0?0:1):(X[i]<0?4:5));pocketBall(W,i,p,fast);}}
   if(ON[i]&&(Math.abs(X[i])>HW+0.1||Math.abs(Y[i])>HL+0.1)){// escaped (should never happen) -> nearest pocket
    let bp=0,bd=1e9;for(let p=0;p<6;p++){const dx=X[i]-T.pk[p*3],dy=Y[i]-T.pk[p*3+1],d=dx*dx+dy*dy;if(d<bd){bd=d;bp=p;}}pocketBall(W,i,bp,fast);}
  }
 }

}
function collideBalls(W,i,j,dx,dy,dz,d,fast){

 const nx=dx/d,ny=dy/d,nz=dz/d;
 // separate
 const pen=(2*BR-d)*0.5+1e-7;X[i]-=nx*pen;Y[i]-=ny*pen;X[j]+=nx*pen;Y[j]+=ny*pen;
 if(nz!==0){Z[i]=Math.max(0,Z[i]-nz*pen);Z[j]=Math.max(0,Z[j]+nz*pen);}
 const vr=(VX[i]-VX[j])*nx+(VY[i]-VY[j])*ny+(VZ[i]-VZ[j])*nz;if(vr<=0)return;
 const J=(1+(W.brk?0.98:PHY.eBall))*0.5*vr;
 VX[i]-=J*nx;VY[i]-=J*ny;VX[j]+=J*nx;VY[j]+=J*ny;
 if(nz!==0){VZ[i]-=J*nz;VZ[j]+=J*nz;if(Z[i]===0&&VZ[i]<0)VZ[i]=0;if(Z[j]===0&&VZ[j]<0)VZ[j]=0;}
 // friction between the balls: throw + a little spin transfer (gear effect)
 const tx=-ny,ty=nx,ur=(VX[i]-VX[j])*tx+(VY[i]-VY[j])*ty+BR*(W.wz[i]+W.wz[j]);
 let Pf=ur/7;const lim=PHY.muBall*J*PHY.throw;if(Pf>lim)Pf=lim;else if(Pf<-lim)Pf=-lim;
 VX[i]-=Pf*tx;VY[i]-=Pf*ty;VX[j]+=Pf*tx;VY[j]+=Pf*ty;W.wz[i]-=2.5*Pf/BR;W.wz[j]-=2.5*Pf/BR;
 // record
 if(i===0||j===0){const o=i===0?j:i;if(ev.first<0){ev.first=o;ev.firstT=W.t;ev.firstAir=W.z[0]>0.004?1:0;}ev.cueHitBalls++;}
 else{ev.kiss[i]=1;ev.kiss[j]=1;}
 ev.touched[i]=1;ev.touched[j]=1;ev.hits++;
 if(W.snd&&!fast)W.snd(0,vr,(X[i]+X[j])/2,(Y[i]+Y[j])/2);
}
function cushionSeg(W,T,i,x1,y1,x2,y2,kind,fast){
 const X=W.x,Y=W.y;const sx=x2-x1,sy=y2-y1,L2=sx*sx+sy*sy;
 let t=((X[i]-x1)*sx+(Y[i]-y1)*sy)/L2;t=t<0?0:t>1?1:t;
 const qx=x1+sx*t,qy=y1+sy*t,dx=X[i]-qx,dy=Y[i]-qy,d2=dx*dx+dy*dy;
 if(d2>=BR*BR||d2<1e-14)return;
 const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
 X[i]=qx+nx*(BR+1e-7);Y[i]=qy+ny*(BR+1e-7);

// ===================== POOL rules: ball sets, racks, 8-ball (pro/bar), 9-ball, 14.1, snooker-lite, cutthroat, speed, practice =====================
// Everything here is pure logic (no DOM) so the AI can judge simulated shots and node tests can run whole matches.
function rng(seed){let s=(seed>>>0)||1;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const BALLC=['#f4f0e2','#f2bf1a','#1d47b8','#d42a1f','#5b2a8c','#f07a18','#178a4c','#8c1f1c','#141416'];

function ballSet(mode,style){const B=[{n:0,c:BALLC[0],s:0,k:'cue'}];

 for(let i=1;i<=nb;i++){let c=BALLC[i>8?i-8:i],s=i>8?1:0;if(style==='uk'&&mode!=='9ball'){c=i===8?BALLC[8]:(i<8?'#d42a1f':'#f2bf1a');s=0;}
  B.push({n:i,c,s,k:i===8&&mode!=='cutthroat'&&mode!=='9ball'?'eight':(i>8?'stripe':'solid')});}

// ---------- racks ----------
function rackTriangle(W,T,ids,r,apexY){// ids in rack order (row by row from the apex); slight gaps + jitter like a real rack

function rackDiamond(W,T,ids,r){const rows=[1,2,3,2,1];let k=0;rows.forEach((n,row)=>{for(let c=0;c<n;c++,k++){const i=ids[k];W.x[i]=(c-(n-1)/2)*2*BR*1.005+(r()-0.5)*4e-4;W.y[i]=T.footY-row*Math.sqrt(3)*BR*1.005+(r()-0.5)*4e-4;W.on[i]=1;}});}
function clearWorld(W,n){W.n=n;W.on.fill(0);W.x.fill(0);W.y.fill(0);stopAll(W);}
function rack8(W,T,r,bar){clearWorld(W,16);const sol=[1,2,3,4,5,6,7],str=[9,10,11,12,13,14,15];shuffleR(sol,r);shuffleR(str,r);

function shuffleR(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rack9(W,T,r){clearWorld(W,10);const mid=[2,3,4,5,6,7,8];shuffleR(mid,r);const ids=[1,mid[0],mid[1],mid[2],9,mid[3],mid[4],mid[5],mid[6]];rackDiamond(W,T,ids,r);W.x[0]=0;W.y[0]=T.headY;W.on[0]=1;}

// put a ball back on its spot (or the nearest free place up the long string)
function spotBall(W,T,i,x,y){if(x===undefined){x=0;y=T.footY;}let yy=y;for(let k=0;k<200;k++){if(spotFree(W,x,yy,i)){W.x[i]=x;W.y[i]=yy;W.on[i]=1;W.vx[i]=W.vy[i]=0;return;}yy-=2*BR*1.01*(k%2?1:1);if(yy<-T.HL+BR){yy=y+2*BR;y=yy;}}W.x[i]=x;W.y[i]=y;W.on[i]=1;}

// opts: rules pro|bar, callAll, twoShots, kitchen (behind the line after a scratch), clock (secs), raceTo, style (uk), straightTo, snookerReds
function newMatch(mode,players,opts,seed){const M={mode,players:players.map(p=>({name:p.name,ai:p.ai||null,group:null,score:0,fouls:0,out:false,lo:0,hi:0})),

 turn:0,breaker:0,phase:'break',bih:'kitchen',call:-1,winner:-1,msg:'',seed:seed||((Math.random()*1e9)|0),rack:0,frames:[0,0,0],shots:0,run:0,visit:0,extra:0,

function rulesFor(M){return RULES[M.mode]||RULES['8ball'];}

// the AI + aim guide use these: which balls may be hit first, which balls we'd like to pot
function legalFirst(M,W,p){const mask=[];const P=M.players[p];

  case '8ball':{if(M.phase==='break'||!P.group){for(let i=1;i<W.n;i++)if(W.on[i]&&(M.bs[i].k!=='eight'||M.phase==='break'))mask.push(i);if(!mask.length)mask.push(8);return mask;}
   const left=groupLeft(M,W,P.group);if(!left)return [8];for(let i=1;i<W.n;i++)if(W.on[i]&&M.bs[i].k===P.group)mask.push(i);return mask;}
  case '9ball':{for(let i=1;i<W.n;i++)if(W.on[i])return [i];return [];}
  case 'snooker':{if(M.sn.phase2){for(let i=11;i<W.n;i++)if(W.on[i])return [i];return [];}
   if(M.sn.onRed){for(let i=1;i<=10;i++)if(W.on[i])mask.push(i);return mask;}for(let i=11;i<=16;i++)if(W.on[i])mask.push(i);return mask;}
  case 'cutthroat':{for(let i=1;i<W.n;i++)if(W.on[i])mask.push(i);return mask;}
  default:{for(let i=1;i<W.n;i++)if(W.on[i])mask.push(i);return mask;}}}
function potWanted(M,W,p){// balls whose pocketing helps the shooter, with a value

 switch(M.mode){
  case '8ball':{if(!P.group){for(let i=1;i<W.n;i++)if(W.on[i]&&M.bs[i].k!=='eight')out.push([i,1]);return out;}if(!groupLeft(M,W,P.group))return [[8,5]];for(let i=1;i<W.n;i++)if(W.on[i]&&M.bs[i].k===P.group)out.push([i,1]);return out;}
  case '9ball':{const lf=legalFirst(M,W,p)[0];if(lf)out.push([lf,1]);if(W.on[9]&&lf!==9)out.push([9,4]);return out;}
  case 'snooker':{return legalFirst(M,W,p).map(i=>[i,M.bs[i].v]);}

// res: {foul,why,keep,win(idx)|-1,lose(bool),assign,pts:[..],respot:[ids],rerack,msg,potted:[ids],illegalBreak}
function baseRes(M,W,ev){const potted=[];let scratch=false;for(let k=0;k<ev.np;k++){const b=ev.pb[k];if(b===0)scratch=true;else potted.push(b);}

const RULES={};
RULES['8ball']={rack:(M,W,T,r)=>rack8(W,T,r,M.opts.rules==='bar'),
 judge(M,W,ev,T){const res=baseRes(M,W,ev),p=M.turn,P=M.players[p],bar=M.opts.rules==='bar',brk=M.phase==='break';
  const pot8=res.potted.indexOf(8)>=0,firstK=ev.first>=0?M.bs[ev.first].k:'';

  const onEight=!brk&&!!P.group&&!groupLeftBefore(M,W,res,P.group);
  if(brk){
   if(res.scratch){res.foul=true;res.why='Scratch on the break';}
   const railBalls=countRailBalls(W,ev);
   if(!bar&&!res.foul&&!res.potted.length&&railBalls<4){res.illegalBreak=true;res.foul=true;res.why='Illegal break (fewer than 4 balls hit a rail)';}
   if(pot8){if(bar&&!res.scratch){res.win=p;res.msg='8 on the break! Bar rules: that\'s a win.';return res;}res.respot.push(8);res.msg='8-ball on the break gets spotted.';}

   return res;}

  else if(onEight){if(ev.first!==8){res.foul=true;res.why='Had to hit the 8 first';}}
  else if(!P.group){if(firstK==='eight'&&!bar){res.foul=true;res.why='Can\'t hit the 8 first on an open table';}}
  else if(firstK!==P.group){res.foul=true;res.why='Hit the wrong group first ('+(P.group==='solid'?'you\'re solids':'you\'re stripes')+')';}
  if(!res.foul&&res.scratch){res.foul=true;res.why='Scratch! Cue ball in the pocket';}
  if(!res.foul&&!bar&&railCheck(M,ev,res)){res.foul=true;res.why='No rail after contact';}
  if(!res.foul&&M.opts.clockOut){res.foul=true;res.why='Shot clock ran out';}
  if(pot8){
   if(!onEight){res.lose=true;res.msg='8-ball went down early.';return res;}
   if(res.scratch){res.lose=true;res.msg='Scratched on the 8.';return res;}
   if(res.foul){res.lose=true;res.msg='Fouled while sinking the 8 ('+res.why+').';return res;}

  (opp==='ai'?'<div class="seg">'+LV.map(l=>'<button data-clv="'+l+'" class="'+((c.lvl||'regular')===l?'on':'')+'">'+AIL[l].nm+'</button>').join('')+'</div>':'');}
// option definitions: [key, label, choices, modes it applies to, default]
const COPTS=[
 ['rules','8-ball rules',[['pro','Pro'],['bar','Bar']],['8ball'],'pro'],
 ['callAll','Call every shot',[[false,'Only the 8'],[true,'Every shot']],['8ball','9ball','straight'],false],
 ['twoShots','After a foul',[[false,'Ball in hand'],[true,'Bar: 2 shots']],['8ball','9ball'],false],
 ['kitchen','After a scratch',[[false,'Anywhere'],[true,'Behind the line']],['8ball','9ball'],false],
 ['raceTo','Match length',[[1,'1 rack'],[3,'Race to 3'],[5,'Race to 5'],[7,'Race to 7']],['8ball','9ball'],1],
 ['straightTo','Points to win',[[25,'25'],[50,'50'],[100,'100']],['straight'],25],
 ['clock','Shot clock',[[0,'Off'],[30,'30 s'],[45,'45 s'],[60,'60 s']],['8ball','9ball','straight','snooker','cutthroat','ladder'],0],
 ['feel','Physics',[['forgiving','Forgiving'],['sim','Full sim'],['arcade','Arcade bouncy']],'*','forgiving'],
 ['style','Balls',[['','Solids & stripes'],['uk','Reds & yellows']],['8ball','speed','straight','ladder'],''],
 ['slowmo','Slow-mo replay on great shots',[[false,'Off'],[true,'On']],'*',false],
 ['talk','AI trash talk',[['on','On'],['silent','Silent robot'],['adult','Adult (18+)']],['8ball','9ball','straight','snooker','cutthroat','ladder'],'on'],
 ['flip','Table flips for each player',[[false,'Off'],[true,'On']],['8ball','9ball','straight','snooker'],false],

function renderCustomOpts(MD){const c=SEL.c,box=$('copts');let o='';for(const [k,l,ch,modes,def] of COPTS){if(modes!=='*'&&modes.indexOf(MD.id)<0)continue;if(k==='talk'&&MD.id!=='ladder'&&(c.opp==='2p'||(MD.three&&!(c.cut||[]).some(v=>v.startsWith('ai')))))continue;if(k==='flip'&&c.opp!=='2p')continue;
  const v=c[k]===undefined?def:c[k];o+='<div class="copt"><span>'+l+'</span><div class="seg sm">'+ch.filter(x=>x[0]!=='adult'||adultOn()).map(x=>'<button data-ck="'+k+'" data-cv="'+JSON.stringify(x[0]).replace(/"/g,'&quot;')+'" class="'+(String(v)===String(x[0])?'on':'')+'">'+x[1]+'</button>').join('')+'</div></div>';}
 box.innerHTML=o;box.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{AUD.tick();c[b.dataset.ck]=JSON.parse(b.dataset.cv);saveC();renderCustomOpts(MD);});
 MENU.querySelectorAll('[data-cut]').forEach(b=>b.onclick=()=>{AUD.tick();const [i,v]=b.dataset.cut.split(':').length>2?[b.dataset.cut.split(':')[0],b.dataset.cut.split(':').slice(1).join(':')]:b.dataset.cut.split(':');c.cut[+i]=v;saveC();showScreen('custom');});}
function copt(k,MD){const d=COPTS.find(q=>q[0]===k);if(!d)return undefined;if(d[3]!=='*'&&d[3].indexOf(MD.id)<0)return d[4];const v=SEL.c[k];return v===undefined?d[4]:v;}

 if(MD.id==='speed'){players=[{name:you()}];}
 else if(MD.id==='ladder'){const k=Math.min(PROF.st.ladder||0,PERSONAS.length-1),P=PERSONAS[k];lvl=P.lvl;players=[{name:you()},{name:P.name,ai:{lvl:P.lvl,pid:P.id}}];kind='ladder';return startMatch({kind,lvl,rung:k,mode:'8ball',players,opts});}
 else if(MD.three){const s=c.cut||['me','ai:regular','ai:shark'];let hn=1;players=s.map((v,i)=>{if(i===0)return{name:you()};if(v==='me2'){hn++;return{name:CFG.lastNames[1]&&hn===2?CFG.lastNames[1]:'Player '+hn};}const l=v.slice(3),ps=PERSONAS.filter(p=>p.lvl===l),P=ps[i%ps.length];return{name:P.name,ai:{lvl:l,pid:P.id}};});}
 else{const opp=c.opp||'ai';if(opp==='2p'){players=[{name:CFG.lastNames[0]},{name:CFG.lastNames[1]}];kind='2p';}else{lvl=opp==='adapt'?adaptLevel():(c.lvl||'regular');const ps=PERSONAS.filter(p=>p.lvl===lvl),P=ps[(Math.random()*ps.length)|0];players=[{name:you()},{name:P.name,ai:{lvl,pid:P.id}}];kind='ai';if(opp==='adapt')toast('Adaptive AI picked '+AIL[lvl].nm+' for you');}}
 startMatch({kind,lvl,mode:MD.id,players,opts});}

 else{banner('',res.msg||'Not quite. Try again.','#ff9a6a');GS.st='turn';GS.settleT=1.4;GS.afterTrick=false;GS.trickReset=true;}}

 on('#nx',()=>{GS.paused=false;showScreen(null);startTrick(i+1);});on('#ag',()=>{GS.paused=false;showScreen(null);});on('#tl',()=>{GS.paused=false;MATCH=null;GS.st='menu';showScreen('tricks');});}

function matchOver(){const M=MATCH,w=M.winner,W=M.players[w],race=M.opts.raceTo||1;
 if(race>1&&M.mode!=='speed'&&M.mode!=='cutthroat'){M.frames[w]++;if(M.frames[w]<race){// next rack: loser of the rack breaks (bar), alternate in pro
   banner('RACK TO '+W.name.toUpperCase(),M.frames.slice(0,M.players.length).join(' – ')+' · race to '+race,'#ffcf4a');GS.bannerT=2.6;

// ===================== sound: WebAudio synthesis (no samples) =====================
const AUD=(function(){let ac=null,master=null,sfx=null,amb=null,mus=null,noiseB=null,brownB=null,rollSrc=null,rollG=null,rollF=null,ambOn=false,ambNodes=[],musOn=false,musT=0,musTimer=0,lastHit=0,hitN=0;
 function ok(){return ac&&CFG.sound;}
 function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
   master=ac.createGain();master.connect(ac.destination);sfx=ac.createGain();sfx.connect(master);amb=ac.createGain();amb.connect(master);mus=ac.createGain();mus.connect(master);
   const n=ac.sampleRate*2;noiseB=ac.createBuffer(1,n,ac.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
   brownB=ac.createBuffer(1,n,ac.sampleRate);const b=brownB.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+0.02*(Math.random()*2-1))/1.02;b[i]=l*3.5;}
   vols();if(ambWanted)ambient(true);}
  if(ac.state==='suspended')ac.resume();}
 function vols(){if(!ac)return;const t=ac.currentTime;master.gain.setTargetAtTime(CFG.sound?1:0,t,0.02);sfx.gain.setTargetAtTime(CFG.sfxVol/100,t,0.02);amb.gain.setTargetAtTime(CFG.amb?CFG.ambVol/100*0.6:0,t,0.3);mus.gain.setTargetAtTime(CFG.music?CFG.musVol/100*0.35:0,t,0.3);}
 function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
 function pan(x){if(!ac.createStereoPanner)return null;const p=ac.createStereoPanner();p.pan.value=clamp(x||0,-0.8,0.8);return p;}
 function noiseHit(t,f,q,peak,dec,type,dest,px){const s=ac.createBufferSource();s.buffer=noiseB;s.playbackRate.value=0.8+Math.random()*0.4;const fl=ac.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();env(g,t,0.001,peak,dec);
  s.connect(fl);fl.connect(g);const p=pan(px);if(p){g.connect(p);p.connect(dest||sfx);}else g.connect(dest||sfx);s.start(t,Math.random()*1.5);s.stop(t+dec+0.05);}

 // physics events: 0 ball-ball, 1 cushion, 2 jaw, 3 slate bounce, 4 pocket
 function hit(type,sp,x,y){if(!ok())return;const t=ac.currentTime;if(t-lastHit<0.012){if(++hitN>5)return;}else{hitN=0;lastHit=t;}
  const px=TB?(CAM.rot?-y:x)/(TB.HW*2):0,v=clamp(sp/5,0,1);if(v<0.01)return;
  if(type===0){// phenolic clack: bright click + ringing partials
   const a=0.25+0.75*Math.sqrt(v);noiseHit(t,3800+Math.random()*900,1.2,0.55*a,0.025,'bandpass',sfx,px);tone(t,2350+Math.random()*120,2200,0.22*a,0.05,'sine',sfx,px);tone(t,4100+Math.random()*200,0,0.1*a,0.03,'sine',sfx,px);tone(t,1150,900,0.06*a,0.04,'triangle',sfx,px);}
  else if(type===1){// rubber cushion thump
   const a=0.2+0.8*Math.sqrt(v);noiseHit(t,320,0.8,0.5*a,0.09,'lowpass',sfx,px);tone(t,140+v*40,70,0.35*a,0.11,'sine',sfx,px);noiseHit(t,1600,2,0.06*a,0.03,'bandpass',sfx,px);}
  else if(type===2){// pocket jaw: harder, woody rattle
   const a=0.3+0.7*Math.sqrt(v);noiseHit(t,900,3,0.45*a,0.05,'bandpass',sfx,px);tone(t,420,300,0.18*a,0.06,'triangle',sfx,px);noiseHit(t+0.03,1200,4,0.2*a,0.04,'bandpass',sfx,px);}
  else if(type===3){const a=0.3+0.7*v;tone(t,180,90,0.5*a,0.12,'sine',sfx,px);noiseHit(t,600,1,0.25*a,0.06,'lowpass',sfx,px);}
  else if(type===4){// drop into the pocket: thud + leather + roll down the return
   const a=0.4+0.6*Math.sqrt(v);tone(t,110,55,0.55*a,0.18,'sine',sfx,px);noiseHit(t,260,0.7,0.5*a,0.12,'lowpass',sfx,px);
   for(let k=0;k<4;k++){noiseHit(t+0.12+k*0.07+Math.random()*0.02,700-k*80,2.5,0.12*a*(1-k*0.2),0.04,'bandpass',sfx,px);}tone(t+0.18,2100,1900,0.04*a,0.05,'sine',sfx,px);}}
 function cue(v,off){if(!ok())return;const t=ac.currentTime,a=0.3+0.7*Math.sqrt(v);noiseHit(t,2400,1.4,0.45*a,0.022,'bandpass');tone(t,900,600,0.22*a,0.03,'triangle');tone(t,240,160,0.18*a,0.05,'sine');if(off>0.85)noiseHit(t+0.01,5200,3,0.3,0.03,'highpass');}

 function roll(W){if(!ac)return;if(!rollSrc){rollSrc=ac.createBufferSource();rollSrc.buffer=brownB;rollSrc.loop=true;rollF=ac.createBiquadFilter();rollF.type='lowpass';rollF.frequency.value=300;rollG=ac.createGain();rollG.gain.value=0;rollSrc.connect(rollF);rollF.connect(rollG);rollG.connect(sfx);rollSrc.start();}

 // bar ambience: crowd murmur (formant-filtered noise, slowly modulated) + jukebox hum + glass clinks

 function ambient(on){ambWanted=on;if(!ac)return;if(on&&!ambOn){ambOn=true;
   const mk=(f,q,g0)=>{const s=ac.createBufferSource();s.buffer=noiseB;s.loop=true;const fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=g0;const lfo=ac.createOscillator();lfo.frequency.value=0.15+Math.random()*0.5;const lg=ac.createGain();lg.gain.value=g0*0.6;lfo.connect(lg);lg.connect(g.gain);s.connect(fl);fl.connect(g);g.connect(amb);s.start(0,Math.random());lfo.start();ambNodes.push(s,lfo);};
   mk(420,4,0.10);mk(800,5,0.07);mk(1250,6,0.045);mk(2600,7,0.02);mk(180,2,0.05);
   // jukebox: a low, muffled chord drone that walks slowly
   const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.connect(amb);const jg=ac.createGain();jg.gain.value=0.05;jg.connect(lp);
   [55,82.4,110,138.6].forEach((f,i)=>{const o=ac.createOscillator();o.type=i?'sawtooth':'triangle';o.frequency.value=f;o.detune.value=(Math.random()-0.5)*12;const g=ac.createGain();g.gain.value=i?0.12:0.4;o.connect(g);g.connect(jg);o.start();ambNodes.push(o);});
   const tr=ac.createOscillator();tr.frequency.value=1.7;const tg=ac.createGain();tg.gain.value=0.02;tr.connect(tg);tg.connect(jg.gain);tr.start();ambNodes.push(tr);
   clinkT=setInterval(()=>{if(!ambOn||!ok()||!CFG.amb)return;const t=ac.currentTime;if(Math.random()<0.5)tone(t,3200+Math.random()*1800,0,0.035,0.25,'sine',amb,Math.random()*1.6-0.8);if(Math.random()<0.25){// a laugh burst
     for(let k=0;k<4;k++)noiseHit(t+k*0.11,700+Math.random()*300,6,0.06,0.08,'bandpass',amb,Math.random()-0.5);}},2400);}
  else if(!on&&ambOn){ambOn=false;ambNodes.forEach(n=>{try{n.stop();}catch(e){}});ambNodes=[];clearInterval(clinkT);}
  music(on&&CFG.music);vols();}
 // background music (Custom: off by default): a lazy procedural bar-blues loop
 const PROG=[0,0,0,0,5,5,0,0,7,5,0,7],BASS=[0,4,7,9,10,9,7,4];
 function music(on){if(!ac)return;if(on&&!musOn){musOn=true;musT=ac.currentTime+0.1;let bar=0,step=0;const root=110;
   musTimer=setInterval(()=>{if(!musOn)return;while(musT<ac.currentTime+0.4){const ch=PROG[bar%12],beat=0.32;
     const f=root*Math.pow(2,(ch+BASS[step%8])/12)/2;tone(musT,f,0,0.16,beat*0.9,'triangle',mus);
     if(step%2===0){[0,4,7,10].forEach(s=>tone(musT,root*Math.pow(2,(ch+s)/12),0,0.025,beat*1.6,'sawtooth',mus));}
     if(step%2===1)noiseHit(musT,7000,1,0.04,0.04,'highpass',mus);if(step%4===0)tone(musT,90,45,0.25,0.12,'sine',mus);
     musT+=beat;step++;if(step%8===0)bar++;}},120);}
  else if(!on&&musOn){musOn=false;clearInterval(musTimer);}}

   const f1=ac.createBiquadFilter();f1.type='bandpass';f1.frequency.value=330;f1.Q.value=5;const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.05,t+0.25+Math.random()*0.2);g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);o.connect(f1);f1.connect(g);g.connect(sfx);o.start(t+Math.random()*0.1);o.stop(t+1.6);}}
