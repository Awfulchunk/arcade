<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1c22">
<title>Swarm: Last Stand</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#12141a;color:#eee;font-family:"Courier New",Courier,monospace;touch-action:none;user-select:none}
#c{display:block;width:100%;height:100%;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.hud{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:700;letter-spacing:.05em;text-shadow:0 2px 0 #000,0 0 8px #000}
.hud .wl{color:#fff}.hud .wl b{color:#fff}.hud .nx{color:#ff3a3a;font-size:12px;font-weight:700;margin-top:2px}
.hud .cr{text-align:right;color:#ffe066}.hud .cr b{color:#ffe066}.hud .hp{color:#9ab;font-size:11px;margin-top:2px;font-weight:600}
.banner{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 0 #400,0 0 14px #a00;opacity:0;transition:opacity .12s;white-space:nowrap;pointer-events:none}
.banner.on{opacity:1}
#bar{position:absolute;left:0;right:0;bottom:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(12,16,28,0),rgba(12,16,28,.95) 18%,#0c1220 40%);pointer-events:auto}
.bar-inner{display:flex;gap:4px;align-items:stretch;overflow-x:auto;padding:4px 2px;-webkit-overflow-scrolling:touch;background:#152038;border:2px solid #2a3a58;border-radius:6px;margin:0 2px}
.chip{flex:0 0 auto;width:52px;background:#1a2840;border:2px solid #2e4060;border-radius:5px;padding:4px 2px 3px;text-align:center;color:#ddd;font-size:9px;line-height:1.1;position:relative}
.chip:active{transform:scale(.96)}
.chip .ic{width:32px;height:28px;margin:0 auto 2px;image-rendering:pixelated;display:block}
.chip .nm{font-weight:700;color:#cde;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ct{color:#8cf;font-size:9px;margin-top:1px}
.chip .pips{display:flex;gap:2px;justify-content:center;margin-top:2px;height:4px}
.chip .pips i{display:block;width:6px;height:4px;background:#2a3548;border-radius:1px}
.chip .pips i.on{background:#ffe066}
.chip.sel{border-color:#ffe066;box-shadow:0 0 0 1px #ffe066 inset}
.chip.owned{border-color:#6a9}
.chip.off{opacity:.4;pointer-events:none}
.chip.go{border-color:#4a8;background:#1a4030}
.chip.go .nm{color:#8f8}
.hint{text-align:center;font-size:10px;color:#9ab;margin:0 0 4px;text-shadow:0 1px 0 #000}
.hint b{color:#ffe066}
#overlay{position:fixed;inset:0;background:rgba(8,10,16,.88);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:5}
#overlay.off{display:none}
.panel{width:min(340px,92vw);background:#141c2c;border:3px solid #3a5080;border-radius:12px;padding:18px 16px 16px;text-align:center;box-shadow:0 0 0 2px #0a1020,0 12px 40px #000a}
.panel h1{font-size:26px;letter-spacing:.08em;color:#ff5a3a;text-shadow:0 2px 0 #400;margin-bottom:2px}
.panel .sub{font-size:12px;color:#bcd;margin-bottom:12px;line-height:1.35}
.panel .stats{font-size:12px;color:#ffe066;margin:8px 0 12px;line-height:1.45}
.btn{display:block;width:100%;margin:6px 0;padding:12px 10px;border:0;border-radius:10px;font:700 15px "Courier New",monospace;cursor:pointer}
.btn.go{background:#d4452c;color:#fff}
.btn.grey{background:#1e2838;color:#cde;border:2px solid #3a4a60}
.btn:active{filter:brightness(1.1)}
#toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:#000d;border:1px solid #633;color:#fcc;padding:6px 10px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hud">
    <div><div class="wl">WAVE <b id="wNum">1</b></div><div class="nx">NEXT: <span id="nNum">—</span></div></div>
    <div class="cr">CREDITS <b id="cred">0</b><div class="hp">HP <b id="hp">100</b></div></div>
  </div>
  <div class="banner" id="banner"></div>
  <div id="toast"></div>
  <div id="bar">
    <div class="hint" id="hint">LEFT / RIGHT aim · HOLD FIRE</div>
    <div class="bar-inner" id="shop"></div>
  </div>
</div>
<div id="overlay">
  <div class="panel">
    <h1>SWARM</h1>
    <div class="sub">LAST STAND<br>You are the AI core. The swarm wants you dead.<br>Hold the line. Grind the horde.<br>Build anywhere, unlock 23 guns, survive.</div>
    <div class="stats" id="best">Best wave: 0</div>
    <button class="btn go" id="startBtn">HOLD THE LINE</button>
    <button class="btn grey" id="howBtn">HOW TO PLAY</button>
  </div>
</div>
<script>
(()=>{
"use strict";
const VERSION="1.6.11";
// t920: sniper REVERTED to thin white hitscan beam (Jay keep); soft suck/limbs stay.
// t918: suck snap + limb/gib scale + sniper slug (laser beam kept). Tip-only.
// t894: local HTML tip only — manual main aim + quiet pixel groove.
const MAIN_INPUT={left:false,right:false,fire:false,stick:null};
const mainAuto=()=>window.SWARM_SET?.controls.aim==="auto";
// v1.6.3+t890 (+t891): tip-only pixel ADW pass. No APK / arcade / publishing.
let T890_RECOIL=0;
const FIELD_PIXEL=new Set(["wall","mine","spike","grind","sawtrap","vent","gas","pit","tar","glass","caltrop","efence","wire"]);
const $=id=>document.getElementById(id);
const cv=$("c"), ctx=cv.getContext("2d",{alpha:false});
ctx.imageSmoothingEnabled=false;

let W=0,H=0,DPR=1,CX=0,CY=0,SCALE=1,BAR_H=110;
let running=false, between=false, dead=false, t=0, last=0;
let wave=1, credits=0, kills=0, best=+(localStorage.getItem("swarm.best")||0);
let hp=160, maxHp=160, genPower=0;
let aim=0, fireCd=0;
let enemies=[], bullets=[], gibs=[], blood=[], floaters=[], mines=[], aux=[], slots=[];
let placeMode=null, shake=0;
let decor=[]; // crates + barrels baked once

const WEAPONS=[
  {id:"basic",nm:"BASIC",col:"#ffe066",dmg:12,spd:460,rate:.10,spread:0,pierce:0,explode:0,fire:0,cost:0,lvl:0},
  {id:"heavy",nm:"HEAVY",col:"#ffb040",dmg:26,spd:320,rate:.34,spread:0,pierce:0,explode:0,fire:0,cost:180,lvl:0,locked:1},
  {id:"explosive",nm:"BOOM",col:"#ff7040",dmg:16,spd:290,rate:.44,spread:0,pierce:0,explode:42,fire:0,cost:260,lvl:0,locked:1},
  {id:"pierce",nm:"PIERCE",col:"#9ad0ff",dmg:11,spd:540,rate:.17,spread:0,pierce:3,explode:0,fire:0,cost:220,lvl:0,locked:1},
  {id:"fire",nm:"FLAME",col:"#ff5020",dmg:6,spd:250,rate:.07,spread:.2,pierce:0,explode:0,fire:2.4,cost:300,lvl:0,locked:1},
];
let activeW=0, fireRateBonus=0;

const BUILDS=[
  {id:"wall",nm:"WALL",cost:200},
  {id:"mine",nm:"MINE",cost:250},
  {id:"aux",nm:"AUX",cost:400},
  {id:"gen",nm:"GEN",cost:400},
  {id:"repair",nm:"REPAIR",cost:300},
];

const Z_SHIRTS=["#3a6a9a","#6a3a3a","#3a6a3a","#6a5a2a","#5a3a6a","#2a5a5a","#7a4a2a","#4a4a6a"];

function resetRun(){
  wave=1;credits=140;kills=0;hp=160;maxHp=160;genPower=0;aim=-Math.PI/2;fireCd=0;
  enemies=[];bullets=[];gibs=[];blood=[];floaters=[];mines=[];aux=[];
  placeMode=null;between=false;dead=false;shake=0;activeW=0;fireRateBonus=0;
  WEAPONS.forEach((w,i)=>{w.lvl=0;w.locked=i!==0?1:0;});
  initSlots(); seedDecor();
}

function initSlots(){
  slots=[];
  const n=8, r=92;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*(Math.PI*2/n);
    slots.push({x:Math.cos(a)*r,y:Math.sin(a)*r,build:null,hp:0,max:0});
  }
}

function seedDecor(){
  decor=[];
  // blue metal crates
  const crates=[[-118,-72],[-88,96],[102,-58],[118,74],[-140,18],[72,-128],[-40,130],[150,-10],[-160,-40],[40,150],[-70,-140],[160,90],[-175,100],[90,140],[-95,40]];
  for(const [x,y] of crates) decor.push({k:"crate",x,y});
  // red barrels
  const barrels=[[-58,78],[88,54],[-110,-98],[48,118],[-150,60],[130,-90],[20,-150],[-30,155],[155,40],[70,-70],[-170,-20],[110,110],[-80,-50],[0,140]];
  for(const [x,y] of barrels) decor.push({k:"barrel",x,y});
  // scrap / grit plates
  for(let i=0;i<18;i++){
    decor.push({k:"plate",x:(Math.sin(i*2.7)*160)|0,y:(Math.cos(i*1.9)*150)|0,s:6+(i%5)});
  }
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  BAR_H=Math.max(100, Math.min(130, H*0.16));
  CX=W/2;CY=(H-BAR_H)*0.48 + 4;
  SCALE=Math.min(W, H-BAR_H)/640;
}
addEventListener("resize",resize);resize();

const rnd=(a=1,b)=>b==null?Math.random()*a:a+Math.random()*(b-a);
const irnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hypot=Math.hypot;
function toast(m){$("toast").textContent=m;$("toast").classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>$("toast").classList.remove("on"),1600);}
function banner(m,ms=900){$("banner").textContent=m;$("banner").classList.add("on");clearTimeout(banner._t);banner._t=setTimeout(()=>$("banner").classList.remove("on"),ms);}
function hud(){
  $("wNum").textContent=wave;
  $("cred").textContent=credits.toLocaleString();
  $("hp").textContent=Math.max(0,Math.ceil(hp));
  $("nNum").textContent=between?"SHOP":String(enemies.length+toSpawn);
  $("best").textContent="Best wave: "+best+" · ver "+VERSION;
}

let waveTimer=12, spawnAcc=0, toSpawn=0, waveActive=false;

function startWave(){
  between=false;placeMode=null;
  const count=Math.round((48+Math.floor(wave*12)+Math.floor(wave*wave*1.4))*(wave<=4?[0,.5,.62,.74,.86][wave]:1)); // t896 lean early
  toSpawn=count;spawnAcc=0;waveTimer=0;waveActive=true;
  // instant burst so arena looks packed like the brief mock
  const burst=Math.min(toSpawn, wave<=4?12+wave*3:22+Math.floor(wave*2.5));
  for(let i=0;i<burst;i++){spawnOne();toSpawn--;}
  banner("WAVE "+wave,1000);
  buildShop();hud();
}

function endWave(){
  waveActive=false;between=true;
  credits+=50+wave*14;
  banner("WAVE CLEAR",1100);
  buildShop();hud();
}

function enemyStats(kind){
  const w=wave;
  if(kind==="mutant")return{hp:48+w*8,sp:22+w*0.4,r:16,dmg:12,cred:22,shirt:null};
  if(kind==="runner")return{hp:9+w*1.8,sp:62+w*1.1,r:8,dmg:4,cred:8,shirt:Z_SHIRTS[irnd(0,Z_SHIRTS.length-1)]};
  return{hp:14+w*2.6,sp:28+w*0.75,r:10,dmg:5,cred:11,shirt:Z_SHIRTS[irnd(0,Z_SHIRTS.length-1)]};
}

let ZOM_MAX_LIVE=96;
function spawnOne(){
  if(enemies.length>=ZOM_MAX_LIVE)return;
  const edge=irnd(0,3);
  let x,y,m=400;
  if(edge===0){x=rnd(-m,m);y=-m;}
  else if(edge===1){x=m;y=rnd(-m,m);}
  else if(edge===2){x=rnd(-m,m);y=m;}
  else{x=-m;y=rnd(-m,m);}
  let kind="zombie";
  const r=Math.random();
  if(wave>=2&&r<0.22)kind="runner";
  if(wave>=3&&r<0.16)kind="mutant";
  if(wave>=8&&r<0.12)kind="mutant";
  if(wave>=12&&r<0.1)kind="mutant";
  const s=enemyStats(kind);
  enemies.push({x,y,vx:0,vy:0,kind,...s,max:s.hp,burn:0,hit:0,ph:rnd(6.28),frame:irnd(0,3)});
}

function nearestEnemy(x,y){
  let bestE=null,bd=1e9;
  for(const e of enemies){
    const d=hypot(e.x-x,e.y-y);
    if(d<bd){bd=d;bestE=e;}
  }
  return bestE;
}

function shootFrom(x,y,ang,wep,src){
  const sp=wep.spd*(1+wep.lvl*0.05);
  const spr=(wep.spread||0)*(1-wep.lvl*0.05);
  const a=ang+(rnd(-spr,spr));
  bullets.push({
    x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
    dmg:wep.dmg*(1+wep.lvl*0.18),
    col:wep.col,pierce:wep.pierce+Math.floor(wep.lvl/2),
    explode:wep.explode*(1+wep.lvl*0.1),
    fire:wep.fire*(1+wep.lvl*0.15),
    life:1.4,src
  });
}

function tryFire(dt){
  const wep=WEAPONS[activeW];
  const rate=Math.max(0.045,wep.rate*(1-fireRateBonus*0.08)*(1-wep.lvl*0.06));
  fireCd-=dt;
  const tgt=nearestEnemy(0,0);
  if(mainAuto()&&tgt){
    const want=Math.atan2(tgt.y,tgt.x);
    let d=want-aim;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
    aim+=clamp(d,-5*dt,5*dt);
  }
  if(!mainAuto()){
    if(MAIN_INPUT.stick!=null)aim=MAIN_INPUT.stick;
    else aim+=(Number(MAIN_INPUT.right)-Number(MAIN_INPUT.left))*2.4*dt;
    aim=Math.atan2(Math.sin(aim),Math.cos(aim));
  }
  if(fireCd<=0&&(mainAuto()?!!tgt:MAIN_INPUT.fire)){
    fireCd=rate;
    shootFrom(Math.cos(aim)*14,Math.sin(aim)*14,aim,wep,"main");
  }
  for(const a of aux){
    a.cd=(a.cd||0)-dt;
    const e=nearestEnemy(a.x,a.y);
    if(e&&a.cd<=0){
      a.cd=Math.max(0.08,miniWeapon(a).rate*(a.linked?1.8:1));
      const ang=Math.atan2(e.y-a.y,e.x-a.x);
      a.aim=ang;
      shootFrom(a.x+Math.cos(ang)*10,a.y+Math.sin(ang)*10,ang,Object.assign({},miniWeapon(a),{dmg:miniWeapon(a).dmg*(a.linked?0.35:1)}),"aux");
    }
  }
}

function goreAt(x,y,n,big){
  for(let i=0;i<n;i++){
    const a=rnd(6.28),sp=rnd(50,big?180:110);
    gibs.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.5,1.3),r:rnd(2.5,big?6:4),col:Math.random()<.25?"#3a0808":(Math.random()<.5?"#b01018":"#e02028")});
  }
  // multiple overlapping blood pools
  const pools=big?3:2;
  for(let i=0;i<pools;i++){
    blood.push({x:x+rnd(-8,8),y:y+rnd(-6,6),r:rnd(12,big?34:22),life:1,a:1,rot:rnd(6.28)});
  }
  // ground splatters
  for(let i=0;i<(big?10:6);i++){
    blood.push({x:x+rnd(-28,28),y:y+rnd(-22,22),r:rnd(2,7),life:1,a:1,rot:0,dot:1});
  }
  if(blood.length>160)blood.splice(0,blood.length-160);
  if(gibs.length>180)gibs.splice(0,gibs.length-180);
}

function killEnemy(e,idx){
  credits+=e.cred;kills++;
  goreAt(e.x,e.y,e.kind==="mutant"?22:12,e.kind==="mutant");
  floaters.push({x:e.x,y:e.y,t:0,txt:"+"+e.cred,col:"#ffe066"});
  enemies.splice(idx,1);
  shake=Math.min(7,shake+1.6);
}

function explode(x,y,r,dmg){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i],d=hypot(e.x-x,e.y-y);
    if(d<r){
      e.hp-=dmg*(1-d/r*0.5);
      e.hit=.12;
      if(e.hp<=0)killEnemy(e,i);
    }
  }
  goreAt(x,y,16,true);
  shake=Math.min(11,shake+4);
}

function buildShop(){
  const shop=$("shop");shop.innerHTML="";
  // NEXT between waves
  if(between){
    const next=document.createElement("div");
    next.className="chip go";
    next.innerHTML=`<canvas class="ic" width="32" height="28"></canvas><div class="nm">NEXT</div><div class="ct">WAVE</div>`;
    const nc=next.querySelector("canvas"); const ng=nc.getContext("2d");
    ng.fillStyle="#1a4030";ng.fillRect(0,0,32,28);
    ng.fillStyle="#8f8";ng.fillRect(10,6,12,4);ng.fillRect(18,10,8,4);ng.fillRect(10,14,12,4);
    next.onclick=()=>{wave++;startWave();};
    shop.appendChild(next);
  }

  WEAPONS.forEach((w,i)=>{
    const el=document.createElement("div");
    el.className="chip"+(activeW===i?" sel":"");
    const cost=w.locked?w.cost:(80+w.lvl*60);
    let pips="";
    for(let p=0;p<5;p++) pips+=`<i class="${p<w.lvl?"on":""}"></i>`;
    el.innerHTML=`<canvas class="ic" width="32" height="28"></canvas><div class="nm">${w.nm}</div><div class="pips">${pips}</div><div class="ct">${w.locked?("LOCK "+w.cost):(w.lvl>=5?"MAX":cost+"¢")}</div>`;
    if(w.locked) el.classList.add("off"); // still clickable via handler
    el.classList.remove("off");
    if(w.locked && !between) el.classList.add("off");
    el.onclick=()=>{
      if(!between && !w.locked){activeW=i;toast(w.nm+" equipped");buildShop();return;}
      if(!between) return toast("Shop between waves");
      if(w.locked){
        if(credits<w.cost)return toast("Need "+w.cost+" credits");
        credits-=w.cost;w.locked=0;activeW=i;toast(w.nm+" unlocked");buildShop();hud();return;
      }
      if(activeW!==i){activeW=i;toast(w.nm+" equipped");buildShop();return;}
      if(w.lvl>=5)return toast("Maxed");
      const c=80+w.lvl*60;
      if(credits<c)return toast("Need "+c);
      credits-=c;w.lvl++;toast(w.nm+" → Lv"+w.lvl);buildShop();hud();
    };
    shop.appendChild(el);
    drawWeaponIcon(el.querySelector("canvas"),w);
  });

  // fire rate
  const fr=document.createElement("div");
  fr.className="chip"+(!between?" off":"");
  const frCost=120+fireRateBonus*80;
  let fp=""; for(let p=0;p<5;p++) fp+=`<i class="${p<fireRateBonus?"on":""}"></i>`;
  fr.innerHTML=`<canvas class="ic" width="32" height="28"></canvas><div class="nm">RATE</div><div class="pips">${fp}</div><div class="ct">${fireRateBonus>=5?"MAX":frCost+"¢"}</div>`;
  const fc=fr.querySelector("canvas"), fg=fc.getContext("2d");
  fg.fillStyle="#1a2840";fg.fillRect(0,0,32,28);
  fg.fillStyle="#ffe066";fg.fillRect(6,12,4,4);fg.fillRect(12,10,4,8);fg.fillRect(18,8,4,12);fg.fillRect(24,6,4,16);
  fr.onclick=()=>{
    if(!between)return toast("Shop between waves");
    if(fireRateBonus>=5)return;
    if(credits<frCost)return toast("Need "+frCost);
    credits-=frCost;fireRateBonus++;toast("Fire rate +");buildShop();hud();
  };
  shop.appendChild(fr);

  BUILDS.forEach(b=>{
    const el=document.createElement("div");
    el.className="chip"+(placeMode===b.id?" sel":"")+(!between?" off":"");
    el.innerHTML=`<canvas class="ic" width="32" height="28"></canvas><div class="nm">${b.nm}</div><div class="ct">${b.cost}</div>`;
    el.onclick=()=>{
      if(!between)return toast("Shop between waves");
      if(b.id==="repair"){
        if(credits<b.cost)return toast("Need "+b.cost);
        if(hp>=maxHp)return toast("Already full");
        credits-=b.cost;hp=Math.min(maxHp,hp+50);toast("Repaired +50");hud();buildShop();return;
      }
      if(b.id==="gen"){
        if(credits<b.cost)return toast("Need "+b.cost);
        if(genPower>=3)return toast("Max generators");
        credits-=b.cost;genPower++;maxHp+=25;hp+=25;toast("Generator online");hud();buildShop();return;
      }
      if(credits<b.cost)return toast("Need "+b.cost);
      placeMode=b.id;toast("Tap a slot around turret");buildShop();
    };
    shop.appendChild(el);
    drawBuildIcon(el.querySelector("canvas"),b.id);
  });

  $("hint").innerHTML=between
    ?(placeMode?("Placing <b>"+placeMode.toUpperCase()+"</b> — tap a glowing slot"):("WAVE CLEAR — spend credits, then <b>NEXT WAVE</b>"))
    :("LEFT / RIGHT aim · HOLD FIRE · build between waves");
}

function drawWeaponIcon(c,w){
  if(!c)return;const g=c.getContext("2d");g.imageSmoothingEnabled=false;

function tryPlaceSlot(sx,sy){
  if(!placeMode||!between)return false;
  let bestS=null,bd=30;
  for(const s of slots){
    if(s.build)continue;
    const d=hypot(s.x-sx,s.y-sy);
    if(d<bd){bd=d;bestS=s;}
  }
  if(!bestS){toast("Tap an empty slot");return true;}
  const b=BUILDS.find(x=>x.id===placeMode);
  if(!b||credits<b.cost){toast("Need credits");return true;}
  credits-=b.cost;
  if(placeMode==="wall"){bestS.build="wall";bestS.hp=140;bestS.max=140;}
  else if(placeMode==="mine"){bestS.build="mine";mines.push({x:bestS.x,y:bestS.y,slot:bestS,r:38,dmg:60});}
  else if(placeMode==="aux"){bestS.build="aux";bestS.hp=70;bestS.max=70;aux.push({x:bestS.x,y:bestS.y,slot:bestS,cd:0,aim:0});}
  placeMode=null;toast("Built");buildShop();hud();return true;
}

function worldFromEvent(e){
  const r=cv.getBoundingClientRect();
  const x=((e.clientX??e.touches?.[0]?.clientX)-r.left)-CX;
  const y=((e.clientY??e.touches?.[0]?.clientY)-r.top)-CY;
  return{x:x/SCALE,y:y/SCALE};
}
cv.addEventListener("pointerdown",e=>{
  if(!between||!placeMode)return;
  const p=worldFromEvent(e);
  tryPlaceSlot(p.x,p.y);
});

  }

  startWave();loop(last);
};

function update(dt){
  t+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*20);
  if(genPower>0&&hp<maxHp)hp=Math.min(maxHp,hp+genPower*4*dt);
  if(waveActive) waveTimer+=dt;

  if(waveActive){
    if(toSpawn>0){
      spawnAcc+=dt;
      const interval=Math.max(0.035,0.22-wave*0.015);
      while(spawnAcc>=interval&&toSpawn>0){spawnAcc-=interval;spawnOne();toSpawn--;}
    }else if(enemies.length===0){
      endWave();
    }
    tryFire(dt);
  }else if(between&&mainAuto()){
    const tgt=nearestEnemy(0,0);
    if(tgt){const want=Math.atan2(tgt.y,tgt.x);let d=want-aim;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;aim+=clamp(d,-3*dt,3*dt);}
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.burn>0){e.burn-=dt;e.hp-=14*dt;if(e.hp<=0){killEnemy(e,i);continue;}}
    e.hit=Math.max(0,e.hit-dt);
    e.frame+=dt*6;
    /* v1.5.6 short front-cone vision: chase when seen, last-seen then stop; no sound */
    if(e.fa==null){e.fa=Math.atan2(-e.y,-e.x)+rnd(-0.4,0.4);e.ai="wander";e.wT=rnd(0.3,1.2);e.wA=e.fa;}
    const VR=95,VH=0.62;
    const seeAt=(tx,ty)=>{const dx=tx-e.x,dy=ty-e.y,d=hypot(dx,dy);if(d>VR||d<0.01)return false;let a=Math.atan2(dy,dx)-e.fa;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return Math.abs(a)<=VH;};
    let tgt=null;
    if(seeAt(0,0))tgt={x:0,y:0};
    else{
      let bd=VR;
      for(const s of slots){if(!s.build)continue;if(s.build!=="wall"&&s.build!=="decoy"&&s.build!=="gunner"&&s.build!=="medic"&&s.build!=="aux")continue;const d=hypot(s.x-e.x,s.y-e.y);if(d<bd&&seeAt(s.x,s.y)){bd=d;tgt={x:s.x,y:s.y};}}
      for(const a of aux){const d=hypot(a.x-e.x,a.y-e.y);if(d<bd&&seeAt(a.x,a.y)){bd=d;tgt={x:a.x,y:a.y};}}
    }
    if(tgt){e.ai="chase";e.lx=tgt.x;e.ly=tgt.y;const want=Math.atan2(tgt.y-e.y,tgt.x-e.x);let ad=want-e.fa;while(ad>Math.PI)ad-=Math.PI*2;while(ad<-Math.PI)ad+=Math.PI*2;e.fa+=clamp(ad,-4.2*dt,4.2*dt);}
    else if(e.ai==="chase"){e.ai="seekLast";}
    if(e.ai==="seekLast"&&e.lx!=null){
      const d=hypot(e.lx-e.x,e.ly-e.y);
      if(d<12){e.ai="wander";e.lx=e.ly=null;e.wT=rnd(0.6,2);e.wA=e.fa+rnd(-1.2,1.2);}
      else{const want=Math.atan2(e.ly-e.y,e.lx-e.x);let ad=want-e.fa;while(ad>Math.PI)ad-=Math.PI*2;while(ad<-Math.PI)ad+=Math.PI*2;e.fa+=clamp(ad,-3*dt,3*dt);}
    }else if(e.ai!=="chase"){
      e.ai="wander";e.wT=(e.wT||0)-dt;if(e.wT<=0){e.wT=rnd(0.5,1.8);e.wA=e.fa+rnd(-1.4,1.4);}
      let ad=(e.wA||0)-e.fa;while(ad>Math.PI)ad-=Math.PI*2;while(ad<-Math.PI)ad+=Math.PI*2;e.fa+=clamp(ad,-2.2*dt,2.2*dt);
      const inward=Math.atan2(-e.y,-e.x);let id=inward-e.fa;while(id>Math.PI)id-=Math.PI*2;while(id<-Math.PI)id+=Math.PI*2;if(Math.abs(id)<1.1)e.fa+=id*0.4*dt;
    }
    const spMul=(e.ai==="chase"||e.ai==="seekLast")?1:(e.ai==="wander"?0.55:1);
    let dx=Math.cos(e.fa),dy=Math.sin(e.fa);
    for(const s of slots){
      if(s.build!=="wall"||s.hp<=0)continue;
      const d=hypot(e.x-s.x,e.y-s.y);
      if(d<20){
        s.hp-=e.dmg*dt*0.7;
        e.x+= (e.x-s.x)/(d||1)*e.sp*dt*0.35;
        e.y+= (e.y-s.y)/(d||1)*e.sp*dt*0.35;
        if(s.hp<=0){s.build=null;toast("Wall broken");}
        dx*=0.15;dy*=0.15;
      }
    }
    e.x+=dx*e.sp*spMul*dt;e.y+=dy*e.sp*spMul*dt;
    if(hypot(e.x,e.y)<13+e.r*0.45){
      hp-=e.dmg*dt*0.7;
      e.x+=dx*-22*dt;e.y+=dy*-22*dt;
      if(hp<=0){hp=0;die();return;}
    }
    for(let mi=mines.length-1;mi>=0;mi--){
      const m=mines[mi];
      if(hypot(e.x-m.x,e.y-m.y)<m.r*0.55){
        explode(m.x,m.y,m.r,m.dmg);
        if(m.slot)m.slot.build=null;
        mines.splice(mi,1);
        break;
      }
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const steps=Math.max(1,Math.ceil(hypot(b.vx,b.vy)*dt/8));
    const sdt=dt/steps;
    let deadB=false;
    for(let step=0;step<steps&&!deadB;step++){
      b.x+=b.vx*sdt;b.y+=b.vy*sdt;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(hypot(b.x-e.x,b.y-e.y)<e.r+5){
          e.hp-=b.dmg;e.hit=.1;
          if(b.fire)e.burn=Math.max(e.burn,b.fire);if(b.slow)e.slowT=b.slow;if(b.acid)e.acid=Math.max(e.acid||0,b.acid);if(b.chain)chainZap(e,b);if(b.fx)b.fx(e,b);
          if(b.explode){e.hp+=b.dmg*0.8*(1-Math.min(1,hypot(e.x-b.x,e.y-b.y)/b.explode)*0.5);explode(b.x,b.y,b.explode,b.dmg*0.8);deadB=true;}
          else if(b.pierce>0){b.pierce--;b.dmg*=0.85;}
          else deadB=true;
          if(e.hp<=0)killEnemy(e,j);
          if(deadB)break;
        }
      }
    }
    b.life-=dt;
    if(deadB||b.life<=0||hypot(b.x,b.y)>620)bullets.splice(i,1);
  }

  for(let i=gibs.length-1;i>=0;i--){
    const g=gibs[i];g.age=(g.age||0)+dt;g.z=SUCK>0?0:(g.age<.35?Math.sin(g.age/.35*Math.PI)*10:0);g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=(1-3*dt);g.vy*=(1-3*dt);g.life-=dt;
    if(g.life<=0)gibs.splice(i,1);
  }
  for(const b of blood)b.life-=dt*0.008;
  blood=blood.filter(b=>b.life>0);
  for(let i=floaters.length-1;i>=0;i--){floaters[i].t+=dt;floaters[i].y-=22*dt;if(floaters[i].t>0.85)floaters.splice(i,1);}
  hud();
}

function die(){
  dead=true;running=false;waveActive=false;between=false;
  if(wave>best){best=wave;localStorage.setItem("swarm.best",String(best));}
  banner("OVERRUN",2000);
  setTimeout(()=>{
    $("overlay").classList.remove("off");
    $("best").textContent="Died on wave "+wave+" · kills "+kills+" · Best "+best;
    $("startBtn").textContent="TRY AGAIN";
  },900);
}

/* ========== PIXEL DRAW ========== */
function drawGrid(){
  // dark metallic arena — full field, faint grid
  ctx.fillStyle="#1a1c22";
  ctx.fillRect(-700,-700,1400,1400);
  // subtle noise grit
  ctx.fillStyle="#16181e";
  for(let i=0;i<90;i++){
    const x=((i*73)%380)-190, y=((i*47)%360)-180;
    ctx.fillRect(x,y,3,3);
  }
  // grid lines
  ctx.strokeStyle="rgba(70,80,100,0.22)";
  ctx.lineWidth=1;
  const step=22;
  for(let x=-440;x<=440;x+=step){
    ctx.beginPath();ctx.moveTo(x,-440);ctx.lineTo(x,440);ctx.stroke();
  }
  for(let y=-440;y<=440;y+=step){
    ctx.beginPath();ctx.moveTo(-440,y);ctx.lineTo(440,y);ctx.stroke();
  }
  // metal plate seams
  ctx.strokeStyle="rgba(90,100,120,0.18)";
  ctx.strokeRect(-200,-200,400,400);
  ctx.strokeRect(-140,-140,280,280);
}

function drawCrate(x,y){
  // blue metal crate — top-down
  ctx.fillStyle="#1a3050";ctx.fillRect(x-10,y-8,20,16);
  ctx.fillStyle="#2a5080";ctx.fillRect(x-10,y-8,20,5);
  ctx.fillStyle="#3a70a8";ctx.fillRect(x-9,y-7,18,3);
  ctx.fillStyle="#0e1a2a";ctx.fillRect(x-10,y+6,20,2);
  ctx.fillStyle="#1e4068";ctx.fillRect(x-1,y-6,2,12);
  ctx.fillRect(x-8,y-1,16,2);
  // rivets
  ctx.fillStyle="#6a9acc";
  ctx.fillRect(x-8,y-6,2,2);ctx.fillRect(x+6,y-6,2,2);
  ctx.fillRect(x-8,y+3,2,2);ctx.fillRect(x+6,y+3,2,2);
}
function drawBarrel(x,y){
  ctx.fillStyle="#3a0808";ctx.beginPath();ctx.ellipse(x,y+2,9,8,0,0,6.28);ctx.fill();
  ctx.fillStyle="#c01818";ctx.beginPath();ctx.ellipse(x,y,8,9,0,0,6.28);ctx.fill();
  ctx.fillStyle="#e03028";ctx.beginPath();ctx.ellipse(x,y,7,8,0,0,6.28);ctx.fill();
  ctx.fillStyle="#ff5040";ctx.beginPath();ctx.ellipse(x,y-6,6.5,3.2,0,0,6.28);ctx.fill();
  ctx.fillStyle="#ffcc33";ctx.fillRect(x-3.5,y-2,7,4);
  ctx.fillStyle="#fff";ctx.fillRect(x-1,y-1,2,2);
  ctx.fillStyle="#801010";ctx.fillRect(x-7,y+5,14,2);
}
function drawPlate(d){
  ctx.fillStyle="#22262e";ctx.fillRect(d.x,d.y,d.s,d.s*0.7);
  ctx.fillStyle="#2a3038";ctx.fillRect(d.x,d.y,d.s,2);
}

function drawZombie(e){
  const bob=Math.sin(e.frame)*1.2;
  ctx.save();ctx.translate(e.x|0,(e.y+bob)|0);
  if(e.hit>0){ctx.globalAlpha=0.75;}
  // shadow
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.beginPath();ctx.ellipse(0,7,7,3,0,0,6.28);ctx.fill();
  // legs
  const leg=Math.sin(e.frame*1.4)*2;
  ctx.fillStyle="#2a2a28";
  ctx.fillRect(-5,4,4,6+leg);ctx.fillRect(1,4,4,6-leg);
  // body / shirt
  ctx.fillStyle=e.shirt||"#3a5a3a";
  ctx.fillRect(-6,-2,12,8);
  // arms
  ctx.fillStyle="#6a8a5a";
  ctx.fillRect(-9,0,3,6);ctx.fillRect(6,0,3,6);
  // head
  ctx.fillStyle="#7a9a5a";
  ctx.fillRect(-4,-9,8,7);
  // hair/skull dark
  ctx.fillStyle="#2a3020";ctx.fillRect(-4,-9,8,2);
  // eyes glow
  ctx.fillStyle="#ff3030";ctx.fillRect(-3,-6,2,2);ctx.fillRect(1,-6,2,2);
  // mouth gash
  ctx.fillStyle="#4a1010";ctx.fillRect(-2,-3,4,2);
  if(e.burn>0){ctx.fillStyle="#ff8020";ctx.globalAlpha=0.7;ctx.fillRect(-5,-12,10,3);}
  ctx.restore();ctx.globalAlpha=1;
}

function drawRunner(e){
  const bob=Math.sin(e.frame*1.8)*1.5;
  ctx.save();ctx.translate(e.x|0,(e.y+bob)|0);
  if(e.hit>0)ctx.globalAlpha=0.75;
  ctx.fillStyle="rgba(0,0,0,0.3)";ctx.beginPath();ctx.ellipse(0,6,5,2.5,0,0,6.28);ctx.fill();
  ctx.fillStyle="#2a2a28";ctx.fillRect(-4,3,3,5);ctx.fillRect(1,3,3,5);
  ctx.fillStyle=e.shirt||"#6a3a3a";ctx.fillRect(-5,-1,10,6);
  ctx.fillStyle="#8a6a4a";ctx.fillRect(-3,-7,6,6);
  ctx.fillStyle="#ff4040";ctx.fillRect(-2,-5,1,1);ctx.fillRect(1,-5,1,1);
  ctx.restore();ctx.globalAlpha=1;
}

function drawMutant(e){
  const bob=Math.sin(e.frame*0.8)*0.8;
  ctx.save();ctx.translate(e.x|0,(e.y+bob)|0);
  if(e.hit>0)ctx.globalAlpha=0.75;
  ctx.fillStyle="rgba(0,0,0,0.4)";ctx.beginPath();ctx.ellipse(0,10,12,4,0,0,6.28);ctx.fill();
  // bulky red body
  ctx.fillStyle="#6a1818";ctx.fillRect(-12,-4,24,16);
  ctx.fillStyle="#a02828";ctx.fillRect(-11,-3,22,12);
  // shoulders
  ctx.fillStyle="#8a2020";ctx.fillRect(-15,-2,6,10);ctx.fillRect(9,-2,6,10);
  // head
  ctx.fillStyle="#c04040";ctx.fillRect(-7,-14,14,12);
  ctx.fillStyle="#e06050";ctx.fillRect(-6,-13,12,8);
  // horns / ridges
  ctx.fillStyle="#4a1010";ctx.fillRect(-9,-16,4,5);ctx.fillRect(5,-16,4,5);
  // eyes
  ctx.fillStyle="#ffee44";ctx.fillRect(-5,-10,3,3);ctx.fillRect(2,-10,3,3);
  ctx.fillStyle="#200";ctx.fillRect(-4,-9,1,1);ctx.fillRect(3,-9,1,1);
  // mouth fangs
  ctx.fillStyle="#200";ctx.fillRect(-4,-4,8,3);
  ctx.fillStyle="#eee";ctx.fillRect(-3,-4,2,3);ctx.fillRect(1,-4,2,3);
  // hp bar
  ctx.fillStyle="#200";ctx.fillRect(-12,-18,24,3);
  ctx.fillStyle="#e44";ctx.fillRect(-12,-18,24*(e.hp/e.max),3);
  if(e.burn>0){ctx.fillStyle="#ff8020";ctx.globalAlpha=0.65;ctx.fillRect(-10,-20,20,4);}
  ctx.restore();ctx.globalAlpha=1;
}

function drawTurret(){
  // CORE RULE: tiny single-barrel — square/round base, one short barrel
  ctx.save();
  // shadow
  ctx.fillStyle="rgba(0,0,0,0.45)";
  ctx.beginPath();ctx.ellipse(1,5,13,7,0,0,6.28);ctx.fill();
  // base plate
  ctx.fillStyle="#2a2e38";
  ctx.beginPath();ctx.arc(0,0,12,0,6.28);ctx.fill();
  ctx.fillStyle="#3a4050";
  ctx.beginPath();ctx.arc(0,0,10,0,6.28);ctx.fill();
  // riveted ring
  ctx.strokeStyle="#1a1e28";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,11,0,6.28);ctx.stroke();
  ctx.fillStyle="#6a7080";
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    ctx.fillRect(Math.cos(a)*9-1,Math.sin(a)*9-1,2,2);
  }
  // center hub
  ctx.fillStyle="#4a5060";ctx.beginPath();ctx.arc(0,0,5,0,6.28);ctx.fill();
  ctx.fillStyle="#8a90a0";ctx.beginPath();ctx.arc(0,0,3,0,6.28);ctx.fill();
  // single barrel
  ctx.rotate(aim);
  ctx.fillStyle="#1a1e24";ctx.fillRect(3,-3,15,6);
  ctx.fillStyle="#5a6070";ctx.fillRect(4,-2,13,4);
  ctx.fillStyle="#8a90a0";ctx.fillRect(4,-2,13,1.5);
  ctx.fillStyle="#c8c8a0";ctx.fillRect(15,-1.5,4,3);
  // muzzle flash
  if(fireCd>0 && fireCd<0.05){
    ctx.fillStyle="#fff8c0";ctx.fillRect(18,-3,7,6);
    ctx.fillStyle="#ff9020";ctx.fillRect(20,-2,5,4);
  }
  ctx.restore();
  // hp ring
  ctx.strokeStyle="#1a0808";ctx.lineWidth=3.5;
  ctx.beginPath();ctx.arc(0,0,17,-Math.PI/2,-Math.PI/2+Math.PI*2,false);ctx.stroke();
  ctx.strokeStyle=hp/maxHp>0.35?"#5c5":"#e33";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(0,0,17,-Math.PI/2,-Math.PI/2+Math.PI*2*(hp/maxHp),false);ctx.stroke();
}

function draw(){
  const shx=(Math.random()-0.5)*shake, shy=(Math.random()-0.5)*shake;
  // letterbox / chrome around arena
  ctx.fillStyle="#0c0e14";ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(CX+shx,CY+shy);
  ctx.scale(SCALE,SCALE);

  drawGrid();

  // decor under blood
  for(const d of decor){
    if(d.k==="plate") drawPlate(d);
  }
  for(const d of decor){
    if(d.k==="crate") drawCrate(d.x,d.y);
    else if(d.k==="barrel") drawBarrel(d.x,d.y);
  }

  // blood pools (heavy gore)
  for(const b of blood){
    ctx.globalAlpha=clamp(b.life*0.95,0,0.9);
    if(b.dot){
      ctx.fillStyle="#8a0810";
      ctx.fillRect((b.x)|0,(b.y)|0,b.r|0,(b.r*0.7)|0);
    }else{
      ctx.fillStyle="#5a0810";
      ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*0.65,b.rot||0,0,6.28);ctx.fill();
      ctx.fillStyle="#8a1018";
      ctx.beginPath();ctx.ellipse(b.x-b.r*0.2,b.y-b.r*0.1,b.r*0.45,b.r*0.3,b.rot||0,0,6.28);ctx.fill();
